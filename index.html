est :", ["une action de contact localisée", "une action à distance", "une action répartie à distance", "une action chimique"], "La main touche la corde en une petite zone."], ["Un phoque maintient un bâton en équilibre sur son nez. Le type de l'action du phoque sur le bâton est :", ["une action de contact localisée", "une action à distance", "une action de contact répartie", "une action magnétique"], "Le contact se fait en un point du bâton."], ["L'effet de l'action du phoque qui maintient le bâton en équilibre est :", ["statique (maintien en équilibre)", "dynamique (mise en mouvement)", "chimique", "électrique"], "Le bâton reste immobile : l'action le maintient en équilibre."], ["Un footballeur frappe le ballon qui part loin. L'effet de l'action est :", ["dynamique", "statique", "nul", "chimique"], "L'action met le ballon en mouvement."], ["On écrase une canette avec le pied. L'effet de l'action est :", ["statique (déformation)", "dynamique", "à distance", "magnétique"], "La canette est déformée."], ["Dans l'action du marteau sur le clou, l'acteur est :", ["le marteau", "le clou", "la planche", "la main"], "Le marteau exerce l'action sur le clou (receveur)."], ["Dans l'action du marteau sur le clou, le receveur est :", ["le clou", "le marteau", "la Terre", "l'air"], "Le clou subit l'action."], ["L'action de l'eau sur la coque d'un bateau est :", ["une action de contact répartie", "une action de contact localisée", "une action à distance", "aucune action"], "L'eau agit sur toute la surface immergée."], ["L'action de la table sur un vase posé dessus est :", ["une action de contact répartie", "une action à distance", "une action magnétique", "une action localisée à distance"], "Elle s'exerce sur toute la surface de contact."], ["L'action du fil sur un corps suspendu est :", ["une action de contact localisée", "une action à distance", "une action répartie à distance", "une action électrique"], "Le fil touche le corps en un point d'attache."], ["La Terre attire la Lune. Cette action est :", ["à distance", "de contact localisée", "de contact répartie", "statique"], "Il n'y a aucun contact entre la Terre et la Lune."], ["Un frein de vélo ralentit la roue. L'effet de l'action est :", ["dynamique (modification de la vitesse)", "statique", "chimique", "aucun effet"], "Changer la vitesse est un effet dynamique."], ["Un vent violent courbe un arbre. L'effet est :", ["statique (déformation)", "dynamique", "nul", "électrique"], "L'arbre se déforme."], ["Une balle de tennis est renvoyée par une raquette. L'action de la raquette :", ["modifie la trajectoire et la vitesse de la balle", "ne change rien", "est une action à distance", "est répartie sur toute la raquette seulement"], "Effet dynamique : changement de trajectoire et de vitesse."], ["Le peigne frotté attire de petits morceaux de papier. Cette action est :", ["à distance", "de contact localisée", "de contact répartie", "chimique"], "C'est une action électrique à distance."], ["Pour étudier une action mécanique, on précise :", ["l'acteur, le receveur, le type et l'effet", "la masse et la couleur", "la température", "la vitesse du son"], "On décrit qui agit, sur quoi, comment et avec quel effet."], ["L'action d'un ressort tendu sur un chariot qui démarre est :", ["une action de contact localisée à effet dynamique", "une action à distance à effet statique", "une action répartie à distance", "une action sans effet"], "Le ressort touche le chariot en un point et le met en mouvement."], ["Un aimant arrête une bille d'acier qui roulait. L'effet de l'action est :", ["dynamique", "statique", "nul", "chimique"], "La vitesse de la bille change : effet dynamique."], ["L'action de l'air sur un parachute est :", ["une action de contact répartie", "une action à distance", "une action localisée", "une action magnétique"], "L'air agit sur toute la toile du parachute."]]},
{sem:1,name:"Notion de force",qs:[["Vrai ou faux : Nous mesurons l'intensité d'une force à l'aide d'un dynamomètre.", ["Vrai", "Faux"], "Le dynamomètre mesure l'intensité des forces en newtons."], ["Vrai ou faux : L'unité internationale de l'intensité d'une force est le kilogramme.", ["Faux", "Vrai"], "C'est le newton (N)."], ["Vrai ou faux : Une force est caractérisée par son point d'application, sa droite d'action, son sens et son intensité.", ["Vrai", "Faux"], "Ce sont les quatre caractéristiques d'une force."], ["Vrai ou faux : Une force se représente par un vecteur.", ["Vrai", "Faux"], "Le vecteur traduit les quatre caractéristiques de la force."], ["Vrai ou faux : Un dynamomètre mesure directement la masse d'un objet.", ["Faux", "Vrai"], "Il mesure une force (le poids en newtons) ; la masse se mesure avec une balance."], ["Compléter : La force est une grandeur notée F, l'unité internationale de son intensité est le …… qui se mesure avec un dynamomètre.", ["newton (N)", "kilogramme (kg)", "joule (J)", "watt (W)"], "Intensité en newtons, mesurée au dynamomètre."], ["Compléter : Une force est caractérisée par son point d'application, sa droite d'action, son …… et son intensité.", ["sens", "poids", "volume", "matériau"], "Point d'application, droite d'action, sens, intensité."], ["Cocher la bonne réponse : L'appareil de mesure de l'intensité d'une force est :", ["le dynamomètre", "la balance", "le voltmètre", "le chronomètre"], "Le dynamomètre mesure les forces."], ["Avec l'échelle 1 cm → 2 N, une force de 6 N est représentée par un vecteur de longueur :", ["3 cm", "12 cm", "6 cm", "2 cm"], "6 / 2 = 3 cm."], ["Avec l'échelle 1 cm → 3 N, une force de 6 N est représentée par un vecteur de longueur :", ["2 cm", "18 cm", "3 cm", "6 cm"], "6 / 3 = 2 cm."], ["Avec l'échelle 1 cm → 4 N, un vecteur de 5 cm représente une force de :", ["20 N", "1,25 N", "9 N", "4 N"], "5 × 4 = 20 N."], ["Avec l'échelle 1 cm → 0,1 N, un vecteur de 3 cm représente une force de :", ["0,3 N", "30 N", "3 N", "0,03 N"], "3 × 0,1 = 0,3 N."], ["Le satellite M6A a un poids d'environ 9000 N. Avec l'échelle 1 cm → 3 000 N, on le représente par un vecteur de :", ["3 cm", "27 cm", "0,3 cm", "9 cm"], "9000 / 3000 = 3 cm."], ["La droite d'action du poids d'un corps est :", ["la verticale passant par son centre de gravité", "l'horizontale", "une droite quelconque", "la ligne du sol"], "Le poids est vertical."], ["Le sens du poids d'un corps est :", ["vers le bas", "vers le haut", "vers la droite", "vers la gauche"], "Le poids est dirigé vers le centre de la Terre."], ["Le point d'application du poids d'un corps est :", ["son centre de gravité G", "le point de contact avec le sol", "le sommet du corps", "le point d'attache du fil"], "Le poids s'applique au centre de gravité G."], ["Le point d'application de la force exercée par un fil sur un corps suspendu est :", ["le point d'attache du fil sur le corps", "le centre de gravité", "le plafond", "le centre de la Terre"], "La force du fil s'applique au point de contact fil-corps."], ["La force exercée par un fil vertical sur un corps suspendu est dirigée :", ["vers le haut, le long du fil", "vers le bas", "horizontalement", "vers le centre de la Terre"], "Le fil retient le corps : force verticale vers le haut."], ["Un dynamomètre indique 4,5 N quand on y accroche un objet. L'intensité de la force exercée par l'objet sur le ressort est :", ["4,5 N", "45 N", "0,45 N", "4,5 kg"], "Le dynamomètre lit directement l'intensité de la force en newtons."], ["Le vecteur force est noté :", ["F avec une flèche au-dessus (F⃗)", "F seul", "|F|", "F²"], "La flèche indique qu'il s'agit d'un vecteur ; F seul désigne l'intensité."], ["Parmi ces grandeurs, laquelle n'est pas une caractéristique d'une force ?", ["sa couleur", "son sens", "son intensité", "son point d'application"], "La couleur ne caractérise pas une force."], ["Un dynamomètre gradué de 0 à 10 N permet de mesurer :", ["une force de 7 N", "une force de 15 N", "une masse de 7 kg", "une tension de 7 V"], "On ne doit pas dépasser le calibre de 10 N."], ["La force exercée par un aimant sur un clou a pour point d'application :", ["le centre de gravité du clou", "l'aimant", "la Terre", "le bout de l'aimant"], "C'est une action à distance répartie : on la représente au centre de gravité."], ["La force de la table sur un livre posé est dirigée :", ["verticalement vers le haut", "verticalement vers le bas", "horizontalement", "vers le centre de la Terre"], "La table soutient le livre vers le haut."], ["Pour représenter une force de 2,5 N avec l'échelle 1 cm → 0,5 N, on trace un vecteur de :", ["5 cm", "1,25 cm", "2,5 cm", "0,5 cm"], "2,5 / 0,5 = 5 cm."], ["Deux forces de même droite d'action, même sens et de 3 N et 5 N s'exercent sur un corps. Leur effet est équivalent à une force de :", ["8 N", "2 N", "15 N", "0 N"], "Même sens : les intensités s'ajoutent (3 + 5 = 8 N)."], ["L'intensité d'une force de 1,2 kN est :", ["1200 N", "12 N", "0,0012 N", "120 N"], "1 kN = 1000 N."], ["La force qu'exerce le vent sur une voile a pour point d'application :", ["le centre de la voile (action répartie)", "le mât", "la coque", "la Terre"], "Pour une action répartie, on la représente au centre de la surface."], ["Un ressort de dynamomètre s'allonge davantage quand :", ["l'intensité de la force augmente", "la force diminue", "on le chauffe", "on le peint"], "L'allongement est proportionnel à l'intensité."], ["Un élève représente le poids d'une pomme par une flèche horizontale. Son erreur porte sur :", ["la droite d'action", "l'intensité", "le point d'application seulement", "l'échelle"], "Le poids est vertical, pas horizontal."]]},
{sem:1,name:"Équilibre d'un solide soumis à deux forces",qs:[["Vrai ou faux : Un solide au repos soumis à deux forces est en équilibre.", ["Vrai", "Faux"], "Au repos sous l'action de deux forces : les deux forces se compensent."], ["Vrai ou faux : Si deux forces s'appliquent sur un solide et que leur somme vectorielle est nulle, le solide est en équilibre.", ["Vrai", "Faux"], "Condition d'équilibre : F⃗₁ + F⃗₂ = 0⃗."], ["Vrai ou faux : Un solide soumis à deux forces de même intensité est toujours en équilibre.", ["Faux", "Vrai"], "Il faut aussi la même droite d'action et des sens opposés."], ["Vrai ou faux : Un solide en équilibre sous deux forces vérifie F⃗₁ = F⃗₂.", ["Faux", "Vrai"], "Les forces sont opposées : F⃗₁ = −F⃗₂."], ["Vrai ou faux : Pour un corps suspendu en équilibre à un fil, la tension du fil a la même intensité que le poids.", ["Vrai", "Faux"], "Équilibre : T = P, même droite d'action, sens opposés."], ["Compléter : Un solide soumis à deux forces est en équilibre si les deux forces ont la même droite d'action, la même …… et des sens opposés.", ["intensité", "couleur", "masse", "vitesse"], "Même droite d'action, même intensité, sens opposés."], ["Cocher la bonne réponse : Un corps est en équilibre sous l'action de deux forces F⃗₁ et F⃗₂, alors :", ["F⃗₁ + F⃗₂ = 0⃗", "F⃗₁ − F⃗₂ = 0⃗", "F⃗₁ = F⃗₂", "F₁ + F₂ = 0"], "La somme vectorielle des deux forces est nulle."], ["Cocher la bonne réponse : Si un corps est en équilibre sous deux forces F⃗₁ et F⃗₂, on peut écrire :", ["F⃗₁ = −F⃗₂", "F⃗₁ = F⃗₂", "F₁ = 2F₂", "F₁ + F₂ = 0"], "Les deux vecteurs sont opposés."], ["Un sac de sable accroché à un dynamomètre est en équilibre. Le bilan des forces exercées sur le sac est :", ["le poids P⃗ et la force du dynamomètre F⃗", "le poids seulement", "la force du dynamomètre seulement", "le poids, la force du dynamomètre et l'air"], "Deux forces : l'action de la Terre et l'action du dynamomètre."], ["Un corps de masse m = 600 g est suspendu en équilibre à un dynamomètre (g = 10 N/kg). Le dynamomètre indique :", ["6 N", "600 N", "60 N", "0,6 N"], "P = m × g = 0,6 × 10 = 6 N ; à l'équilibre F = P."], ["Un corps de masse m = 800 g est suspendu en équilibre à un fil (g = 10 N/kg). L'intensité de la force du fil est :", ["8 N", "80 N", "800 N", "0,8 N"], "T = P = 0,8 × 10 = 8 N."], ["Un phoque maintient en équilibre un bâton de masse 350 g (g = 10 N/kg). L'intensité de la force du phoque sur le bâton est :", ["3,5 N", "35 N", "350 N", "0,35 N"], "F = P = 0,35 × 10 = 3,5 N."], ["La force exercée par le phoque sur le bâton en équilibre est dirigée :", ["verticalement vers le haut", "verticalement vers le bas", "horizontalement", "vers le centre de la Terre"], "Elle est opposée au poids, qui est vertical vers le bas."], ["Un vase est en équilibre sur une table. Son poids est représenté par un vecteur de 3 cm avec l'échelle 1 cm → 4 N. L'intensité de la force R⃗ de la table est :", ["12 N", "7 N", "0,75 N", "1,33 N"], "P = 3 × 4 = 12 N ; à l'équilibre R = P = 12 N."], ["Le vase précédent (P = 12 N) a une masse de (g = 10 N/kg) :", ["1,2 kg", "120 kg", "12 kg", "0,12 kg"], "m = P/g = 12/10 = 1,2 kg."], ["Une lampe suspendue à un fil a un poids représenté par 2 cm avec l'échelle 1 cm → 0,1 N. L'intensité de la tension du fil est :", ["0,2 N", "2 N", "0,05 N", "20 N"], "P = 2 × 0,1 = 0,2 N ; T = P = 0,2 N."], ["La masse de cette lampe (P = 0,2 N ; g = 10 N/kg) est :", ["20 g", "2 kg", "200 g", "2 g"], "m = 0,2/10 = 0,02 kg = 20 g."], ["Un livre est posé sur une table. Les forces qui s'exercent sur le livre sont :", ["son poids et la réaction de la table", "son poids seulement", "la réaction de la table seulement", "aucune force"], "Le livre est en équilibre sous deux forces."], ["Un corps soumis à deux forces de 5 N, de même droite d'action et de même sens :", ["n'est pas en équilibre", "est en équilibre", "est toujours au repos", "n'a pas de poids"], "Les forces doivent être de sens opposés."], ["Un corps soumis à deux forces de 5 N et 3 N, de même droite d'action et de sens opposés :", ["n'est pas en équilibre", "est en équilibre", "a un poids nul", "est toujours immobile"], "Les intensités sont différentes."], ["Un corps soumis à deux forces opposées de 4 N qui n'ont pas la même droite d'action :", ["n'est pas en équilibre (il tourne)", "est en équilibre", "tombe verticalement", "est immobile"], "Sans même droite d'action, les forces font tourner le corps."], ["Sur la Lune (gL = 1,63 N/kg), le poids d'un corps suspendu à un fil est PL = 8,15 N. L'intensité de la force du fil est :", ["8,15 N", "1,63 N", "5 N", "13,3 N"], "À l'équilibre, T = P = 8,15 N."], ["La masse du corps précédent (PL = 8,15 N ; gL = 1,63 N/kg) est :", ["5 kg", "13,3 kg", "8,15 kg", "0,2 kg"], "m = 8,15/1,63 = 5 kg."], ["Une boule de masse 2 kg est posée sur le sol (g = 10 N/kg). La force exercée par le sol sur la boule vaut :", ["20 N", "2 N", "0,2 N", "200 N"], "R = P = 2 × 10 = 20 N."], ["Les deux forces d'un corps en équilibre se représentent par :", ["deux vecteurs de même longueur, de sens opposés, sur la même droite", "deux vecteurs de même sens", "deux vecteurs perpendiculaires", "un seul vecteur"], "C'est la traduction graphique des conditions d'équilibre."], ["Un tableau accroché au mur par un fil vertical est en équilibre. La droite d'action de la tension du fil :", ["passe par le centre de gravité du tableau", "est horizontale", "passe par le coin du tableau", "est quelconque"], "Elle est confondue avec la droite d'action du poids."], ["On accroche un objet de 4 N à un dynamomètre de calibre 5 N. À l'équilibre, l'allongement du ressort correspond à :", ["4 N", "5 N", "9 N", "1 N"], "Le dynamomètre indique l'intensité du poids : 4 N."], ["Un élève tient un sac immobile. La force qu'il exerce est :", ["égale et opposée au poids du sac", "plus grande que le poids", "plus petite que le poids", "nulle"], "Le sac est en équilibre : F = P."], ["Une balle au repos sur une table : si on retire la table, la balle tombe car :", ["seul le poids s'exerce, l'équilibre est rompu", "son poids devient nul", "sa masse augmente", "l'air la pousse"], "Sans la réaction de la table, le poids n'est plus compensé."], ["Si F⃗₁ et F⃗₂ sont les deux forces d'un corps en équilibre, et F₁ = 15 N, alors :", ["F₂ = 15 N", "F₂ = 0 N", "F₂ = 30 N", "F₂ = 7,5 N"], "Même intensité : F₂ = F₁ = 15 N."]]},
{sem:1,name:"Le poids et la masse",qs:[["Vrai ou faux : La masse d'un corps dépend de son poids sur Terre.", ["Faux", "Vrai"], "La masse dépend de la quantité de matière ; elle ne dépend pas du lieu."], ["Vrai ou faux : L'intensité de pesanteur dépend du poids du corps.", ["Faux", "Vrai"], "g dépend du lieu (planète, altitude, latitude), pas du corps."], ["Vrai ou faux : Le poids et la masse sont proportionnels.", ["Vrai", "Faux"], "P = m × g : à un lieu donné, P est proportionnel à m."], ["Vrai ou faux : La masse d'un objet change lorsqu'on le transporte de la Terre vers la Lune.", ["Faux", "Vrai"], "La masse ne change pas ; c'est le poids qui change."], ["Vrai ou faux : Le poids d'une personne sur la Lune est 30 kg.", ["Faux", "Vrai"], "Le poids s'exprime en newtons (N), pas en kilogrammes."], ["Vrai ou faux : Nous mesurons l'intensité du poids d'un corps à l'aide d'une balance.", ["Faux", "Vrai"], "Le poids se mesure avec un dynamomètre ; la balance mesure la masse."], ["Vrai ou faux : Nous exprimons l'intensité du poids d'un corps par la relation P = m × g.", ["Vrai", "Faux"], "P en N, m en kg, g en N/kg."], ["Vrai ou faux : L'intensité de pesanteur diminue quand l'altitude augmente.", ["Vrai", "Faux"], "Plus on s'éloigne de la Terre, plus g diminue."], ["Compléter : …… est la force exercée par la Terre sur un corps près de sa surface.", ["Le poids", "La masse", "La vitesse", "La réaction"], "Le poids est l'action de la Terre sur un corps."], ["Compléter : La relation entre le poids P, la masse m et l'intensité de pesanteur g s'écrit ……", ["P = m × g", "P = m / g", "m = P × g", "g = m / P"], "P = m × g."], ["Compléter : La masse d'un objet est une grandeur liée à la quantité de …… qui le constitue.", ["matière", "énergie", "vitesse", "chaleur"], "La masse mesure la quantité de matière."], ["Compléter le tableau : L'unité internationale de l'intensité de pesanteur g est ……", ["le N/kg", "le N", "le kg", "le m/s"], "g s'exprime en newtons par kilogramme."], ["Compléter le tableau : La masse se mesure avec ……", ["une balance", "un dynamomètre", "un voltmètre", "un chronomètre"], "Instrument de mesure de la masse : la balance."], ["Cocher la bonne réponse : Le poids d'un corps dépend de :", ["sa masse et le lieu où il se trouve", "sa forme", "sa couleur", "sa température"], "P = m × g : il dépend de m et de g (le lieu)."], ["Cocher la bonne réponse : L'intensité de pesanteur g varie selon :", ["la planète et l'altitude", "la quantité de matière", "la couleur du corps", "la forme du corps"], "g dépend du lieu : planète, altitude, latitude."], ["Cocher la bonne réponse : La masse d'un objet dépend de :", ["la quantité de matière", "son poids", "le lieu", "l'altitude"], "La masse ne dépend que de la quantité de matière."], ["Le poids d'un corps de masse 150 g à la surface de la Terre (g = 10 N/kg) est :", ["1,5 N", "15 N", "150 N", "150 g"], "P = 0,15 × 10 = 1,5 N."], ["Le poids d'un corps sur Terre est 5 N (gT = 10 N/kg). Sur la Lune (gL = 1,6 N/kg), sa masse et son poids sont :", ["m = 500 g ; P = 0,8 N", "m = 500 g ; P = 5 N", "m = 900 g ; P = 0,8 N", "m = 80 g ; P = 0,8 N"], "m = 5/10 = 0,5 kg (inchangée) ; PL = 0,5 × 1,6 = 0,8 N."], ["Le poids d'un corps sur Terre est PT = 15 N (gT = 10 N/kg ; gL = 1,6 N/kg). Son poids sur la Lune est :", ["2,4 N", "15 N", "1,5 N", "24 N"], "m = 1,5 kg ; PL = 1,5 × 1,6 = 2,4 N."], ["Le poids d'un corps sur Terre est PT = 20 N (gT = 10 N/kg ; gL = 1,66 N/kg). Son poids sur la Lune est :", ["3,32 N", "20 N", "1,66 N", "200 N"], "m = 2 kg ; PL = 2 × 1,66 = 3,32 N."], ["L'intensité du poids d'une personne à Casablanca (gC = 9,8 N/kg) est 686 N. Sa masse est :", ["70 kg", "686 kg", "6722,8 kg", "7 kg"], "m = 686/9,8 = 70 kg."], ["Un sac de ciment de 50 kg au pôle Nord (gP = 9,83 N/kg) a un poids de :", ["491,5 N", "50 N", "489 N", "5,09 N"], "P = 50 × 9,83 = 491,5 N."], ["Le même sac de 50 kg à l'équateur (gE = 9,78 N/kg) a un poids de :", ["489 N", "491,5 N", "50 N", "500 N"], "P = 50 × 9,78 = 489 N."], ["Un astronaute de 75 kg sur Terre (g = 10 N/kg) a un poids de :", ["750 N", "75 N", "7,5 N", "7500 N"], "P = 75 × 10 = 750 N."], ["Dans une station spatiale, un objet de masse 2,5 kg a un poids de 15 N. L'intensité de pesanteur à cette altitude est :", ["6 N/kg", "37,5 N/kg", "0,17 N/kg", "10 N/kg"], "g = P/m = 15/2,5 = 6 N/kg."], ["Le satellite M6A (m = 1105 kg) est à 620 km d'altitude où g = 8,145 N/kg. Son poids est environ :", ["9000 N", "11 050 N", "1105 N", "136 N"], "P = 1105 × 8,145 ≈ 9000 N."], ["Quand un astronaute s'éloigne de la Terre, sa masse et son poids :", ["la masse reste constante, le poids diminue", "les deux diminuent", "les deux restent constants", "la masse diminue, le poids reste constant"], "g diminue avec l'altitude ; la masse ne change pas."], ["L'intensité du poids d'un objet sur la Lune est :", ["inférieure à son poids sur la Terre", "égale à son poids sur la Terre", "supérieure à son poids sur la Terre", "nulle"], "gL ≈ 1,6 N/kg < gT ≈ 10 N/kg."], ["Un cylindre de masse 400 g a un poids de 3,92 N. L'intensité de pesanteur du lieu est :", ["9,8 N/kg", "1,568 N/kg", "0,98 N/kg", "98 N/kg"], "g = P/m = 3,92/0,4 = 9,8 N/kg."], ["La courbe P = f(m) est une droite passant par l'origine. Pour m = 250 g, P = 2,45 N. L'intensité de pesanteur est :", ["9,8 N/kg", "2,45 N/kg", "0,0098 N/kg", "98 N/kg"], "g = 2,45/0,25 = 9,8 N/kg."], ["Avec g = 9,8 N/kg, la masse d'un objet dont le poids est 4,9 N est :", ["0,5 kg", "48 kg", "4,9 kg", "2 kg"], "m = 4,9/9,8 = 0,5 kg."], ["Un corps a un poids de 18 N sur une planète et sa masse est 5 kg. L'intensité de pesanteur sur cette planète est :", ["3,6 N/kg", "90 N/kg", "0,28 N/kg", "23 N/kg"], "g = 18/5 = 3,6 N/kg."], ["Si on mesure un objet sur la Lune, la balance indique :", ["la même masse que sur Terre", "une masse 6 fois plus petite", "une masse nulle", "une masse 6 fois plus grande"], "La masse ne dépend pas du lieu."]]},
{sem:1,name:"La loi d'Ohm",qs:[["Vrai ou faux : La résistance d'un conducteur ohmique diminue lorsque l'intensité du courant augmente.", ["Faux", "Vrai"], "La résistance d'un conducteur ohmique est constante : U et I sont proportionnels."], ["Vrai ou faux : La loi d'Ohm s'écrit U = R × I.", ["Vrai", "Faux"], "U en volts, R en ohms, I en ampères."], ["Vrai ou faux : La caractéristique U = f(I) d'un conducteur ohmique est une droite qui passe par l'origine.", ["Vrai", "Faux"], "U est proportionnelle à I."], ["Vrai ou faux : Un conducteur ohmique augmente l'intensité du courant dans un circuit.", ["Faux", "Vrai"], "Il diminue l'intensité du courant."], ["Vrai ou faux : La résistance d'un conducteur ohmique se mesure avec un ohmmètre.", ["Vrai", "Faux"], "L'ohmmètre mesure directement la résistance, hors circuit."], ["Compléter : Le conducteur ohmique …… l'intensité du courant dans un montage.", ["diminue", "augmente", "ne change pas", "inverse"], "Plus R est grande, plus I est faible."], ["Compléter : La courbe U = f(I) d'un conducteur ohmique s'appelle sa ……", ["caractéristique", "trajectoire", "tension", "puissance"], "C'est la caractéristique tension-intensité."], ["Compléter : L'unité internationale de la résistance électrique est ……", ["l'ohm (Ω)", "le volt (V)", "l'ampère (A)", "le watt (W)"], "R s'exprime en ohms."], ["Compléter le tableau : L'intensité du courant a pour symbole I et se mesure avec ……", ["un ampèremètre", "un voltmètre", "un ohmmètre", "un wattmètre"], "L'ampèremètre se branche en série."], ["Compléter le tableau : La tension électrique a pour symbole U, pour unité le volt et se mesure avec ……", ["un voltmètre", "un ampèremètre", "un ohmmètre", "un compteur"], "Le voltmètre se branche en dérivation."], ["Cocher la bonne réponse : La relation de la loi d'Ohm est :", ["U = R × I", "U = R / I", "I = R × U", "R = U × I"], "U = R × I."], ["Un conducteur ohmique est soumis à U = 6 V et traversé par I = 0,2 A. Sa résistance est :", ["30 Ω", "1,2 Ω", "0,03 Ω", "6,2 Ω"], "R = U/I = 6/0,2 = 30 Ω."], ["Un conducteur ohmique de résistance R = 40 Ω est traversé par I = 150 mA. La tension à ses bornes est :", ["6 V", "6000 V", "0,27 V", "190 V"], "I = 0,15 A ; U = 40 × 0,15 = 6 V."], ["Un conducteur ohmique de résistance R = 100 Ω est soumis à U = 30 V. L'intensité du courant est :", ["0,3 A", "3000 A", "3,33 A", "70 A"], "I = U/R = 30/100 = 0,3 A."], ["Sur la caractéristique d'un conducteur ohmique, U = 5 V pour I = 0,1 A. Sa résistance est :", ["50 Ω", "0,5 Ω", "0,02 Ω", "500 Ω"], "R = 5/0,1 = 50 Ω."], ["La caractéristique passe par le point (I = 0,1 A ; U = 5 V). Pour I = 150 mA, la tension est :", ["7,5 V", "750 V", "3,3 V", "5,15 V"], "R = 50 Ω ; U = 50 × 0,15 = 7,5 V."], ["Un conducteur ohmique de résistance R = 1 kΩ est traversé par I = 30 mA. La tension à ses bornes est :", ["30 V", "30 000 V", "0,03 V", "3 V"], "R = 1000 Ω ; I = 0,03 A ; U = 1000 × 0,03 = 30 V."], ["Convertir 150 mA en ampères :", ["0,15 A", "1,5 A", "15 A", "150 000 A"], "1 mA = 0,001 A."], ["Convertir 2,2 kΩ en ohms :", ["2200 Ω", "22 Ω", "0,0022 Ω", "220 Ω"], "1 kΩ = 1000 Ω."], ["Si on double la tension aux bornes d'un conducteur ohmique, l'intensité du courant :", ["double", "reste la même", "est divisée par 2", "devient nulle"], "U et I sont proportionnels (R constante)."], ["Deux conducteurs ohmiques sont soumis à la même tension. Celui qui a la plus grande résistance est traversé par :", ["la plus faible intensité", "la plus grande intensité", "la même intensité", "aucun courant"], "I = U/R : plus R est grande, plus I est faible."], ["Pour mesurer la résistance d'un conducteur ohmique avec un ohmmètre, il faut :", ["le débrancher du circuit", "le laisser alimenté", "le brancher en série avec la pile", "le chauffer"], "L'ohmmètre s'utilise hors circuit."], ["La pente de la caractéristique U = f(I) d'un conducteur ohmique représente :", ["sa résistance R", "sa puissance", "son énergie", "son intensité"], "U = R × I : le coefficient directeur est R."], ["Un conducteur ohmique est traversé par I = 20 mA sous U = 4 V. Sa résistance est :", ["200 Ω", "0,2 Ω", "80 Ω", "5 Ω"], "R = 4/0,02 = 200 Ω."], ["Lequel de ces graphiques U = f(I) correspond à un conducteur ohmique ?", ["une droite passant par l'origine", "une courbe en cloche", "une droite horizontale", "une droite qui ne passe pas par l'origine"], "U est proportionnelle à I."], ["Un conducteur ohmique de 22 Ω est branché sous 220 V. L'intensité du courant est :", ["10 A", "4840 A", "0,1 A", "198 A"], "I = 220/22 = 10 A."], ["Pour protéger une DEL dans un circuit, on ajoute en série :", ["un conducteur ohmique", "un fil sans résistance", "un deuxième générateur", "un interrupteur fermé"], "Le conducteur ohmique limite l'intensité du courant."], ["Le tableau de mesures donne U = 2 V pour I = 0,04 A et U = 4 V pour I = 0,08 A. La résistance vaut :", ["50 Ω", "0,02 Ω", "25 Ω", "100 Ω"], "R = 2/0,04 = 4/0,08 = 50 Ω."], ["Un conducteur ohmique de 50 Ω supporte une tension maximale de 10 V. L'intensité maximale est :", ["0,2 A", "500 A", "5 A", "0,02 A"], "Imax = 10/50 = 0,2 A."], ["Le symbole Ω désigne :", ["l'ohm, unité de résistance", "le watt", "le volt", "le joule"], "Ω (oméga) est le symbole de l'ohm."]]},
{sem:1,name:"La puissance électrique",qs:[["Vrai ou faux : La puissance électrique consommée par un appareil de chauffage est donnée par la relation P = U² / I.", ["Faux", "Vrai"], "Pour un appareil de chauffage : P = U × I = R × I² = U² / R."], ["Vrai ou faux : La puissance électrique d'un appareil de chauffage s'exprime par P = R × I².", ["Vrai", "Faux"], "P = U × I et U = R × I donnent P = R × I²."], ["Vrai ou faux : L'unité internationale de la puissance électrique est le watt.", ["Vrai", "Faux"], "P s'exprime en watts (W)."], ["Vrai ou faux : L'indication 220 V – 2,2 kW sur un four signifie qu'il consomme 2,2 kW quand il est alimenté sous 220 V.", ["Vrai", "Faux"], "220 V est la tension nominale ; 2,2 kW est la puissance nominale."], ["Vrai ou faux : On peut brancher autant d'appareils qu'on veut sur une même prise.", ["Faux", "Vrai"], "L'intensité totale ne doit pas dépasser l'intensité maximale admissible."], ["Compléter : La relation entre la puissance P, la tension U et l'intensité I est ……", ["P = U × I", "P = U / I", "P = U + I", "P = I / U"], "P = U × I."], ["Compléter : L'appareil de mesure de la puissance électrique est le ……", ["wattmètre", "voltmètre", "ampèremètre", "compteur"], "Le wattmètre mesure la puissance."], ["Cocher la bonne réponse : La puissance électrique consommée par un appareil thermique est calculée par la relation :", ["P = R × I²", "P = U² × R", "P = R² × I", "P = U / I"], "P = R × I² (ou U × I, ou U²/R)."], ["Compléter le tableau : Le watt (W) est l'unité de ……", ["la puissance électrique", "l'énergie électrique", "la tension", "la résistance"], "Watt = unité de puissance."], ["Un four porte les indications 220 V – 2,2 kW. L'intensité du courant qui le traverse en fonctionnement normal est :", ["10 A", "0,1 A", "484 A", "2420 A"], "I = P/U = 2200/220 = 10 A."], ["La résistance du four (220 V – 2,2 kW) est :", ["22 Ω", "10 Ω", "0,045 Ω", "484 Ω"], "R = U²/P = 220²/2200 = 22 Ω."], ["On veut brancher le four (2,2 kW) et un fer à repasser (330 W) sur une prise de 220 V avec Imax = 11 A. L'intensité totale serait :", ["11,5 A : on ne peut pas les brancher ensemble", "10 A : c'est possible", "1,5 A : c'est possible", "11 A : c'est juste possible"], "P = 2530 W ; I = 2530/220 = 11,5 A > 11 A."], ["Un drone a un moteur de puissance 36 W alimenté sous 18 V. L'intensité du courant est :", ["2 A", "648 A", "0,5 A", "54 A"], "I = P/U = 36/18 = 2 A."], ["Une voiture jouet a un moteur de 40 W alimenté sous 24 V. L'intensité du courant est environ :", ["1,67 A", "960 A", "0,6 A", "16 A"], "I = 40/24 ≈ 1,67 A."], ["Une trottinette fonctionne sous U = 48 V avec I = 10 A. Sa puissance est :", ["480 W", "4,8 W", "58 W", "0,48 W"], "P = 48 × 10 = 480 W."], ["Une lampe porte l'indication 220 V – 60 W. Sous 220 V, l'intensité qui la traverse est environ :", ["0,27 A", "3,67 A", "13 200 A", "60 A"], "I = 60/220 ≈ 0,27 A."], ["Un radiateur de résistance 48,4 Ω est branché sous 220 V. Sa puissance est :", ["1000 W", "4,5 W", "10 648 W", "220 W"], "P = U²/R = 48 400/48,4 = 1000 W."], ["Un conducteur ohmique de 100 Ω est traversé par 2 A. La puissance consommée est :", ["400 W", "200 W", "50 W", "102 W"], "P = R × I² = 100 × 4 = 400 W."], ["Convertir 2,2 kW en watts :", ["2200 W", "22 W", "220 W", "0,0022 W"], "1 kW = 1000 W."], ["Parmi ces appareils, lequel a la plus grande puissance ?", ["un chauffe-eau de 2 kW", "une lampe de 60 W", "un chargeur de 20 W", "une radio de 15 W"], "2 kW = 2000 W."], ["La puissance consommée par une installation est la somme :", ["des puissances des appareils qui fonctionnent", "des tensions des appareils", "des résistances des appareils", "des masses des appareils"], "Les puissances s'additionnent."], ["Le disjoncteur coupe le courant quand :", ["l'intensité dépasse la valeur maximale admissible", "la tension diminue", "on éteint une lampe", "la puissance est nulle"], "Il protège l'installation contre les surintensités."], ["Si on branche un appareil 110 V – 100 W sur une prise de 220 V, il :", ["risque d'être détruit", "fonctionne normalement", "consomme 50 W", "ne consomme rien"], "La tension est supérieure à sa tension nominale."], ["Un sèche-cheveux de 1100 W fonctionne sous 220 V. Sa résistance est :", ["44 Ω", "5 Ω", "0,2 Ω", "242 000 Ω"], "R = U²/P = 48 400/1100 = 44 Ω."], ["Un fer à repasser porte l'indication 220 V – 1,1 kW. L'intensité du courant en fonctionnement normal est :", ["5 A", "0,2 A", "242 A", "1,1 A"], "I = P/U = 1100/220 = 5 A."], ["Une bouilloire traversée par 5 A sous 220 V a une puissance de :", ["1100 W", "44 W", "225 W", "0,023 W"], "P = 220 × 5 = 1100 W."], ["La puissance nominale d'un appareil est :", ["la puissance qu'il consomme sous sa tension nominale", "sa puissance maximale possible", "la puissance de la prise", "l'énergie consommée en un jour"], "C'est la puissance en fonctionnement normal."], ["Lequel de ces appareils transforme presque toute l'énergie électrique en chaleur ?", ["un radiateur électrique", "un ventilateur", "une radio", "un téléphone"], "Les appareils de chauffage utilisent l'effet Joule."], ["Deux lampes identiques de 40 W fonctionnent ensemble. La puissance totale est :", ["80 W", "40 W", "20 W", "1600 W"], "40 + 40 = 80 W."], ["Un appareil de puissance P = 1,5 kW fonctionne sous 230 V. L'intensité est environ :", ["6,5 A", "345 A", "0,15 A", "15 A"], "I = 1500/230 ≈ 6,5 A."]]},
{sem:1,name:"L'énergie électrique",qs:[["Vrai ou faux : L'énergie consommée par un radiateur de puissance 2 kW fonctionnant 45 min est égale à 1,5 kWh.", ["Vrai", "Faux"], "E = P × t = 2 × 0,75 = 1,5 kWh."], ["Vrai ou faux : Si la constante du compteur est C = 3 Wh/tr, alors 4500 Wh correspondent à 1500 tours.", ["Vrai", "Faux"], "n = E/C = 4500/3 = 1500 tours."], ["Vrai ou faux : L'énergie consommée par un fer à repasser de 3 kW pendant 30 min est égale à 1500 Wh.", ["Vrai", "Faux"], "E = 3000 × 0,5 = 1500 Wh."], ["Vrai ou faux : Pendant le fonctionnement de ce fer (1500 Wh), un compteur de constante C = 2 Wh/tr effectue 3000 tours.", ["Faux", "Vrai"], "n = 1500/2 = 750 tours."], ["Vrai ou faux : L'unité internationale de l'énergie électrique est le kilowattheure.", ["Faux", "Vrai"], "C'est le joule (J) ; le kWh est une unité pratique."], ["Vrai ou faux : 1 Wh = 3600 J.", ["Vrai", "Faux"], "1 Wh = 1 W × 3600 s = 3600 J."], ["Compléter : L'énergie consommée par un appareil dépend de sa puissance et de la durée de fonctionnement : E = ……", ["P × t", "P / t", "U / I", "R × I"], "E = P × t."], ["Compléter : L'appareil de mesure de l'énergie électrique est le ……", ["compteur électrique", "wattmètre", "ampèremètre", "voltmètre"], "Le compteur mesure l'énergie consommée."], ["Compléter : L'unité de la constante C du compteur électrique est ……", ["Wh/tr", "W", "J/s", "kW"], "C indique l'énergie (en Wh) consommée pour un tour du disque."], ["Cocher la bonne réponse : L'expression de l'énergie électrique est :", ["E = P × t", "E = U × I", "E = R × I²", "E = P × I"], "E = P × t (ou U × I × t)."], ["Cocher la bonne réponse : L'unité internationale de l'énergie électrique est :", ["le joule (J)", "le kWh", "la calorie", "le watt"], "Joule = unité internationale."], ["Cocher la bonne réponse : 1 joule est égal à :", ["1 W·s", "3600 Wh", "3600 W·s", "1 kWh"], "1 J = 1 W × 1 s (≈ 2,78 × 10⁻⁴ Wh)."], ["Cocher la bonne réponse : L'énergie consommée dans une maison est mesurée par :", ["le compteur électrique", "le wattmètre", "l'ampèremètre", "le nanomètre"], "Le compteur électrique mesure l'énergie."], ["L'énergie électrique consommée par un appareil s'exprime en ……", ["joules ou kilowattheures", "watts ou kilowatts", "volts ou ampères", "ohms"], "J (unité internationale) ou kWh (unité pratique)."], ["Un compteur indique 18 320 Wh au départ et 21 920 Wh après 3 h de fonctionnement d'un chauffe-eau. L'énergie consommée est :", ["3600 Wh", "40 240 Wh", "1200 Wh", "21 920 Wh"], "E = 21 920 − 18 320 = 3600 Wh."], ["Le chauffe-eau a consommé 3600 Wh ; la constante du compteur est C = 4 Wh/tr. Le nombre de tours du disque est :", ["900 tours", "14 400 tours", "3600 tours", "90 tours"], "n = E/C = 3600/4 = 900 tours."], ["Le chauffe-eau a consommé 3600 Wh en 3 h. Sa puissance moyenne est :", ["1200 W", "10 800 W", "3600 W", "1,2 W"], "P = E/t = 3600/3 = 1200 W."], ["Le chauffe-eau (1200 W) fonctionne sous 230 V. L'intensité du courant est environ :", ["5,2 A", "276 000 A", "0,19 A", "52 A"], "I = 1200/230 ≈ 5,2 A."], ["Un drone a un moteur de 36 W et une autonomie de 2,5 h. L'énergie maximale de sa batterie est :", ["90 Wh", "14,4 Wh", "36 Wh", "900 Wh"], "E = 36 × 2,5 = 90 Wh."], ["Convertir 90 Wh en joules :", ["324 000 J", "90 J", "25 J", "5400 J"], "90 × 3600 = 324 000 J."], ["Le drone (autonomie 2,5 h) fait des trajets de 9 min chacun. Le nombre maximal de trajets complets est :", ["16", "17", "25", "9"], "2,5 h = 150 min ; 150/9 ≈ 16,7 → 16 trajets."], ["Une voiture jouet de 40 W a une autonomie de 1 h 30 min. L'énergie consommée jusqu'à la décharge est :", ["60 Wh", "26,7 Wh", "40 Wh", "3600 Wh"], "E = 40 × 1,5 = 60 Wh."], ["La voiture jouet roule à 18 km/h sur un circuit de 1,2 km (4 min par tour) pendant 1 h 30 min. Le nombre de tours complets est :", ["22", "23", "15", "90"], "90 min / 4 min = 22,5 → 22 tours complets."], ["La trottinette de Mme Amina consomme 480 W pendant 24 min. L'énergie consommée est :", ["0,192 kWh", "11,52 kWh", "192 kWh", "0,02 kWh"], "E = 0,48 kW × 0,4 h = 0,192 kWh."], ["La batterie (Emax = 0,45 kWh) est chargée à 48 %. Le trajet demande 0,192 kWh. Mme Amina :", ["peut atteindre son travail (0,216 kWh disponibles)", "ne peut pas atteindre son travail", "a besoin de 0,45 kWh", "consomme toute la batterie"], "0,48 × 0,45 = 0,216 kWh > 0,192 kWh."], ["Un four de 2 kW fonctionne pendant 2 h. L'énergie consommée est :", ["4 kWh", "1 kWh", "2 kWh", "4000 kWh"], "E = 2 × 2 = 4 kWh."], ["Une lampe de 60 W reste allumée 5 h. L'énergie consommée est :", ["300 Wh", "12 Wh", "65 Wh", "300 kWh"], "E = 60 × 5 = 300 Wh."], ["Convertir 1,5 kWh en joules :", ["5 400 000 J", "1500 J", "5400 J", "416 J"], "1,5 × 1000 × 3600 = 5 400 000 J."], ["Un compteur de constante C = 2,5 Wh/tr fait 400 tours. L'énergie consommée est :", ["1000 Wh", "160 Wh", "402,5 Wh", "2,5 Wh"], "E = C × n = 2,5 × 400 = 1000 Wh."], ["Le prix du kWh est 1,2 DH. Un chauffage de 2 kW fonctionne 3 h. Le coût est :", ["7,2 DH", "2,4 DH", "6 DH", "3,6 DH"], "E = 6 kWh ; coût = 6 × 1,2 = 7,2 DH."], ["Pour économiser l'énergie électrique, il faut :", ["éteindre les appareils inutilisés", "laisser les lampes allumées", "ouvrir souvent le réfrigérateur", "utiliser des lampes plus puissantes"], "Moins de puissance ou moins de durée : moins d'énergie."], ["Un appareil de 500 W fonctionne pendant 30 min. L'énergie consommée en joules est :", ["900 000 J", "15 000 J", "250 J", "1000 J"], "E = 500 × 1800 = 900 000 J."]]},
{sem:2,ex:true,name:"Synthèse – Chimie",qs:[{"t": "La statuette de la médina", "c": "Chez un antiquaire de la médina, Yassine trouve une statuette dorée. Le vendeur affirme : « Elle est en laiton de qualité supérieure, avec au moins 85 % de cuivre en masse. » Le laiton est un alliage de cuivre (Cu) et de zinc (Zn). Yassine mesure la masse de la statuette : m = 840 g. Il la plonge dans un récipient gradué : le niveau de l'eau passe de V₁ = 250 mL à V₂ = 350 mL. Données : ρ(Cu) = 8,9 g/cm³ ; ρ(Zn) = 7,2 g/cm³ ; ρ = m/V.", "qs": [["1) Le volume de la statuette est :", ["100 cm³", "350 cm³", "250 cm³", "600 cm³"], "V = V₂ − V₁ = 350 − 250 = 100 mL = 100 cm³."], ["2) La masse volumique de la statuette est :", ["8,4 g/cm³", "2,4 g/cm³", "3,36 g/cm³", "84 g/cm³"], "ρ = m/V = 840/100 = 8,4 g/cm³."], ["3) On peut conclure que la statuette :", ["n'est ni en cuivre pur ni en zinc pur", "est en cuivre pur", "est en zinc pur", "est en or"], "8,4 g/cm³ ≠ 8,9 et ≠ 7,2 : c'est un alliage."], ["4) Le volume de cuivre est V(Cu) = 70 cm³. Le pourcentage massique du cuivre est environ :", ["74 %", "85 %", "70 %", "26 %"], "m(Cu) = 8,9 × 70 = 623 g ; 623/840 × 100 ≈ 74 %."], ["5) L'affirmation du vendeur est-elle vraie ?", ["Non, la statuette contient moins de 85 % de cuivre", "Oui, elle contient plus de 85 % de cuivre", "Oui, elle est en cuivre pur", "On ne peut pas savoir"], "74 % < 85 % : le vendeur se trompe."]]}, {"t": "L'atome et l'ion d'étain", "c": "Le numéro atomique de l'atome d'étain est Z(Sn) = 50. L'atome d'étain perd 2 électrons pour donner l'ion d'étain. Donnée : e = 1,6 × 10⁻¹⁹ C.", "qs": [["1) La charge du noyau de l'atome d'étain est :", ["Q(n) = +8 × 10⁻¹⁸ C", "Q(n) = −8 × 10⁻¹⁸ C", "Q(n) = +3,2 × 10⁻¹⁹ C", "Q(n) = +5 × 10⁻¹⁸ C"], "Q(n) = 50 × 1,6 × 10⁻¹⁹ = 8 × 10⁻¹⁸ C."], ["2) La charge de l'atome d'étain est :", ["0 C, l'atome est neutre", "+8 × 10⁻¹⁸ C", "−8 × 10⁻¹⁸ C", "+3,2 × 10⁻¹⁹ C"], "Q(A) = Q(n) + Q(e) = 0."], ["3) Le type de l'ion d'étain est :", ["un cation, car l'atome a perdu des électrons", "un anion, car l'atome a perdu des électrons", "un cation, car l'atome a gagné des électrons", "un anion polyatomique"], "Perte d'électrons → charge positive → cation."], ["4) La charge des électrons de cet ion est :", ["−7,68 × 10⁻¹⁸ C", "−8 × 10⁻¹⁸ C", "−8,32 × 10⁻¹⁸ C", "−3,2 × 10⁻¹⁹ C"], "48 électrons : Q(e) = −48 × 1,6 × 10⁻¹⁹ = −7,68 × 10⁻¹⁸ C."], ["5) La charge de l'ion et sa formule sont :", ["+3,2 × 10⁻¹⁹ C ; Sn²⁺", "−3,2 × 10⁻¹⁹ C ; Sn²⁻", "+1,6 × 10⁻¹⁹ C ; Sn⁺", "+3,2 × 10⁻¹⁹ C ; Sn₂⁺"], "Q(ion) = 8 × 10⁻¹⁸ − 7,68 × 10⁻¹⁸ = +3,2 × 10⁻¹⁹ C = +2e."]]}, {"t": "L'ion bromure", "c": "Le numéro atomique de l'atome de brome (Br) est Z = 35. L'atome de brome gagne un électron pour former l'ion bromure. Donnée : e = 1,6 × 10⁻¹⁹ C.", "qs": [["1) La charge du noyau de l'atome de brome est :", ["+5,6 × 10⁻¹⁸ C", "−5,6 × 10⁻¹⁸ C", "+5,76 × 10⁻¹⁸ C", "+3,5 × 10⁻¹⁸ C"], "Q(n) = 35 × 1,6 × 10⁻¹⁹ = 5,6 × 10⁻¹⁸ C."], ["2) La charge des électrons de l'atome de brome est :", ["−5,6 × 10⁻¹⁸ C", "+5,6 × 10⁻¹⁸ C", "−5,76 × 10⁻¹⁸ C", "0 C"], "35 électrons : Q(e) = −5,6 × 10⁻¹⁸ C."], ["3) Le symbole de l'ion bromure est :", ["Br⁻", "Br⁺", "Br₂", "Br³⁵⁻"], "Gain d'un électron → Br⁻."], ["4) La charge des électrons de l'ion bromure est :", ["−5,76 × 10⁻¹⁸ C", "−5,6 × 10⁻¹⁸ C", "−5,44 × 10⁻¹⁸ C", "+5,76 × 10⁻¹⁸ C"], "36 électrons : −36 × 1,6 × 10⁻¹⁹ = −5,76 × 10⁻¹⁸ C."], ["5) La charge de l'ion bromure est :", ["−1,6 × 10⁻¹⁹ C", "+1,6 × 10⁻¹⁹ C", "0 C", "−5,76 × 10⁻¹⁸ C"], "Q(ion) = 5,6 × 10⁻¹⁸ − 5,76 × 10⁻¹⁸ = −1,6 × 10⁻¹⁹ C = −e."]]}, {"t": "L'ion méthyl-ammonium", "c": "L'ion méthyl-ammonium est composé de 1 atome de carbone (C), de 6 atomes d'hydrogène (H) et de 1 atome d'azote (N). Il porte une charge électrique q = +1,6 × 10⁻¹⁹ C. Données : Z(H) = 1 ; Z(N) = 7 ; Z(C) = 6.", "qs": [["1) Le type de cet ion est :", ["un cation polyatomique", "un anion polyatomique", "un cation monoatomique", "un anion monoatomique"], "Charge positive et plusieurs atomes."], ["2) La formule de cet ion est :", ["CH₆N⁺", "CH₆N⁻", "C₆HN⁺", "CHN₆⁺"], "1 C, 6 H, 1 N et une charge +e."], ["3) Le nombre total de charges positives des noyaux est :", ["19", "18", "14", "8"], "6 + 6 × 1 + 7 = 19."], ["4) Le nombre total d'électrons contenus dans cet ion est :", ["18", "19", "20", "14"], "Charge +e : l'ensemble a perdu 1 électron → 19 − 1 = 18."]]}, {"t": "L'ion inconnu XO₄²⁻", "c": "On considère un anion polyatomique de formule générale XO₄²⁻ (X est un atome inconnu, O l'oxygène de numéro atomique Z(O) = 8). Cet ion contient au total 50 électrons. Données : Z(Si) = 14 ; Z(P) = 15 ; Z(S) = 16 ; Z(Cl) = 17.", "qs": [["1) Dans XO₄²⁻, l'indice 4 et l'exposant 2− signifient :", ["4 atomes d'oxygène et 2 électrons gagnés", "4 atomes X et 2 électrons perdus", "4 électrons gagnés et 2 atomes d'oxygène", "4 charges positives et 2 atomes X"], "L'indice compte les atomes O ; l'exposant indique la charge −2e."], ["2) La relation donnant le nombre total d'électrons est :", ["Z(X) + 4 × Z(O) + 2 = 50", "Z(X) + 4 × Z(O) − 2 = 50", "Z(X) + Z(O) + 2 = 50", "4 × Z(X) + Z(O) = 50"], "Électrons des atomes + 2 électrons gagnés."], ["3) Le numéro atomique de X est :", ["16", "18", "14", "20"], "Z(X) = 50 − 32 − 2 = 16."], ["4) L'atome X et la formule de l'ion sont :", ["le soufre, SO₄²⁻", "le silicium, SiO₄²⁻", "le phosphore, PO₄²⁻", "le chlore, ClO₄²⁻"], "Z = 16 : soufre. C'est l'ion sulfate."]]}, {"t": "Le titane", "c": "Un ion monoatomique de l'élément titane (symbole Ti) possède un noyau de charge Q(n) = +3,52 × 10⁻¹⁸ C et des électrons de charge totale Q(e) = −3,2 × 10⁻¹⁸ C. Donnée : e = 1,6 × 10⁻¹⁹ C.", "qs": [["1) Le numéro atomique du titane est :", ["22", "20", "35", "2"], "Z = 3,52 × 10⁻¹⁸ / 1,6 × 10⁻¹⁹ = 22."], ["2) Le nombre d'électrons de cet ion est :", ["20", "22", "24", "2"], "3,2 × 10⁻¹⁸ / 1,6 × 10⁻¹⁹ = 20."], ["3) La charge de l'ion est :", ["+2e = +3,2 × 10⁻¹⁹ C", "−2e = −3,2 × 10⁻¹⁹ C", "+22e", "0 C"], "Q(ion) = 3,52 × 10⁻¹⁸ − 3,2 × 10⁻¹⁸ = 3,2 × 10⁻¹⁹ C = +2e."], ["4) La formule de l'ion est :", ["Ti²⁺", "Ti²⁻", "Ti₂⁺", "Ti²²⁺"], "L'atome a perdu 2 électrons."]]}, {"t": "Identification de plastiques", "c": "Un tournevis testeur a une lame en acier et une poignée en plastique. On réalise des tests sur deux échantillons de plastique A et B. A : flotte dans l'eau douce, flotte dans l'eau salée, flamme jaune. B : coule dans l'eau douce, flotte dans l'eau salée, flamme jaune. Données : ρ(eau douce) = 1 g/cm³ ; ρ(eau salée) = 1,2 g/cm³.", "qs": [["1) La lame en acier appartient à la famille des :", ["métaux", "matériaux organiques", "céramiques", "plastiques"], "L'acier est un alliage de fer : métal."], ["2) Le plastique A est :", ["le PE", "le PS", "le PVC", "le PET"], "Il flotte dans les deux eaux : PE."], ["3) Le plastique B est :", ["le PS", "le PE", "le PVC", "le PET"], "Coule dans l'eau douce, flotte dans l'eau salée : PS."], ["4) La masse volumique du plastique B peut être :", ["1,05 g/mL", "0,95 g/mL", "1,21 g/mL", "1,40 g/mL"], "1 < ρ(B) < 1,2 g/mL."], ["5) On brûle la poignée et on observe une flamme verte. Ce plastique est :", ["le PVC", "le PE", "le PS", "le PET"], "Flamme verte → PVC."]]}, {"t": "Trois métaux à identifier", "c": "On dispose de trois échantillons de métaux A, B et C, choisis parmi : fer, cuivre, zinc et aluminium. On mesure leur masse, puis leur volume dans une éprouvette contenant 50 mL d'eau. A : gris, non attiré par l'aimant, 142 g, niveau final 70 mL. B : gris, non attiré, 81 g, niveau final 80 mL. C : gris, attiré, 117 g, niveau final 65 mL. Données : ρ(Al) = 2,7 ; ρ(Zn) = 7,1 ; ρ(Fe) = 7,8 ; ρ(Cu) = 8,9 g/cm³.", "qs": [["1) Le métal C est :", ["le fer, car il est attiré par l'aimant", "le zinc, car il est gris", "le cuivre, car il est lourd", "l'aluminium, car il est léger"], "Seul le fer est attiré par un aimant."], ["2) La masse volumique de l'échantillon A est :", ["7,1 g/cm³", "2,03 g/cm³", "2,84 g/cm³", "1,42 g/cm³"], "V = 70 − 50 = 20 cm³ ; ρ = 142/20 = 7,1 g/cm³."], ["3) La masse volumique de l'échantillon B est :", ["2,7 g/cm³", "1,01 g/cm³", "1,62 g/cm³", "8,1 g/cm³"], "V = 80 − 50 = 30 cm³ ; ρ = 81/30 = 2,7 g/cm³."], ["4) Les métaux A et B sont :", ["A : zinc ; B : aluminium", "A : aluminium ; B : zinc", "A : fer ; B : cuivre", "A : cuivre ; B : zinc"], "7,1 g/cm³ → zinc ; 2,7 g/cm³ → aluminium."], ["5) La couleur et le test à l'aimant ne suffisent pas pour distinguer A et B car :", ["les deux sont gris et non attirés par l'aimant", "les deux sont attirés par l'aimant", "les deux sont rouges", "les deux ont la même masse"], "Il faut une autre propriété : la masse volumique."]]}, {"t": "Le lingot de bronze", "c": "Le bronze est un alliage de cuivre (Cu) et d'étain (Sn). Un lingot de bronze a la forme d'un pavé de dimensions L = 10 cm, l = 5 cm et h = 2 cm. Sa masse est m = 880 g ; il contient m(Cu) = 774,4 g de cuivre. Données : ρ = m/V ; 1 g/cm³ = 1000 kg/m³.", "qs": [["1) Le volume du lingot est :", ["100 cm³", "17 cm³", "50 cm³", "1000 cm³"], "V = 10 × 5 × 2 = 100 cm³."], ["2) La masse volumique du lingot est :", ["8,8 g/cm³ = 8800 kg/m³", "8,8 g/cm³ = 8,8 kg/m³", "88 g/cm³", "0,88 g/cm³"], "ρ = 880/100 = 8,8 g/cm³ = 8800 kg/m³."], ["3) La masse d'étain du lingot est :", ["105,6 g", "774,4 g", "880 g", "1654,4 g"], "m(Sn) = 880 − 774,4 = 105,6 g."], ["4) Les pourcentages massiques sont :", ["88 % de cuivre et 12 % d'étain", "12 % de cuivre et 88 % d'étain", "77,4 % de cuivre et 22,6 % d'étain", "50 % de chaque"], "774,4/880 = 88 % ; 105,6/880 = 12 %."], ["5) Un lingot de même composition a une masse de 2,2 kg. Sa masse de cuivre est :", ["1,936 kg", "0,264 kg", "2,2 kg", "1,1 kg"], "m(Cu) = 0,88 × 2,2 = 1,936 kg."]]}, {"t": "Dilution de l'acide chlorhydrique", "c": "On prépare des solutions d'acide chlorhydrique par dilution d'une solution commerciale, puis on mesure le pH de chaque solution : A : 2,5 ; B : 5,5 ; C : 3,5 ; D : 1,5 ; E : 4,5.", "qs": [["1) La méthode utilisée pour mesurer le pH est :", ["le pH-mètre, car les valeurs sont décimales", "le papier pH, car les valeurs sont décimales", "le thermomètre", "la balance"], "Le papier pH ne donne pas de décimales."], ["2) La solution la plus acide et la moins acide sont :", ["D la plus acide ; B la moins acide", "B la plus acide ; D la moins acide", "A la plus acide ; E la moins acide", "C la plus acide ; A la moins acide"], "Plus le pH est petit, plus la solution est acide."], ["3) Le classement selon l'acidité croissante est :", ["B < E < C < A < D", "D < A < C < E < B", "A < B < C < D < E", "E < B < D < C < A"], "Acidité croissante = pH décroissant."], ["4) La solution commerciale (avant dilution) est :", ["D, car son pH est le plus petit", "B, car son pH est le plus grand", "A, la première", "E, au milieu"], "La dilution fait augmenter le pH."], ["5) On dilue encore beaucoup la solution B. Son pH peut devenir :", ["6,5", "4,5", "7,5", "1,5"], "Le pH augmente en se rapprochant de 7 sans le dépasser."]]}, {"t": "L'aluminium dans l'acide", "c": "On introduit m = 5 g de poudre d'aluminium dans un tube à essais contenant de l'acide chlorhydrique. On remarque la formation de bulles gazeuses et la diminution de la quantité d'aluminium. On sait que l'ion aluminium Al³⁺ contient 10 électrons. Donnée : e = 1,6 × 10⁻¹⁹ C.", "qs": [["1) S'agit-il d'une réaction chimique ?", ["Oui : un gaz se forme et l'aluminium disparaît", "Non : c'est une dissolution", "Non : c'est une fusion", "Non : rien ne change"], "Apparition de nouvelles espèces chimiques."], ["2) Le nom et la formule du gaz produit sont :", ["dihydrogène H₂", "dioxygène O₂", "dioxyde de carbone CO₂", "chlore Cl₂"], "Les métaux qui réagissent avec l'acide dégagent du dihydrogène."], ["3) On détecte ce gaz par :", ["une détonation au contact d'une flamme", "le trouble de l'eau de chaux", "le bleuissement du sulfate de cuivre anhydre", "sa couleur verte"], "Le dihydrogène détone au contact d'une flamme."], ["4) L'équation simplifiée de la réaction est :", ["2Al + 6H⁺ → 2Al³⁺ + 3H₂", "Al + H⁺ → Al⁺ + H₂", "4Al + 3O₂ → 2Al₂O₃", "2Al + 3Cl⁻ → 2AlCl₃"], "Équation équilibrée avec les ions H⁺."], ["5) L'atome d'aluminium contient :", ["13 électrons, car il en perd 3 pour donner Al³⁺", "10 électrons", "7 électrons", "3 électrons"], "10 + 3 = 13 électrons."]]}, {"t": "Le zinc et les tests d'ions", "c": "On introduit m = 10 g de zinc dans un tube à essais contenant de l'acide chlorhydrique : une effervescence se produit et la quantité de zinc diminue. Après avoir retiré le zinc restant, on ajoute quelques gouttes de soude à la solution : il se forme un précipité.", "qs": [["1) Le gaz produit est :", ["le dihydrogène H₂", "le dioxygène O₂", "le dioxyde de carbone CO₂", "la vapeur d'eau H₂O"], "Zinc + acide → dihydrogène."], ["2) L'équation simplifiée de la réaction du zinc avec l'acide est :", ["Zn + 2H⁺ → Zn²⁺ + H₂", "Zn + H⁺ → Zn⁺ + H", "Zn + 2Cl⁻ → ZnCl₂", "2Zn + O₂ → 2ZnO"], "Les ions Cl⁻ sont spectateurs."], ["3) Le test à la soude met en évidence l'ion :", ["Zn²⁺", "Cu²⁺", "Fe²⁺", "Cl⁻"], "La solution contient des ions zinc."], ["4) La couleur et le nom du précipité sont :", ["blanc, hydroxyde de zinc", "bleu, hydroxyde de cuivre", "vert, hydroxyde de fer II", "rouille, hydroxyde de fer III"], "Zn²⁺ + 2HO⁻ → Zn(OH)₂, précipité blanc."], ["5) Le pH de la solution pendant la réaction du zinc avec l'acide :", ["augmente", "diminue", "reste constant", "devient 0"], "Les ions H⁺ sont consommés."]]}, {"t": "Le produit pour la vigne", "c": "Pour déterminer les ions métalliques présents dans un produit commercial à base de sulfate (SO₄²⁻) utilisé dans l'agriculture des raisins, on dissout une quantité de ce produit dans de l'eau distillée. On mesure le pH : pH = 7,00. On ajoute quelques gouttes de soude : il se forme un précipité bleu.", "qs": [["1) La nature de la solution préparée est :", ["neutre, car pH = 7", "acide, car pH = 7", "basique, car pH = 7", "acide, car elle contient des ions sulfate"], "pH = 7 : solution neutre."], ["2) L'ion métallique présent dans la solution est :", ["Cu²⁺", "Fe²⁺", "Fe³⁺", "Zn²⁺"], "Précipité bleu avec la soude → ions cuivre II."], ["3) La formule et le nom du précipité bleu sont :", ["Cu(OH)₂, hydroxyde de cuivre II", "Fe(OH)₂, hydroxyde de fer II", "CuSO₄, sulfate de cuivre", "Fe(OH)₃, hydroxyde de fer III"], "Le précipité bleu est l'hydroxyde de cuivre II."], ["4) L'équation de précipitation est :", ["Cu²⁺ + 2HO⁻ → Cu(OH)₂", "Cu²⁺ + HO⁻ → CuOH", "Cu + 2HO⁻ → Cu(OH)₂", "Cu²⁺ + SO₄²⁻ → CuSO₄"], "Un ion Cu²⁺ réagit avec deux ions HO⁻."], ["5) La formule et le nom de cette solution sont :", ["(Cu²⁺ + SO₄²⁻), sulfate de cuivre II", "(Fe²⁺ + SO₄²⁻), sulfate de fer II", "(2H⁺ + SO₄²⁻), acide sulfurique", "(Cu²⁺ + 2Cl⁻), chlorure de cuivre"], "Ions cuivre II et ions sulfate."]]}, {"t": "Le Rilsan et la rouille", "c": "Le Rilsan est un polymère de formule (C₁₁H₂₁NO)n. On l'utilise pour recouvrir des pièces métalliques et les protéger contre la corrosion. I) On brûle une corde en Rilsan : on observe une fumée noire, de la vapeur d'eau, du dioxyde de carbone et des gaz toxiques (CO, HCN). II) Un gréement en fer recouvert de Rilsan s'écaille : une couche rougeâtre se forme sur le fer.", "qs": [["1) Le Rilsan est un matériau organique car :", ["sa combustion produit du CO₂ et de l'eau", "il est attiré par un aimant", "il ne brûle pas", "il conduit le courant"], "Il contient C et H."], ["2) Le bilan de la combustion complète du Rilsan est :", ["Rilsan + dioxygène → dioxyde de carbone + eau (+ autres gaz)", "Rilsan + eau → dioxygène", "Rilsan → fer + rouille", "Rilsan + dihydrogène → eau"], "Combustion d'un matériau organique."], ["3) La fumée noire indique :", ["une combustion incomplète", "une combustion complète", "la présence de fer", "la formation de dihydrogène"], "La fumée noire est du carbone."], ["4) Le nom et la formule de la couche rougeâtre sont :", ["la rouille, Fe₂O₃", "l'alumine, Al₂O₃", "le vert-de-gris", "l'oxyde de zinc, ZnO"], "La rouille est l'oxyde de fer III."], ["5) L'équation de la formation de cette couche est :", ["4Fe + 3O₂ → 2Fe₂O₃", "2Fe + O₂ → Fe₂O", "Fe + O₂ → FeO₂", "4Al + 3O₂ → 2Al₂O₃"], "Oxydation du fer par le dioxygène."], ["6) D'après le texte, une méthode pour protéger le fer de la corrosion est :", ["le recouvrir d'une couche de Rilsan (plastique)", "le mouiller", "le chauffer", "le plonger dans l'acide"], "Le revêtement isole le fer de l'air humide."]]}]},
{sem:2,ex:true,name:"Synthèse – Physique",qs:[{"t": "Le sac de sable", "c": "Un sac de sable (S) est accroché à un dynamomètre qui indique 25 N. On donne g = 10 N/kg. On brûle ensuite le fil : le sac tombe verticalement vers le sol, situé à d = 30 m, en Δt = 2,5 s.", "qs": [["1) Le bilan des forces exercées sur le sac accroché est :", ["son poids P⃗ et la force F⃗ du dynamomètre", "son poids seulement", "la force du dynamomètre seulement", "le poids, la force du dynamomètre et la réaction du sol"], "Le sac subit l'action de la Terre et celle du dynamomètre."], ["2) L'intensité du poids du sac est :", ["25 N", "2,5 N", "250 N", "10 N"], "À l'équilibre, P = F = 25 N."], ["3) La masse du sac de sable est :", ["2,5 kg", "250 kg", "25 kg", "0,4 kg"], "m = P/g = 25/10 = 2,5 kg."], ["4) Pendant la chute, la nature du mouvement du sac est :", ["rectiligne accéléré", "rectiligne uniforme", "circulaire", "rectiligne ralenti"], "Trajectoire verticale et vitesse qui augmente."], ["5) La vitesse moyenne de la chute est :", ["43,2 km/h", "12 km/h", "75 km/h", "3,33 km/h"], "v = 30/2,5 = 12 m/s = 43,2 km/h."]]}, {"t": "Le phoque et le bâton", "c": "Un phoque maintient en équilibre un bâton de baseball sur son nez, au point A. La masse du bâton est m = 350 g. On donne g = 10 N/kg.", "qs": [["1) L'action du phoque sur le bâton est :", ["une action de contact localisée", "une action à distance", "une action de contact répartie", "une action magnétique"], "Le contact se fait au point A."], ["2) L'effet de cette action est :", ["statique (maintien en équilibre)", "dynamique (mise en mouvement)", "chimique", "nul"], "Le bâton reste en équilibre."], ["3) L'intensité du poids du bâton est :", ["3,5 N", "35 N", "350 N", "0,35 N"], "P = 0,35 × 10 = 3,5 N."], ["4) Les caractéristiques de la force F⃗ du phoque sur le bâton sont :", ["point A ; droite verticale ; vers le haut ; 3,5 N", "point A ; verticale ; vers le bas ; 3,5 N", "point G ; horizontale ; vers la droite ; 3,5 N", "point A ; verticale ; vers le haut ; 35 N"], "Équilibre : F⃗ opposée au poids, même intensité."], ["5) Avec l'échelle 1 cm → 1 N, la force F⃗ se représente par un vecteur de :", ["3,5 cm", "35 cm", "0,35 cm", "1 cm"], "3,5 N ÷ 1 N/cm = 3,5 cm."]]}, {"t": "Le satellite Mohammed VI-A", "c": "Le satellite marocain M6A, de masse m = 1105 kg, évolue sur une orbite à h = 620 km d'altitude. Il parcourt cette orbite en 97,5 minutes (durée d'un tour) à la vitesse V = 7,6 km/s. À 620 km d'altitude, l'intensité de pesanteur est g = 8,145 N/kg.", "qs": [["1) La vitesse du satellite en m/s est :", ["7600 m/s", "760 m/s", "2,11 m/s", "27 360 m/s"], "7,6 km/s = 7600 m/s."], ["2) La distance parcourue pendant un tour est environ :", ["44 460 km", "741 km", "4 446 km", "444 600 km"], "d = 7600 × 97,5 × 60 = 44 460 000 m."], ["3) Le nombre de tours complets du satellite en une journée est :", ["14", "24", "15", "97"], "1440/97,5 ≈ 14,8 → 14 tours complets."], ["4) Le poids du satellite sur son orbite est environ :", ["9000 N", "11 050 N", "1105 N", "136 N"], "P = 1105 × 8,145 ≈ 9000 N."], ["5) Avec l'échelle 1 cm → 3 000 N, le poids se représente par un vecteur de :", ["3 cm", "0,3 cm", "30 cm", "9 cm"], "9000/3000 = 3 cm."]]}, {"t": "Le vase sur la table", "c": "Un vase de masse m est en équilibre sur une table horizontale. Son poids P⃗ est représenté par un vecteur de 3 cm avec l'échelle 1 cm → 4 N. On donne g = 10 N/kg.", "qs": [["1) Le bilan des forces exercées sur le vase est :", ["le poids P⃗ et la réaction R⃗ de la table", "le poids seulement", "la réaction seulement", "le poids et la force du fil"], "Deux forces : action de la Terre et action de la table."], ["2) L'intensité du poids du vase est :", ["12 N", "7 N", "1,33 N", "0,75 N"], "P = 3 × 4 = 12 N."], ["3) L'intensité de la force R⃗ exercée par la table est :", ["12 N", "0 N", "24 N", "6 N"], "Équilibre : R = P = 12 N."], ["4) La masse du vase est :", ["1,2 kg", "12 kg", "120 kg", "0,12 kg"], "m = P/g = 12/10 = 1,2 kg."]]}, {"t": "L function copyText(text,btn){
  const done=()=>{const t=btn.textContent;btn.textContent="Copié ✓";setTimeout(()=>btn.textContent=t,1600)};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done()}catch(e){btn.textContent="Sélectionnez le texte pour le copier"}ta.remove()};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}
const isVF=o=>o.length===2&&o.includes("Vrai")&&o.includes("Faux");
function toQuestions(pool,n){
  /* plusieurs tirages : on garde celui qui remplit les n questions sans couper d'exercice */
  const fill=()=>{const units=shuffle(pool),out=[];
    for(const u of units){if(out.length>=n)break;if(u.length<=n-out.length)out.push(...u)}
    let cut=0;if(out.length<n){const ex=units.find(u=>u.length>n-out.length&&!out.includes(u[0]));if(ex){cut=n-out.length;out.push(...ex.slice(0,cut))}}
    return{out,cut}};
  let best=fill();for(let t=0;t<40&&best.cut;t++){const r=fill();if(r.cut<best.cut||(r.cut===best.cut&&r.out.length>best.out.length))best=r}
  const out=best.out;
  return out.map(({q,ch,ctx,ttl,k,kn})=>({text:q[0],answer:q[1][0],opts:isVF(q[1])?["Vrai","Faux"]:shuffle(q[1]),exp:q[2],ch,ctx,ttl,k,kn}))}
const ctxHTML=q=>q.ctx?`<section class="card ctx"><span class="label">Exercice de synthèse · ${esc(q.ttl)} · question ${q.k}/${q.kn}</span><p>${esc(q.ctx)}</p></section>`:"";
const nQ=c=>c.ex?c.qs.reduce((t,e)=>t+e.qs.length,0):c.qs.length;
/* Unités tirées au hasard : une question seule, ou un exercice de synthèse complet (questions enchaînées) */
function poolOf(level,idx){const L=BANK[level];return idx.flatMap(i=>{const c=L.chapters[i];
  return c.ex?c.qs.map(e=>e.qs.map((q,k)=>({q,ch:c.name,ctx:e.c,ttl:e.t,k:k+1,kn:e.qs.length}))):c.qs.map(q=>[{q,ch:c.name}])})}

const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const NB_LES=19;
const DAY0=Date.UTC(2026,8,1);
const p2=n=>String(n).padStart(2,"0");
const hm=m=>p2(Math.floor(m/60))+":"+p2(m%60);
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?+m[1]*60+ +m[2]:NaN};
const dayOf=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-DAY0)/864e5):NaN};
const isoOf=t=>{const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const localAt=(day,min)=>{const d=new Date(DAY0+day*864e5);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0,min).getTime()};
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const dayLabel=day=>{const d=new Date(localAt(day,0));return JOURS[d.getDay()]+" "+p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()};
const chk=v=>parseInt(hash("qcm3ac|"+v.toString()),36)%32;
const MASK=0x9E3779B97F4A7C1n&((1n<<60n)-1n);
const fmtCode=s=>s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8);
function makeQuiz(o){
  let v=0n;const put=(x,b)=>{v=(v<<BigInt(b))|BigInt(x)};
  put(o.idx.reduce((m,i)=>m|(1<<i),0),NB_LES);
  put(o.cls.reduce((m,c)=>m|(1<<CLS.indexOf(c)),0),2);
  put(o.dur,7);put(o.day,9);put(o.start/5,9);put(o.end/5,9);
  v=((v<<5n)|BigInt(chk(v)))^MASK;
  let s="";for(let i=0;i<12;i++){s=B32[Number(v&31n)]+s;v>>=5n}
  return fmtCode(s);
}
function parseCode(c){
  const s=String(c||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1").replace(/U/g,"V");
  if(s.length!==12)return null;
  let v=0n;for(const ch of s){const k=B32.indexOf(ch);if(k<0)return null;v=(v<<5n)|BigInt(k)}
  v^=MASK;const ck=Number(v&31n);v>>=5n;if(chk(v)!==ck)return null;
  const get=b=>{const x=Number(v&((1n<<BigInt(b))-1n));v>>=BigInt(b);return x};
  const end=get(9)*5,start=get(9)*5,day=get(9),dur=get(7),cm=get(2),lm=get(NB_LES);
  const L=BANK["3AC"];
  const idx=[];for(let i=0;i<NB_LES;i++)if(lm&(1<<i))idx.push(i);
  const cls=CLS.filter((_,i)=>cm&(1<<i));
  if(!idx.length||idx.some(i=>i>=L.chapters.length)||!cls.length||dur<1||end<=start)return null;
  const n=idx.reduce((t,i)=>t+nQ(L.chapters[i]),0);
  return{level:"3AC",idx,cls,dur,day,start,end,n,code:fmtCode(s),open:localAt(day,start),close:localAt(day,end)};
}
const quizInfo=q=>`${dayLabel(q.day)}, de ${hm(q.start)} à ${hm(q.end)} · durée ${q.dur} min · ${q.cls.join(", ")}`;
/* ---------- Signature des résultats (empêche de modifier la note dans le message) ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}
  let h2=h;for(const ch of s+SALT){h2^=ch.codePointAt(0);h2=Math.imul(h2,2654435761)>>>0}
  return(h.toString(36)+h2.toString(36)).toUpperCase().slice(-6)}
const sign=r=>hash([SALT,norm(r.name),norm(r.cls),r.quiz,r.score,r.total,r.date].join("|"));
const message=r=>`LaboQCM | Nom: ${r.name} | Classe: ${r.cls} | Quiz: ${r.quiz} | Note: ${r.score}/${r.total} | Date: ${r.date} | Code: ${r.sig}`;
function parseMessage(line){
  if(!/LaboQCM/i.test(line))return null;
  const g=k=>{const m=line.match(new RegExp("\\b"+k+":\\s*([^|]*)"));return m?m[1].trim():""};
  const note=g("Note").match(/(\d+)\s*\/\s*(\d+)/);if(!g("Nom")||!note)return null;
  const r={name:g("Nom"),cls:g("Classe"),quiz:g("Quiz"),score:+note[1],total:+note[2],date:g("Date"),sig:g("Code").toUpperCase()};
  r.valid=sign(r)===r.sig;return r;
}
/* ---------- E-mail du professeur : enregistré par le professeur, transmis aux élèves dans le lien du quiz ("2AC-ADF~xxxx") ---------- */
const MAIL_RE=/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']{2,}$/;
const validMail=m=>typeof m==="string"&&m.length<=80&&MAIL_RE.test(m);
function encMail(m){try{return btoa(unescape(encodeURIComponent(m))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return""}}
function decMail(t){try{t=String(t||"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const m=decodeURIComponent(escape(atob(t))).trim().toLowerCase();return validMail(m)?m:""}catch(e){return""}}
/* Adresse de la page à donner aux élèves : la page publique GitHub Pages (utilisée aussi depuis la page Claude et l'application Android). */
const SHARE_BASE="https://redabirharassen.github.io/qcm-3ac/";
const FRAMED=(()=>{try{return window.top!==window.self}catch(e){return true}})();
const pageBase=()=>(!FRAMED&&/^https?:$/.test(location.protocol))?location.href.split("#")[0]:SHARE_BASE;
const quizLink=(code,mail)=>pageBase()+"#"+code+(mail?"~"+encMail(mail):"");
function readHash(){
  const [c,t]=location.hash.slice(1).split("~");
  const mail=decMail(t);if(mail)LS.set("lq-tmail",mail);
  return parseCode(c);
}
function mailto(mail,r,msg){
  const e=encodeURIComponent;
  return"mailto:"+e(mail).replace(/%40/g,"@")+"?subject="+e(`LaboQCM - ${r.name} - ${r.cls} - Quiz ${r.quiz}`)+"&body="+e(msg);
}
/* ---------- Envoi automatique de la note vers la feuille Google Sheets du professeur (application web Apps Script) ---------- */
const SHEET_URL="https://script.google.com/macros/s/AKfycbz0qpNtFGsfGFpCA9rghXdgdyRiz817QWsddPGymDDSMvafukXE0zjKMXUgi7jrGfu3/exec";
const canSend=()=>!!SHEET_URL&&!FRAMED;
/* Un envoi. Google répond parfois par une page d'erreur alors que la note est bien enregistrée :
   on renvoie alors la même note, le script la reconnaît (pas de doublon) et confirme. */
async function postGrade(r){
  const res=await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({name:r.name,cls:r.cls,quiz:r.quiz,score:r.score,total:r.total,date:r.date,sig:r.sig})});
  const t=await res.text();try{return JSON.parse(t)}catch(e){return null}
}
async function sendGrade(done){
  if(done.sent)return true;
  for(let k=0;k<4;k++){
    if(k)await new Promise(ok=>setTimeout(ok,k*1500));
    let j=null;try{j=await postGrade(done.rec)}catch(e){}
    if(j&&j.ok){done.sent=true;LS.set("lq-done-"+done.rec.quiz,done);return true}
    if(j&&j.error){const e=new Error(String(j.error));e.server=true;throw e}
  }
  throw new Error("envoi impossible");
}
/* Au démarrage : renvoyer les notes qui n'ont pas pu partir (élève hors connexion à la fin du quiz) */
function retryPending(){
  if(!canSend())return;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf("lq-done-")===0){const d=LS.get(k,null);if(d&&d.rec&&d.auto&&!d.sent)sendGrade(d).catch(()=>{})}}}catch(e){}
}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ================= QUIZ NOTÉ ================= */
function examAsk(run){
  stopTick();
  if(run.deadline&&Date.now()>=run.deadline)return finishRun(run,true);
  const q=run.qs[run.i],n=run.qs.length;setColor(run.level);let pick=null;
  $app.innerHTML=`
  <div class="top"><span class="count">${esc(run.name)}</span><div class="bar"><i style="width:${run.i/n*100}%"></i></div><span class="count">${run.i+1}/${n}</span></div>
  ${run.deadline?`<div class="timer" id="tmr" role="timer" aria-live="off"></div>`:""}
  ${ctxHTML(q)}<section class="question pop"><span class="tag">${esc(run.cls)} · ${esc(q.ch)}</span><div class="q">${esc(q.text)}</div></section>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <button class="btn" id="next" disabled>${run.i+1<n?"Valider et continuer":"Valider et terminer"}</button>
  <p class="muted" style="text-align:center">Choisis une réponse. Tu ne pourras pas revenir en arrière.${run.deadline?" Quand le temps est fini, le quiz est envoyé automatiquement.":""}</p>`;
  const btns=[...$app.querySelectorAll(".opt")],next=byId("next");
  if(run.deadline){
    const tmr=byId("tmr");
    const upd=()=>{
      const left=run.deadline-Date.now();
      if(left<=0){stopTick();return finishRun(run,true)}
      const s=Math.ceil(left/1000);
      tmr.textContent=`Temps restant ${Math.floor(s/60)}:${p2(s%60)}`;
      tmr.classList.toggle("low",s<=60);
    };
    upd();tick=setInterval(upd,1000);
  }
  btns.forEach(b=>b.onclick=()=>{pick=+b.dataset.k;btns.forEach(x=>x.classList.toggle("sel",x===b));next.disabled=false});
  next.onclick=()=>{
    if(pick==null)return;
    run.picks[run.i]=q.opts[pick];run.i++;LS.set("lq-run",run);
    if(run.i<n)return examAsk(run);
    finishRun(run,false);
  };
}
function finishRun(run,timeout){
  stopTick();
  const n=run.qs.length;
  const score=run.qs.filter((x,k)=>x.answer===run.picks[k]).length;
  const rec={name:run.name,cls:run.cls,quiz:run.quiz,score,total:n,date:nowStr()};rec.sig=sign(rec);
  const done={rec,level:run.level,qs:run.qs,picks:run.picks,mail:LS.get("lq-tmail",""),auto:canSend(),timeout:!!timeout};
  LS.set("lq-done-"+run.quiz,done);LS.del("lq-run");examResult(done);
}
function examResult(done){
  stopTick();
  const r=done.rec,s=starsOf(r.score/r.total),msg=message(r);setColor(done.level);
  const tm=[done.mail,LS.get("lq-tmail","")].find(validMail)||"";

    <p class="muted">Ta messagerie s'ouvre avec le message déjà écrit : il reste à appuyer sur « Envoyer ». Si rien ne s'ouvre, copie l'adresse et le message ci-dessous, puis envoie-les toi-même.</p>

    <div class="row"><span class="addr" id="tm">${esc(tm)}</span><button class="small-btn ghost" id="cpm">Copier l'adresse</button></div>`
    :`<p class="muted">Copie ce message et envoie-le à ton professeur (WhatsApp, e-mail…).</p>`}
    <div class="msg" id="msg">${esc(msg)}</div>
    <p class="muted">Ne modifie pas le message : sinon il sera refusé.</p>
    <button class="small-btn" id="cp">Copier le message</button></div></div>
  <div class="label">Correction</div>
  <div class="review">${done.qs.map((q,k)=>{const ok=q.answer===done.picks[k];return`<div class="corr ${ok?"":"wrong"}"><b>${k+1}.</b> ${q.ttl?`<i>${esc(q.ttl)}</i> · `:""}${esc(q.text)}<br>
    ${ok?`<span class="good">✓ ${esc(q.answer)}</span>`:`<span class="you">✗ ${done.picks[k]==null?"Pas de réponse":"Ta réponse : "+esc(done.picks[k])}</span><br><span class="good">✓ ${esc(q.answer)}</span>`}<br>${esc(q.exp)}</div>`}).join("")}</div>
  <button class="btn ghost" id="home">Retour à l'accueil</button>`;
  document.getElementById("cp").onclick=e=>copyText(msg,e.currentTarget);
  if(tm)document.getElementById("cpm").onclick=e=>copyText(tm,e.currentTarget);
  document.getElementById("home").onclick=home;
  if(auto){
    const sst=document.getElementById("sst"),manual=document.getElementById("manual"),alt=document.getElementById("alt");
    const show=(state,ex)=>{
      if(!sst.isConnected)return;
      if(state==="ok"){sst.innerHTML=`<p class="ok-text">✓ Ta note a été envoyée à ton professeur.</p>`;manual.hidden=true;alt.hidden=true}
      else if(state==="wait"){sst.innerHTML=`<p class="muted">Envoi de ta note à ton professeur…</p>`}
      else{sst.innerHTML=(ex&&ex.server?`<p class="err">La feuille du professeur a refusé la note : « ${esc(ex.message)} »</p>`:`<p class="err">La note n'a pas pu être envoyée. Vérifie ta connexion Internet.</p>`)+`<div class="row"><button class="small-btn" id="retry">Réessayer l'envoi</button></div>`;
        manual.hidden=false;alt.hidden=false;document.getElementById("retry").onclick=go}
    };
    const go=()=>{show("wait");sendGrade(done).then(()=>show("ok"),ex=>show("ko",ex))};
    done.sent?show("ok"):go();
  }
}

    <button class="btn" type="submit">${isNew?"Créer mon compte":"Se connecter"}</button>
    <p class="muted">${isNew?"Le compte est enregistré sur cet appareil. Utilisez toujours le même téléphone ou ordinateur pour retrouver vos notes.":"Pas encore de compte ? Touchez « Créer un compte »."}</p>
  </form>`;
  document.getElementById("back").onclick=home;
  document.getElementById("m-in").onclick=()=>{authMode="in";login()};
  document.getElementById("m-new").onclick=()=>{authMode="new";login()};
  document.getElementById("lf").onsubmit=async e=>{
    e.preventDefault();
    const err=document.getElementById("lerr"),fail=t=>{err.textContent=t;err.hidden=false};
    const u=document.getElementById("lg").value.trim().toLowerCase(),pw=document.getElementById("pw").value;
    const keep=document.getElementById("keep").checked;
    if(Date.now()<lockUntil)return fail(`Trop d'essais. Réessayez dans ${Math.ceil((lockUntil-Date.now())/1000)} secondes.`);
    try{
      if(isNew){
        if(!/^[a-z0-9._-]{3,30}$/.test(u))return fail("Identifiant : au moins 3 caractères (lettres, chiffres, point, tiret), sans espace.");
        if(accounts()[u])return fail("Cet identifiant existe déjà sur cet appareil. Choisissez-en un autre.");
        if(pw.length<6)return fail("Le mot de passe doit avoir au moins 6 caractères.");
        if(pw!==document.getElementById("pw2").value)return fail("Les deux mots de passe ne sont pas identiques.");
        const inv=document.getElementById("inv").value.replace(/\s+/g,"").toUpperCase();
        if(await sha256("laboqcm-invite|"+inv)!==INVITE_HASH){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return fail("Code d'établissement incorrect. Demandez-le au responsable.")}
        const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
        const h=await sha256("laboqcm|"+u+"|"+salt+"|"+pw);
        const all=accounts();
        if(!Object.keys(all).length){const old=LS.get("lq-grades",null);if(old)LS.set("lq-grades-"+u,old)} /* reprise des notes de l'ancien compte par défaut */
        all[u]={salt,hash:h,created:nowStr()};LS.set("lq-accounts",all);
        authMode="in";return openSession(u,h,keep);
      }
      let h=null;
      const a=accounts()[u];if(a){const x=await sha256("laboqcm|"+u+"|"+a.salt+"|"+pw);if(x===a.hash)h=x}
      if(h)return openSession(u,h,keep);
    }catch(x){return fail("La connexion a échoué sur ce navigateur. Essayez avec Chrome.")}
    fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}
    fail("Identifiant ou mot de passe incorrect.");document.getElementById("pw").value="";
  };
}

function quizDefaults(){
  if(tDay)return;
  const d=new Date();let m=d.getHours()*60+d.getMinutes();m=Math.ceil(m/5)*5;
  if(m>=23*60)m=8*60;

}
/* Lignes collées par le professeur : messages « LaboQCM » ou lignes copiées depuis la feuille Google */
function parseRow(line){
  const m=parseMessage(line);if(m)return m;
  const cells=line.split(/\t|;|\s\|\s/).map(s=>s.trim()).filter(Boolean);
  if(cells.length<3)return null;
  let stu=null,quiz="",score=null,total=10,date="";
  for(const c of cells){
    if(!stu){const f=findStudent(c,CLS);if(f){stu=f;continue}}
    if(!quiz){const q=parseCode(c);if(q){quiz=q.code;continue}}
    const fr=c.match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/);if(fr&&score==null){score=+fr[1];total=+fr[2];continue}
    if(/^\d{1,2}$/.test(c)){if(score==null)score=+c;else total=+c;continue}
    if(!date&&/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/.test(c))date=c;
  }
  if(!stu||!quiz||score==null||!total||score>total)return null;
  return{name:stu.name,cls:stu.cls,quiz,score,total,date,sig:"",valid:true,src:"feuille"};
}

  const {qs,i}=quiz,q=qs[i],n=qs.length;
  $app.innerHTML=`
  <div class="top"><button class="back" id="back">← Leçons</button><div class="bar"><i style="width:${i/n*100}%"></i></div><span class="count">${i+1}/${n}</span></div>
  ${ctxHTML(q)}<section class="question pop"><span class="tag">${prefs.level} · ${esc(q.ch)}</span><div class="q">${esc(q.text)}</div></section>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <div id="fb" aria-live="polite"></div>
  <button class="btn" id="next" hidden>${i+1<n?"Question suivante":"Voir mon score"}</button>`;
  document.getElementById("back").onclick=practiceHome;
  const btns=[...$app.querySelectorAll(".opt")],fb=document.getElementById("fb"),next=document.getElementById("next");
  btns.forEach(b=>b.onclick=()=>{
    const good=q.opts[+b.dataset.k]===q.answer;
    if(good)quiz.score++;else quiz.miss.push(q);
    btns.forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k]===q.answer)x.classList.add("ok")});
    if(!good)b.classList.add("ko");
    fb.innerHTML=`<div class="explain ${good?"ok":"ko"} pop"><b>${good?"Bonne réponse !":"Pas tout à fait…"}</b>${esc(q.exp)}</div>`;
    next.hidden=false;next.focus();
  });
  next.onclick=()=>{quiz.i++;quiz.i<n?pAsk():pResult()};
}
function pResult(){
  const {key,title,score,qs,miss}=quiz,n=qs.length,p=score/n,prev=prefs.best[key];
  const record=prev==null||p>prev;if(record)prefs.best[key]=p;prefs.done++;savePrefs();
  const s=starsOf(p);
  const msg=s===3?"Excellent ! Tu maîtrises cette leçon.":s===2?"Très bien ! Encore un effort pour 3 étoiles.":s===1?"C'est un début. Relis ta leçon et rejoue.":"Révise la leçon puis réessaie, tu vas progresser.";
  $app.innerHTML=`
  <section class="board result"><span class="label" style="color:var(--boardink);opacity:.8">${prefs.level} · ${esc(title)}</span>
    <div class="big">${score}/${n}</div><div class="stars">${starsHTML(s)}</div>
    <p>${msg}${record&&prev!=null?" Nouveau record !":""}</p></section>
  <div class="actions"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="menu">Choisir une autre leçon</button></div>
  ${miss.length?`<div class="label">À revoir (${miss.length})</div><div class="review">${miss.map(q=>`<div class="miss">${q.ttl?`<b>${esc(q.ttl)}</b> · `:""}${esc(q.text)}<br><span class="good">✓ ${esc(q.answer)}</span><br>${esc(q.exp)}</div>`).join("")}</div>`:""}`;
  document.getElementById("again").onclick=()=>pStart(key.split(":")[1]);
  document.getElementById("menu").onclick=practiceHome;
}

/* Reprise automatique d'un quiz noté interrompu (rechargement de la page) */
readHash();retryPending();
const pending=LS.get("lq-run",null);
if(pending&&pending.qs&&pending.i<pending.qs.length)examAsk(pending);else home();
</script>
