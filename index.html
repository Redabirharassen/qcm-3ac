<title>QCM 3AC</title>
<meta name="description" content="QCM de physique-chimie pour la 3ème année collège (3AC) : 17 leçons, entraînement et quiz notés.">

<style>
/* Layout: une colonne type téléphone ; accueil = tableau noir + onglets de niveau + liste des leçons ; quiz = énoncé au tableau, réponses A–D empilées */
:root{
  --bg:#edf2f0; --surface:#ffffff; --ink:#1b2a26; --muted:#5a6d67; --line:#d2dcd8;
  --board:#22463d; --boardink:#f2f6f3; --chalk:#f5df72; --good:#2e8b57; --bad:#c2453b;
  --c1:#e3a93b; --c2:#4f9cc4; --c3:#d26f55;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121e1b; --surface:#1b2b27; --ink:#e8f0ed; --muted:#9db1aa; --line:#2e443e;
  --board:#295449; --good:#5cc286; --bad:#ec7a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121e1b; --surface:#1b2b27; --ink:#e8f0ed; --muted:#9db1aa; --line:#2e443e;
  --board:#295449; --good:#5cc286; --bad:#ec7a6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:16px;padding-block:16px 32px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit}
.board{background:var(--board);color:var(--boardink);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.board h1{font-size:2rem;color:var(--chalk)}
.board p{margin:6px 0 0;opacity:.92;max-width:40ch}
.board .formula{position:absolute;right:-6px;bottom:-18px;font-family:var(--display);font-size:3.6rem;color:#fff;opacity:.08;white-space:nowrap;pointer-events:none}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.13);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tabs:has(> .tab:only-child){display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.25rem;line-height:1.1}
.tab small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{background:var(--lc);border-color:var(--lc);color:#1b2a26}
.tab[aria-selected="true"] small{color:#1b2a26}
.tab:focus-visible,.lesson:focus-visible,.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;transition:border-color .15s,transform .15s}
.lesson:hover{border-color:var(--lc);transform:translateX(2px)}
.lesson .num{width:40px;height:40px;border-radius:12px;background:var(--lc);color:#1b2a26;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem}
.lesson .txt{min-width:0}
.lesson h3{font-size:1.08rem}
.lesson small{color:var(--muted);font-size:.85rem}
.lesson.mix{background:var(--board);border-color:var(--board);color:var(--boardink)}
.lesson.mix small{color:var(--boardink);opacity:.8}
.lesson.mix .num{background:var(--chalk)}
.stars{color:var(--c1);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.lesson.mix .stars .off{color:rgba(255,255,255,.25)}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.back{all:unset;cursor:pointer;font-weight:800;color:var(--muted);padding:6px 2px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.question{background:var(--board);color:var(--boardink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.question .tag{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:800}
.question .q{font-family:var(--display);font-size:clamp(1.25rem,5.2vw,1.6rem);color:var(--chalk);line-height:1.25;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .letter{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--lc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.ok .letter{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.ko .letter{background:var(--bad);color:#fff}
.explain{border-radius:14px;padding:12px 14px;border:2px solid;font-size:.95rem}
.explain.ok{border-color:var(--good)} .explain.ko{border-color:var(--bad)}
.explain b{display:block;font-family:var(--display);font-size:1.1rem}
.explain.ok b{color:var(--good)} .explain.ko b{color:var(--bad)}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;font-family:var(--display);font-size:1.15rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .big{font-family:var(--display);font-size:4rem;line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
.result .stars{font-size:2rem}
.actions{display:grid;gap:10px}
.review{display:flex;flex-direction:column;gap:8px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:.92rem}
.miss .good{color:var(--good);font-weight:800}
.tip{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
.pop{animation:pop .2s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.3rem}
.form label{font-weight:800;font-size:.9rem;margin-bottom:-6px}
.form input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.form input:focus,textarea:focus{outline:none;border-color:var(--c2)}
.err{color:var(--bad);font-weight:700;margin:0}
.ok-text{color:var(--good);font-weight:700;margin:0}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.link{all:unset;cursor:pointer;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:center;padding:6px}
.link:focus-visible{outline:3px solid var(--c2)}
.opt.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 18%,var(--surface))}
.opt.sel .letter{background:var(--lc);color:#1b2a26}
.btn:disabled{opacity:.45;cursor:default}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.check:has(input:checked){border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,var(--surface))}
.check input{width:20px;height:20px;accent-color:var(--board)}
.check small{color:var(--muted);white-space:nowrap}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--board);color:var(--boardink);border-radius:14px;padding:14px 16px}
.codebox .code{font-family:var(--display);font-size:2rem;color:var(--chalk);letter-spacing:.04em;line-height:1}
.small-btn{all:unset;cursor:pointer;font-weight:800;font-size:.9rem;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);text-align:center}
.codebox .small-btn{background:var(--chalk);color:#1b2a26}
.small-btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.small-btn.danger{background:var(--bad);color:#fff}
.small-btn:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;overflow-wrap:anywhere;user-select:all}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.ko{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.summary span{font-size:.75rem;color:var(--muted);font-weight:700}
.corr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:10px 12px;font-size:.92rem}
.corr.wrong{border-left-color:var(--bad)}
.corr .you{color:var(--bad);font-weight:800}
.corr .good{color:var(--good);font-weight:800}
a.btn{text-decoration:none}
.addr{font-weight:800;overflow-wrap:anywhere;user-select:all}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input{flex:1 1 200px}
</style>

<div class="app" id="app"></div>

<script>
/* Banque de questions : [énoncé, [bonne réponse, distracteur, distracteur, distracteur], explication] */
const BANK={
"3AC":{color:"var(--c3)",sub:"3ème année",sems:["Chimie : la matière","Mécanique et électricité"],chapters:[
{sem:0,name:"Quelques matériaux utilisés au quotidien",qs:[
["On appelle matériau :",["toute matière utilisée pour fabriquer des objets","tout objet fabriqué dans une usine","tout liquide utilisé au laboratoire","toute source d'énergie"],"Un matériau est la matière qui sert à fabriquer un objet : le verre, le fer, le plastique…"],
["Les trois grandes familles de matériaux sont :",["métalliques, organiques et céramiques","solides, liquides et gazeux","acides, basiques et neutres","naturels, colorés et électriques"],"Métaux (fer, cuivre…), matériaux organiques (bois, plastiques…) et céramiques (verre, porcelaine…)."],
["Le verre appartient à la famille des matériaux :",["céramiques","métalliques","organiques","magnétiques"],"Le verre, la terre cuite, la porcelaine et le marbre sont des matériaux céramiques."],
["Les matières plastiques appartiennent à la famille des matériaux :",["organiques","céramiques","métalliques","minéraux"],"Les matériaux organiques sont d'origine naturelle (laine, bois, papier) ou industrielle (plastiques)."],
["Lequel de ces matériaux est une céramique ?",["la porcelaine","le coton","le zinc","le polystyrène"],"Le coton et le polystyrène sont organiques ; le zinc est un métal."],
["Lequel de ces matériaux organiques est d'origine naturelle ?",["la laine","le PVC","le nylon","le polystyrène"],"La laine vient des moutons ; les trois autres sont fabriqués par l'industrie."],
["Une bouteille en verre : quel est l'objet et quel est le matériau ?",["la bouteille est l'objet, le verre est le matériau","le verre est l'objet, la bouteille est le matériau","les deux sont des objets","les deux sont des matériaux"],"L'objet est ce qu'on fabrique ; le matériau est la matière utilisée."],
["Lequel de ces mots désigne un matériau et non un objet ?",["le cuivre","la casserole","la fenêtre","le téléphone"],"La casserole, la fenêtre et le téléphone sont des objets fabriqués avec des matériaux."],
["Un téléphone portable est fabriqué :",["avec plusieurs matériaux : verre, plastique, métaux","avec un seul matériau","uniquement avec du verre","uniquement avec du cuivre"],"Un objet peut être fabriqué avec différents matériaux."],
["Le seul métal liquide à température ordinaire est :",["le mercure","le plomb","l'étain","le zinc"],"Tous les autres métaux usuels sont solides à température ordinaire."],
["Le symbole chimique du fer est :",["Fe","F","Fr","Fa"],"F est le fluor ; le fer se note Fe."],
["Le symbole chimique du cuivre est :",["Cu","C","Co","Cr"],"C est le carbone, Co le cobalt, Cr le chrome."],
["Le symbole chimique de l'aluminium est :",["Al","A","Am","Au"],"Au est le symbole de l'or."],
["Le symbole Au désigne :",["l'or","l'argent","l'aluminium","le cuivre"],"Au vient du mot latin aurum. L'argent se note Ag."],
["Le symbole chimique du zinc est :",["Zn","Z","Zi","Zc"],"Le zinc se note Zn."],
["Une propriété commune à tous les métaux est :",["ils conduisent le courant électrique","ils sont attirés par un aimant","ils sont transparents","ils flottent sur l'eau"],"Tous les métaux conduisent l'électricité, mais seuls quelques-uns sont attirés par l'aimant."],
["L'éclat métallique signifie que les métaux purs :",["brillent : ils réfléchissent la lumière","produisent leur propre lumière","sont transparents","changent de couleur à la chaleur"],"Un métal poli réfléchit la lumière, c'est pourquoi il brille."],
["Le fond des casseroles est en métal car les métaux :",["conduisent bien la chaleur","isolent de la chaleur","sont transparents","fondent facilement"],"La conduction thermique est une propriété commune aux métaux."],
["On dit que les métaux sont malléables car :",["on peut les déformer sans les casser","ils cassent au moindre choc","ils fondent dans la main","ils se dissolvent dans l'eau"],"On peut les aplatir en feuilles ou les étirer en fils."],
["Les fils électriques sont le plus souvent en :",["cuivre","verre","PVC","porcelaine"],"Le cuivre est un très bon conducteur ; le PVC sert seulement de gaine isolante."],
["Le bronze est un alliage de :",["cuivre et étain","cuivre et zinc","fer et carbone","or et argent"],"Bronze = environ 80 % de cuivre + 20 % d'étain."],
["Le laiton est un alliage de :",["cuivre et zinc","cuivre et étain","fer et nickel","aluminium et plomb"],"Laiton = environ 60 % de cuivre + 40 % de zinc."],
["Un alliage est :",["un mélange d'un métal avec un ou plusieurs autres éléments","un métal pur","une matière plastique","un verre coloré"],"L'acier, le laiton et le bronze sont des alliages."],
["Le verre est formé essentiellement de silice, qui se trouve dans :",["le sable","le pétrole","le bois","le minerai de fer"],"On fabrique le verre en chauffant le sable à très haute température."],
["La formule chimique de la silice est :",["SiO₂","CO₂","Al₂O₃","H₂O"],"La silice est le dioxyde de silicium SiO₂."],
["Le verre est un matériau :",["transparent et isolant électrique","conducteur électrique","attiré par l'aimant","qui se déforme à la main"],"Il est aussi imperméable aux gaz et aux liquides, et recyclable."],
["Le principal inconvénient du verre est :",["il est fragile : il casse lors d'un choc","il rouille à l'air humide","il conduit le courant","il laisse passer les liquides"],"Le verre résiste aux produits chimiques mais pas aux chocs."],
["Les matières plastiques sont fabriquées par l'industrie à partir :",["du pétrole","du sable","du minerai de fer","de l'eau de mer"],"C'est l'industrie pétrochimique qui produit les plastiques."],
["Les matières plastiques sont en général :",["légères et isolantes électriques","lourdes et conductrices","attirées par l'aimant","fragiles comme le verre"],"Elles sont aussi imperméables et résistent à de nombreux produits chimiques."],
["Un inconvénient des matières plastiques est :",["elles s'enflamment et se déforment facilement à la chaleur","elles rouillent à l'air","elles conduisent le courant","elles se dissolvent dans l'eau"],"C'est pourquoi on ne pose pas un récipient en plastique sur le feu."],
["Le sigle PVC signifie :",["polychlorure de vinyle","polyéthylène","polypropylène","polystyrène"],"Le PVC sert à fabriquer des tubes et des gaines."],
["Le sigle PET signifie :",["polyéthylène téréphtalate","polychlorure de vinyle","polystyrène","polypropylène"],"Le PET porte le numéro 1 dans le triangle de recyclage."],
["Les bouteilles d'eau minérale sont en général en :",["PET","PVC","PS","PP"],"Le PET est transparent, léger et solide."],
["Le plastique qui brûle avec une flamme verte est :",["le PVC","le PET","le PE","le PS"],"La flamme verte est le test de reconnaissance du PVC, qui contient du chlore."],
["Le plastique qui se dissout dans l'acétone est :",["le polystyrène (PS)","le polyéthylène (PE)","le PVC","le PET"],"C'est le test de reconnaissance du polystyrène."],
["Le plastique qui s'enroule sous l'effet de la chaleur est :",["le PET","le PVC","le PS","le PP"],"Un morceau de PET plongé dans l'eau bouillante se rétracte et s'enroule."],
["D'après les tests du cours, le plastique qui flotte sur l'eau douce est :",["le polyéthylène (PE)","le PVC","le PET","le PS"],"Le PE est moins dense que l'eau ; le PVC, le PET et le PS coulent dans l'eau douce."],
["Le numéro écrit dans le triangle de recyclage d'un objet en plastique indique :",["le type de plastique","le prix de l'objet","la masse de l'objet","l'année de fabrication"],"Par exemple 1 pour le PET, 3 pour le PVC, 6 pour le PS."],
["Le métal reconnaissable à sa couleur rouge brique est :",["le cuivre","le fer","le zinc","l'aluminium"],"L'or, lui, est jaune brillant."],
["Parmi ces métaux, lequel est attiré par un aimant ?",["le fer","le cuivre","l'aluminium","le zinc"],"Le fer, le nickel et le cobalt sont attirés par l'aimant."],
["Deux métaux gris ne sont pas attirés par l'aimant. Pour les distinguer, on compare :",["leur masse volumique","leur éclat","leur conduction électrique","leur température"],"Par exemple l'aluminium (2,7 g/cm³) est beaucoup moins dense que le zinc ou le fer."],
["Un objet gris de masse 27 g a un volume de 10 cm³. Il est en :",["aluminium (ρ = 2,7 g/cm³)","fer (ρ = 7,8 g/cm³)","cuivre (ρ = 8,9 g/cm³)","or (ρ = 19,3 g/cm³)"],"ρ = m / V = 27 / 10 = 2,7 g/cm³."],
["Un cube de fer a un volume de 10 cm³ (ρ = 7,8 g/cm³). Sa masse est :",["78 g","7,8 g","0,78 g","17,8 g"],"m = ρ × V = 7,8 × 10 = 78 g."]]},
{sem:0,name:"Les atomes et les ions",qs:[
["Un atome est constitué :",["d'un noyau et d'électrons","de molécules","d'un noyau seulement","d'ions et de molécules"],"Les électrons tournent autour du noyau, situé au centre de l'atome."],
["Le noyau de l'atome porte des charges électriques :",["positives","négatives","nulles","tantôt positives, tantôt négatives"],"Les électrons, eux, portent des charges négatives."],
["Chaque électron porte une charge électrique :",["négative, notée −e","positive, notée +e","nulle","égale à celle du noyau"],"e est la charge élémentaire."],
["La charge élémentaire e vaut :",["1,6 × 10⁻¹⁹ C","1,6 × 10¹⁹ C","9,1 × 10⁻³¹ C","6,02 × 10²³ C"],"C'est la plus petite charge électrique."],
["L'unité internationale de la charge électrique est :",["le coulomb (C)","l'ampère (A)","le volt (V)","le newton (N)"],"Son symbole est C."],
["Le numéro atomique Z d'un atome est :",["le nombre de charges positives de son noyau","sa masse en grammes","son diamètre en nanomètres","le nombre de ses molécules"],"Z est aussi le nombre d'électrons de l'atome."],
["Un atome est électriquement :",["neutre","positif","négatif","positif ou négatif selon le métal"],"Il a autant de charges positives dans le noyau que d'électrons."],
["La masse d'un atome est pratiquement égale à :",["la masse de son noyau","la masse de ses électrons","zéro","la masse d'une molécule"],"La masse des électrons est négligeable devant celle du noyau."],
["Le diamètre du noyau est :",["beaucoup plus petit que celui de l'atome","égal à celui de l'atome","plus grand que celui de l'atome","la moitié de celui de l'atome"],"L'atome est surtout formé de vide."],
["Pour exprimer les dimensions des atomes, on utilise :",["le nanomètre (nm)","le kilomètre (km)","le mètre (m)","le centimètre (cm)"],"Les atomes sont extrêmement petits."],
["1 nm est égal à :",["10⁻⁹ m","10⁻³ m","10⁹ m","10⁻⁶ m"],"Un nanomètre est un milliardième de mètre."],
["Les électrons de tous les atomes sont :",["identiques","différents d'un atome à l'autre","positifs dans les métaux","immobiles"],"Seul leur nombre change d'un atome à l'autre."],
["L'atome de carbone a pour numéro atomique Z = 6. Il possède :",["6 électrons","12 électrons","3 électrons","6 noyaux"],"Le nombre d'électrons d'un atome est égal à Z."],
["L'atome d'aluminium a Z = 13. La charge de son noyau est :",["+13e","−13e","0","+26e"],"Le noyau porte Z charges positives."],
["L'atome de cuivre a Z = 29. La charge de l'ensemble de ses électrons est :",["−29e","+29e","0","−58e"],"Il a 29 électrons, chacun de charge −e."],
["L'atome de fer a Z = 26. Sa charge totale est :",["0","+26e","−26e","+52e"],"(+26e) + (−26e) = 0 : l'atome est neutre."],
["Un ion provient d'un atome (ou d'un groupe d'atomes) qui a :",["perdu ou gagné un ou plusieurs électrons","perdu son noyau","gagné des charges positives dans son noyau","changé de masse"],"Le noyau ne change pas : seuls les électrons sont perdus ou gagnés."],
["Un cation est :",["un ion positif","un ion négatif","un atome neutre","une molécule"],"Il provient d'un atome qui a perdu un ou plusieurs électrons."],
["Un anion est :",["un ion négatif","un ion positif","un atome neutre","un noyau"],"Il provient d'un atome qui a gagné un ou plusieurs électrons."],
["Un atome qui perd des électrons devient :",["un ion positif (cation)","un ion négatif (anion)","une molécule","un autre atome"],"Il lui reste plus de charges positives que de charges négatives."],
["Un atome qui gagne des électrons devient :",["un ion négatif (anion)","un ion positif (cation)","un atome plus lourd","un noyau"],"Il a alors un excès de charges négatives."],
["L'ion chlorure Cl⁻ provient d'un atome de chlore qui a :",["gagné 1 électron","perdu 1 électron","gagné 1 charge positive","perdu son noyau"],"Le signe − indique un électron en plus."],
["L'ion aluminium Al³⁺ provient d'un atome d'aluminium qui a :",["perdu 3 électrons","gagné 3 électrons","perdu 3 noyaux","gagné 3 charges positives"],"3+ signifie trois électrons en moins."],
["L'atome de chlore a Z = 17. L'ion Cl⁻ possède :",["18 électrons","17 électrons","16 électrons","1 électron"],"17 + 1 = 18 électrons."],
["L'atome d'aluminium a Z = 13. L'ion Al³⁺ possède :",["10 électrons","13 électrons","16 électrons","3 électrons"],"13 − 3 = 10 électrons."],
["L'atome de fer a Z = 26. L'ion Fe²⁺ possède :",["24 électrons","26 électrons","28 électrons","2 électrons"],"26 − 2 = 24 électrons."],
["L'atome de cuivre a Z = 29. L'ion Cu²⁺ possède :",["27 électrons","29 électrons","31 électrons","2 électrons"],"29 − 2 = 27 électrons."],
["L'atome d'oxygène a Z = 8. L'ion oxyde O²⁻ possède :",["10 électrons","8 électrons","6 électrons","2 électrons"],"8 + 2 = 10 électrons."],
["Quand un atome se transforme en ion, la charge de son noyau :",["ne change pas","augmente","diminue","devient nulle"],"Le noyau de l'ion Al³⁺ porte toujours la charge +13e."],
["La charge de l'ion Al³⁺ est :",["+3e","−3e","+13e","−10e"],"(+13e) + (−10e) = +3e."],
["La charge de l'ion sulfate SO₄²⁻ est :",["−2e","+2e","−4e","+4e"],"Le 2− en haut à droite indique deux charges négatives en excès."],
["La charge de l'ion Cu²⁺, exprimée en coulombs, est :",["+3,2 × 10⁻¹⁹ C","+1,6 × 10⁻¹⁹ C","−3,2 × 10⁻¹⁹ C","+2 C"],"2 × 1,6 × 10⁻¹⁹ = 3,2 × 10⁻¹⁹ C."],
["Un ion monoatomique est formé :",["d'un seul atome","de plusieurs atomes","d'une molécule d'eau","de deux noyaux"],"Exemples : Na⁺, Cl⁻, Fe²⁺."],
["Lequel de ces ions est polyatomique ?",["SO₄²⁻","Cl⁻","Na⁺","Zn²⁺"],"L'ion sulfate est formé d'un atome de soufre et de quatre atomes d'oxygène."],
["La formule de l'ion fer III est :",["Fe³⁺","Fe²⁺","Fe³⁻","3Fe⁺"],"Fe²⁺ est l'ion fer II."],
["La formule de l'ion hydroxyde est :",["HO⁻","H⁺","H₃O⁺","O²⁻"],"H⁺ est l'ion hydrogène et O²⁻ l'ion oxyde."],
["La formule de l'ion sodium est :",["Na⁺","Na⁻","So⁺","S²⁻"],"Le symbole du sodium est Na."],
["L'ion NO₃⁻ s'appelle l'ion :",["nitrate","sulfate","carbonate","ammonium"],"Sulfate : SO₄²⁻ ; carbonate : CO₃²⁻ ; ammonium : NH₄⁺."],
["L'ion NH₄⁺ s'appelle l'ion :",["ammonium","nitrate","hydronium","hydroxyde"],"C'est un cation polyatomique."],
["Dans un métal, le courant électrique est dû au déplacement :",["des électrons libres","des ions","des noyaux","des molécules"],"Ces électrons peuvent se déplacer d'un atome à l'autre."],
["Dans un circuit, les électrons libres se déplacent :",["dans le sens opposé au sens conventionnel du courant","dans le sens conventionnel du courant","dans les deux sens à la fois","de la borne + vers la borne −"],"Ils vont de la borne − vers la borne + à l'extérieur du générateur."],
["Dans une solution aqueuse, le courant électrique est dû au déplacement :",["des ions (cations et anions)","des électrons libres","des molécules d'eau","des noyaux"],"Les cations et les anions se déplacent en sens opposés."]]},
{sem:0,name:"L'oxydation des métaux dans l'air",qs:[
["L'oxydation d'un métal dans l'air est une réaction chimique entre ce métal et :",["le dioxygène","le diazote","le dioxyde de carbone","l'argon"],"L'air contient environ 21 % de dioxygène."],
["La rouille se forme lorsque le fer est en contact avec :",["l'air humide (dioxygène et eau)","l'air sec seulement","l'eau bouillie sans air","l'huile"],"Il faut à la fois du dioxygène et de l'eau."],
["Un clou en fer placé dans de l'air sec :",["ne rouille pas","rouille très vite","devient noir","fond"],"Sans eau, la rouille ne se forme pas."],
["Un clou en fer placé dans de l'eau bouillie recouverte d'huile :",["ne rouille pas, car il n'y a pas de dioxygène","rouille fortement","se dissout","devient vert"],"L'ébullition chasse l'air dissous et l'huile empêche l'air de revenir."],
["Dans quel tube le clou en fer rouille-t-il le plus ?",["air et eau salée","air sec","eau bouillie et huile","huile seule"],"Le sel accélère la formation de la rouille."],
["La rouille est constituée principalement :",["d'oxyde de fer III","d'oxyde de cuivre","d'alumine","de chlorure de fer"],"Sa formule est Fe₂O₃."],
["La formule chimique de l'oxyde de fer III est :",["Fe₂O₃","Fe₃O₄","FeO₂","Fe₃O₂"],"Fe₃O₄ est l'oxyde magnétique de fer."],
["L'équation de la formation de la rouille est :",["4 Fe + 3 O₂ → 2 Fe₂O₃","Fe + O₂ → FeO₂","2 Fe + O₂ → Fe₂O₃","3 Fe + 2 O₂ → Fe₂O₃"],"De chaque côté : 4 atomes de fer et 6 atomes d'oxygène."],
["La couleur de la rouille est :",["brun-rouge","bleue","verte","blanche"],"C'est la couleur caractéristique de l'oxyde de fer III."],
["La rouille est une couche poreuse. Cela veut dire qu'elle :",["laisse passer l'air et l'eau","arrête l'air et l'eau","est très dure","est transparente"],"L'air humide continue d'atteindre le fer situé en dessous."],
["Comme la rouille est poreuse, la corrosion du fer :",["continue jusqu'à la destruction totale du fer","s'arrête après quelques jours","protège le fer","rend le fer plus solide"],"C'est pourquoi il faut protéger les objets en fer."],
["La destruction lente d'un métal par l'air humide s'appelle :",["la corrosion","la fusion","la dissolution","la combustion"],"La rouille est le résultat de la corrosion du fer."],
["Pour protéger le fer de la corrosion, on le recouvre :",["d'une couche imperméable à l'air : peinture, zinc, chrome…","d'eau salée","d'une couche de rouille","de papier mouillé"],"On empêche ainsi le contact entre le fer et l'air humide."],
["Recouvrir le fer d'une couche de zinc s'appelle :",["la galvanisation","la distillation","la filtration","la combustion"],"Le zinc forme une couche qui protège le fer."],
["Dans la formation de la rouille, les réactifs sont :",["le fer et le dioxygène","la rouille et l'eau","l'oxyde de fer III et le fer","le fer et le diazote"],"Le produit est l'oxyde de fer III."],
["La formation de la rouille est une oxydation :",["lente","vive","instantanée","impossible à l'air libre"],"Elle dure des jours ou des mois ; la combustion, elle, est une oxydation vive."],
["L'aluminium laissé à l'air se couvre d'une fine couche :",["d'alumine","de rouille","de vert-de-gris","de chlorure d'aluminium"],"L'alumine est l'oxyde d'aluminium."],
["La formule chimique de l'alumine est :",["Al₂O₃","AlO₂","Al₃O₂","Al₂O"],"Deux atomes d'aluminium pour trois atomes d'oxygène."],
["L'équation de l'oxydation de l'aluminium est :",["4 Al + 3 O₂ → 2 Al₂O₃","Al + O₂ → AlO₂","2 Al + O₂ → Al₂O₃","2 Al + 3 O₂ → Al₂O₃"],"De chaque côté : 4 atomes d'aluminium et 6 atomes d'oxygène."],
["La couche d'alumine est :",["imperméable : elle protège l'aluminium","poreuse : elle détruit l'aluminium","liquide","attirée par l'aimant"],"Contrairement à la rouille, elle arrête l'air."],
["L'aluminium n'a pas besoin d'être peint contre la corrosion car :",["la couche d'alumine le protège en profondeur","il ne réagit jamais avec le dioxygène","il est attiré par l'aimant","il est plus lourd que le fer"],"L'aluminium réagit avec le dioxygène, mais seulement en surface."],
["La différence entre la rouille et l'alumine est :",["la rouille est poreuse, l'alumine est imperméable","la rouille est imperméable, l'alumine est poreuse","les deux sont poreuses","les deux protègent le métal"],"C'est pourquoi le fer est détruit par la corrosion et pas l'aluminium."],
["La combustion d'un métal dans le dioxygène est :",["une oxydation vive","une dissolution","une fusion","un changement d'état"],"Elle produit un oxyde métallique, avec de la chaleur et de la lumière."],
["La combustion du fer dans le dioxygène produit :",["de l'oxyde magnétique de fer Fe₃O₄","de la rouille Fe₂O₃","de l'alumine Al₂O₃","du dioxyde de carbone CO₂"],"Il se forme des particules gris foncé attirées par l'aimant."],
["L'équation de la combustion du fer est :",["3 Fe + 2 O₂ → Fe₃O₄","4 Fe + 3 O₂ → 2 Fe₂O₃","Fe + O₂ → FeO₂","2 Fe + O₂ → 2 FeO"],"De chaque côté : 3 atomes de fer et 4 atomes d'oxygène."],
["La combustion du cuivre produit un oxyde de couleur :",["noire","blanche","bleue","rouge brique"],"C'est l'oxyde de cuivre II, de formule CuO."],
["L'équation de la combustion du cuivre est :",["2 Cu + O₂ → 2 CuO","Cu + O₂ → CuO₂","4 Cu + 3 O₂ → 2 Cu₂O₃","Cu + O → CuO"],"De chaque côté : 2 atomes de cuivre et 2 atomes d'oxygène."],
["La combustion du zinc produit :",["de l'oxyde de zinc ZnO, de couleur blanche","de l'oxyde de zinc ZnO, de couleur noire","de la rouille","de l'alumine"],"2 Zn + O₂ → 2 ZnO."],
["La combustion de la poudre d'aluminium produit une poudre blanche :",["d'alumine Al₂O₃","d'oxyde de zinc ZnO","d'oxyde de cuivre CuO","d'oxyde magnétique Fe₃O₄"],"4 Al + 3 O₂ → 2 Al₂O₃."],
["Dans l'équation 4 Al + 3 O₂ → 2 Al₂O₃, le nombre d'atomes d'oxygène de chaque côté est :",["6","3","2","5"],"À gauche 3 × 2 = 6 ; à droite 2 × 3 = 6."],
["Dans l'équation 3 Fe + 2 O₂ → Fe₃O₄, le nombre de molécules de dioxygène consommées est :",["2","3","4","1"],"Le coefficient placé devant O₂ est 2."],
["Un métal réagit avec le dioxygène. Le produit obtenu est :",["un oxyde métallique","un acide","un alliage","un gaz"],"Exemples : Fe₂O₃, Al₂O₃, CuO, ZnO."],
["Une voiture rouille plus vite au bord de la mer car :",["l'air y est humide et salé","l'air y est plus sec","il y a moins de dioxygène","le sable protège le fer"],"L'eau salée accélère la corrosion du fer."]]},
{sem:0,name:"La combustion des matériaux organiques",qs:[
["Les matériaux organiques sont constitués essentiellement d'atomes :",["de carbone et d'hydrogène","de fer et de cuivre","de silicium et d'oxygène","de sodium et de chlore"],"Certains contiennent aussi, en plus faible proportion, de l'oxygène, du chlore ou de l'azote."],
["Lequel de ces matériaux est organique ?",["le papier","le verre","le fer","la porcelaine"],"Le papier est fabriqué à partir du bois."],
["Parmi ces matériaux organiques, lequel est d'origine végétale ?",["le coton","le nylon","le polyéthylène","le PVC"],"Le coton est d'origine végétale ; les autres sont synthétiques."],
["Lequel de ces matériaux organiques est synthétique ?",["le nylon","le bois","le coton","la laine"],"Le nylon est fabriqué par l'industrie."],
["La combustion d'un matériau organique est une réaction chimique avec :",["le dioxygène de l'air","le diazote de l'air","la vapeur d'eau","le dioxyde de carbone"],"Le dioxygène est le comburant."],
["Dans la combustion du papier, le comburant est :",["le dioxygène","le papier","le dioxyde de carbone","l'eau"],"Le papier est le combustible."],
["La combustion complète d'un matériau organique produit :",["du dioxyde de carbone et de l'eau","du carbone et du monoxyde de carbone seulement","du dioxygène","du fer et de l'eau"],"Le carbone du matériau donne CO₂ et l'hydrogène donne H₂O."],
["Pour mettre en évidence le dioxyde de carbone, on utilise :",["l'eau de chaux, qui se trouble","le sulfate de cuivre anhydre, qui bleuit","le nitrate d'argent","la soude"],"L'eau de chaux devient blanche et trouble en présence de CO₂."],
["Pour mettre en évidence l'eau formée lors d'une combustion, on utilise :",["le sulfate de cuivre anhydre","l'eau de chaux","le papier pH","un aimant"],"Le sulfate de cuivre anhydre, blanc, devient bleu au contact de l'eau."],
["Au contact de l'eau, le sulfate de cuivre anhydre passe :",["du blanc au bleu","du bleu au blanc","du blanc au rouge","du vert au noir"],"C'est le test de reconnaissance de l'eau."],
["Quand on brûle du papier, l'eau de chaux se trouble. Cela prouve la formation :",["de dioxyde de carbone","d'eau","de dioxygène","de carbone"],"Le trouble de l'eau de chaux est le test du CO₂."],
["Quand on brûle du papier, la fumée noire indique la formation :",["de carbone","d'eau","de dioxygène","de dioxyde de carbone"],"Le carbone non brûlé forme la suie noire."],
["Le papier qui brûle avec une flamme jaune et une fumée noire subit une combustion :",["incomplète","complète","sans dioxygène","impossible"],"La fumée noire (carbone) est le signe d'une combustion incomplète."],
["Une combustion est incomplète quand :",["le dioxygène est en quantité insuffisante","le dioxygène est en excès","il n'y a pas de combustible","la température est trop basse pour brûler"],"Tout le carbone ne peut pas se transformer en dioxyde de carbone."],
["La combustion incomplète du papier produit :",["de l'eau, du dioxyde de carbone, du monoxyde de carbone et du carbone","seulement de l'eau","seulement du dioxyde de carbone","du dioxygène et du diazote"],"Papier + O₂ → H₂O + CO₂ + CO + C."],
["La formation de CO₂ lors de la combustion du papier montre que le papier contient des atomes :",["de carbone","de chlore","d'azote","de fer"],"Les atomes se conservent : le carbone du CO₂ vient du papier."],
["La formation d'eau lors de la combustion du papier montre que le papier contient des atomes :",["d'hydrogène","de chlore","d'azote","de soufre"],"L'hydrogène de H₂O vient du papier."],
["La formule du monoxyde de carbone est :",["CO","CO₂","C","H₂O"],"CO₂ est le dioxyde de carbone."],
["Le monoxyde de carbone est un gaz :",["toxique, inodore et incolore","sans danger","coloré et parfumé","qui rallume une bûchette"],"On ne peut ni le voir ni le sentir : il peut être mortel."],
["La combustion complète du polyéthylène produit essentiellement :",["de l'eau et du dioxyde de carbone","du chlorure d'hydrogène","du cyanure d'hydrogène","du carbone seulement"],"Le polyéthylène ne contient que du carbone et de l'hydrogène."],
["La combustion incomplète du polyéthylène produit, en plus de l'eau et du dioxyde de carbone :",["du carbone et du monoxyde de carbone","du chlorure d'hydrogène","du cyanure d'hydrogène","du dioxygène"],"Le monoxyde de carbone est un gaz toxique."],
["La combustion du PVC libère un gaz toxique :",["le chlorure d'hydrogène","le dioxygène","le diazote","la vapeur d'eau"],"Le PVC contient des atomes de chlore."],
["La formule du chlorure d'hydrogène est :",["HCl","HCN","CO","H₂O"],"HCN est le cyanure d'hydrogène."],
["La formation de chlorure d'hydrogène montre que le PVC contient des atomes :",["de chlore","d'azote","de fer","de soufre"],"PVC signifie polychlorure de vinyle."],
["La combustion du nylon libère un gaz mortel :",["le cyanure d'hydrogène","le dioxygène","le dihydrogène","le diazote"],"Sa formule est HCN."],
["La formation de cyanure d'hydrogène (HCN) montre que le nylon contient des atomes :",["d'azote","de chlore","de fer","de soufre"],"N est le symbole de l'azote."],
["Brûler des déchets plastiques à l'air libre est dangereux car cela :",["libère des gaz toxiques","produit du dioxygène","refroidit l'air","purifie l'air"],"Par exemple CO, HCl ou HCN selon le plastique."],
["Parmi ces produits de combustion, lequel n'est pas toxique ?",["la vapeur d'eau","le monoxyde de carbone","le chlorure d'hydrogène","le cyanure d'hydrogène"],"CO, HCl et HCN sont des gaz dangereux."],
["Pour éviter l'intoxication au monoxyde de carbone à la maison, il faut :",["bien aérer les pièces où brûle un chauffage","fermer toutes les fenêtres","brûler du plastique","boucher les aérations"],"Une bonne aération apporte assez de dioxygène."],
["Le dioxyde de carbone rejeté par les combustions contribue :",["à l'effet de serre","à la formation de l'ozone","à la purification de l'air","à la formation de la rouille"],"C'est un gaz à effet de serre."],
["Au cours d'une combustion, les atomes :",["se conservent","disparaissent","se transforment en d'autres atomes","se multiplient"],"On retrouve dans les produits les atomes présents dans les réactifs."],
["Le polyéthylène est constitué uniquement d'atomes :",["de carbone et d'hydrogène","de carbone et de chlore","d'hydrogène et d'azote","de carbone et d'oxygène"],"C'est pourquoi sa combustion complète ne donne que CO₂ et H₂O."]]},
{sem:0,name:"Les solutions acides et basiques (pH)",qs:[
["Une solution aqueuse est obtenue en dissolvant un soluté dans :",["l'eau","l'huile","l'alcool","l'acétone"],"Dans une solution aqueuse, le solvant est l'eau."],
["Dans l'eau salée, le sel est :",["le soluté","le solvant","la solution","le précipité"],"Solution = soluté + solvant."],
["Une solution aqueuse est un mélange :",["homogène","hétérogène","toujours coloré","solide"],"On ne distingue pas le soluté dissous à l'œil nu."],
["Le pH est un nombre :",["sans unité","en grammes par litre","en volts","en degrés Celsius"],"Il renseigne sur l'acidité d'une solution aqueuse."],
["Le pH d'une solution aqueuse est compris entre :",["0 et 14","0 et 7","1 et 100","7 et 14"],"L'échelle de pH va de 0 à 14."],
["Une solution de pH = 3 est :",["acide","neutre","basique","pure"],"pH < 7 : la solution est acide."],
["Une solution de pH = 11 est :",["basique","acide","neutre","salée"],"pH > 7 : la solution est basique."],
["Une solution de pH = 7 est :",["neutre","acide","basique","concentrée"],"C'est le cas de l'eau pure."],
["Le pH de l'eau pure est :",["7","0","14","1"],"L'eau pure est neutre."],
["Pour mesurer le pH, on utilise :",["le papier pH ou le pH-mètre","un thermomètre","un voltmètre","une balance"],"Le papier pH change de couleur selon le pH de la solution."],
["Le papier pH donne une valeur du pH :",["approchée","très précise","toujours égale à 7","en volts"],"On compare la couleur obtenue aux couleurs de l'échelle."],
["Le pH-mètre donne une valeur du pH :",["précise","approchée","toujours entière","fausse"],"La valeur s'affiche directement sur l'écran de l'appareil."],
["Pour utiliser le papier pH, on :",["dépose une goutte de solution dessus puis on compare la couleur à l'échelle","le plonge dans le flacon et on le goûte","le chauffe avec une flamme","le pèse sur une balance"],"On ne goûte jamais un produit chimique."],
["Avant de plonger la sonde du pH-mètre dans une solution, il faut :",["la rincer","la chauffer","la sécher à la flamme","la tremper dans un acide concentré"],"Le rinçage évite de mélanger les solutions."],
["L'ion responsable du caractère acide d'une solution est :",["l'ion hydrogène H⁺","l'ion hydroxyde HO⁻","l'ion chlorure Cl⁻","l'ion sodium Na⁺"],"Plus il y a d'ions H⁺, plus la solution est acide."],

["Diluer une solution, c'est :",["lui ajouter de l'eau","la chauffer","lui ajouter du soluté","la filtrer"],"La solution devient moins concentrée."],
["Quand on dilue une solution acide, son pH :",["augmente et se rapproche de 7","diminue","dépasse 7","ne change pas"],"Elle devient moins acide, mais elle reste acide."],
["Quand on dilue une solution basique, son pH :",["diminue et se rapproche de 7","augmente","devient inférieur à 7","ne change pas"],"Elle devient moins basique, mais elle reste basique."],

["Une solution acide très diluée peut-elle devenir basique ?",["Non, son pH reste inférieur à 7","Oui, si on ajoute beaucoup d'eau","Oui, toujours","Oui, si l'eau est froide"],"La dilution rapproche le pH de 7, sans le dépasser."],

["Pour manipuler une solution acide ou basique concentrée, il faut porter :",["une blouse, des gants et des lunettes de protection","des vêtements légers","seulement une montre","rien de particulier"],"Ces solutions peuvent provoquer de graves brûlures."],

{sem:0,name:"Action des solutions acides et basiques sur les métaux",qs:[
["La formule ionique de la solution d'acide chlorhydrique est :",["(H⁺ + Cl⁻)","(Na⁺ + HO⁻)","(Na⁺ + Cl⁻)","(Fe²⁺ + 2 Cl⁻)"],"Elle contient des ions hydrogène H⁺ et des ions chlorure Cl⁻."],
["L'acide chlorhydrique réagit avec :",["le fer, le zinc et l'aluminium","le cuivre seulement","le cuivre, l'or et l'argent","aucun métal"],"Il ne réagit pas avec le cuivre."],
["Parmi ces métaux, lequel ne réagit pas avec l'acide chlorhydrique ?",["le cuivre","le fer","le zinc","l'aluminium"],"On n'observe aucun dégagement gazeux avec le cuivre."],
["Le gaz qui se dégage quand l'acide chlorhydrique attaque un métal est :",["le dihydrogène","le dioxygène","le dioxyde de carbone","le diazote"],"Sa formule est H₂."],
["La formule du dihydrogène est :",["H₂","H⁺","H₂O","HO⁻"],"H⁺ est l'ion hydrogène."],
["On reconnaît le dihydrogène car, à l'approche d'une flamme, il :",["produit une détonation","éteint la flamme sans bruit","rallume une bûchette incandescente","trouble l'eau de chaux"],"On entend un petit « boum »."],
["Lors de la réaction de l'acide chlorhydrique avec le fer, les atomes de fer se transforment en :",["ions fer II Fe²⁺","ions fer III Fe³⁺","rouille","oxyde de fer"],"Chaque atome de fer perd deux électrons."],
["Lors de la réaction avec un métal, les ions hydrogène H⁺ de l'acide se transforment en :",["molécules de dihydrogène H₂","molécules d'eau","ions chlorure","ions hydroxyde"],"C'est le gaz qui se dégage."],
["L'équation bilan de la réaction du fer avec l'acide chlorhydrique est :",["Fe + 2 H⁺ → Fe²⁺ + H₂","Fe + H⁺ → Fe⁺ + H","Fe + 2 Cl⁻ → FeCl₂","Fe + H₂ → Fe²⁺ + 2 H⁺"],"Les atomes et les charges se conservent : 2+ de chaque côté."],
["L'équation bilan de la réaction du zinc avec l'acide chlorhydrique est :",["Zn + 2 H⁺ → Zn²⁺ + H₂","Zn + H⁺ → Zn⁺ + H₂","Zn + 2 Cl⁻ → ZnCl₂","2 Zn + 6 H⁺ → 2 Zn³⁺ + 3 H₂"],"L'atome de zinc se transforme en ion Zn²⁺."],
["L'équation bilan de la réaction de l'aluminium avec l'acide chlorhydrique est :",["2 Al + 6 H⁺ → 2 Al³⁺ + 3 H₂","Al + 2 H⁺ → Al²⁺ + H₂","Al + 3 H⁺ → Al³⁺ + H₂","2 Al + 3 H⁺ → 2 Al³⁺ + 3 H₂"],"6 charges + à gauche et 2 × 3 = 6 charges + à droite."],
["Lors de la réaction de l'aluminium avec l'acide chlorhydrique, il se forme des ions :",["Al³⁺","Al²⁺","Al⁺","Al³⁻"],"Chaque atome d'aluminium perd trois électrons."],
["Lors de la réaction de l'acide chlorhydrique avec un métal, les ions chlorure Cl⁻ :",["ne participent pas à la réaction","se transforment en dichlore","se transforment en dihydrogène","disparaissent"],"Ce sont des ions spectateurs : on ne les écrit pas dans l'équation bilan."],
["La solution obtenue après la réaction de l'acide chlorhydrique avec le fer est une solution de :",["chlorure de fer II","chlorure de fer III","chlorure de zinc","sulfate de fer II"],"Elle contient les ions Fe²⁺ et Cl⁻."],
["La formule ionique de la solution de chlorure de fer II est :",["(Fe²⁺ + 2 Cl⁻)","(Fe²⁺ + Cl⁻)","(Fe³⁺ + 3 Cl⁻)","(2 Fe²⁺ + Cl⁻)"],"Il faut deux ions Cl⁻ pour compenser la charge d'un ion Fe²⁺."],
["La formule ionique de la solution de chlorure de zinc est :",["(Zn²⁺ + 2 Cl⁻)","(Zn⁺ + Cl⁻)","(Zn²⁺ + Cl⁻)","(Zn³⁺ + 3 Cl⁻)"],"La solution est électriquement neutre."],
["La formule ionique de la solution de chlorure d'aluminium est :",["(Al³⁺ + 3 Cl⁻)","(Al³⁺ + Cl⁻)","(Al²⁺ + 2 Cl⁻)","(3 Al³⁺ + Cl⁻)"],"Trois ions Cl⁻ compensent la charge d'un ion Al³⁺."],
["Pendant que l'acide chlorhydrique attaque le fer, le pH de la solution :",["augmente, car des ions H⁺ sont consommés","diminue","reste égal à 7","devient égal à 0"],"Il y a de moins en moins d'ions H⁺ : la solution devient moins acide."],
["La solution de soude a pour formule ionique :",["(Na⁺ + HO⁻)","(H⁺ + Cl⁻)","(Na⁺ + Cl⁻)","(Zn²⁺ + 2 HO⁻)"],"La soude est une solution d'hydroxyde de sodium."],
["La solution de soude réagit avec :",["l'aluminium et le zinc","le fer et le cuivre","le cuivre seulement","tous les métaux"],"Elle ne réagit ni avec le fer ni avec le cuivre."],
["Parmi ces métaux, lesquels ne réagissent pas avec la solution de soude ?",["le fer et le cuivre","le zinc et l'aluminium","l'aluminium et le fer","le zinc et le cuivre"],"Seuls le zinc et l'aluminium sont attaqués par la soude."],
["Le gaz dégagé lors de la réaction de la soude avec l'aluminium est :",["le dihydrogène","le dioxygène","le dioxyde de carbone","le dichlore"],"On le reconnaît à la détonation près d'une flamme."],
["La réaction du zinc avec la soude produit du dihydrogène et :",["du zincate de sodium","du chlorure de zinc","de l'oxyde de zinc","de l'alumine"],"Zinc + hydroxyde de sodium → dihydrogène + zincate de sodium."],
["La réaction de l'aluminium avec la soude produit du dihydrogène et :",["de l'aluminate de sodium","du chlorure d'aluminium","de l'alumine","du zincate de sodium"],"Aluminium + hydroxyde de sodium → dihydrogène + aluminate de sodium."],
["Le métal qui ne réagit ni avec l'acide chlorhydrique ni avec la soude est :",["le cuivre","le zinc","l'aluminium","le fer"],"Le fer réagit avec l'acide ; le zinc et l'aluminium réagissent avec les deux."],
["Les métaux qui réagissent à la fois avec l'acide chlorhydrique et avec la soude sont :",["le zinc et l'aluminium","le fer et le cuivre","le cuivre et le zinc","le fer et l'aluminium"],"Le fer ne réagit qu'avec l'acide ; le cuivre avec aucun des deux."],
["Le métal qui réagit avec l'acide chlorhydrique mais pas avec la soude est :",["le fer","le zinc","l'aluminium","le cuivre"],"Le cuivre ne réagit avec aucune de ces deux solutions."],
["Au laboratoire, on conserve les acides et les bases dans des flacons :",["en verre ou en plastique","en fer","en zinc","en aluminium"],"Le verre et les plastiques ne sont pas facilement attaqués par ces solutions."],
["On ne doit pas conserver une solution de soude dans un récipient en aluminium car :",["la soude attaque l'aluminium","l'aluminium est trop léger","la soude devient acide","l'aluminium est isolant"],"Le récipient serait percé et du dihydrogène se dégagerait."],
["On peut conserver de l'acide chlorhydrique dilué dans un récipient en :",["cuivre","fer","zinc","aluminium"],"Parmi ces quatre métaux, seul le cuivre n'est pas attaqué par cet acide."],
["Dans l'équation Fe + 2 H⁺ → Fe²⁺ + H₂, les réactifs sont :",["le fer et les ions hydrogène","les ions fer II et le dihydrogène","les ions chlorure","le fer et le dihydrogène"],"Les produits sont les ions Fe²⁺ et le dihydrogène H₂."],
["Dans l'équation Zn + 2 H⁺ → Zn²⁺ + H₂, la charge totale de chaque côté est :",["2+","0","1+","4+"],"À gauche : 2 × (1+) ; à droite : 2+. Les charges se conservent."],
["Un détartrant contient de l'acide chlorhydrique. Il ne faut pas l'utiliser sur un objet en :",["zinc","verre","plastique","porcelaine"],"L'acide attaque le zinc avec dégagement de dihydrogène."]]},
{sem:0,name:"Tests de reconnaissance de quelques ions",qs:[
["Toute solution aqueuse ionique est électriquement :",["neutre","positive","négative","chargée selon sa couleur"],"La somme des charges des cations et des anions est égale à zéro."],
["La formule ionique de la solution de chlorure de sodium est :",["(Na⁺ + Cl⁻)","(Na⁺ + HO⁻)","(H⁺ + Cl⁻)","(Na²⁺ + 2 Cl⁻)"],"C'est l'eau salée."],
["La formule ionique de la solution de sulfate de cuivre est :",["(Cu²⁺ + SO₄²⁻)","(Cu⁺ + SO₄⁻)","(Cu²⁺ + 2 Cl⁻)","(2 Cu²⁺ + SO₄²⁻)"],"La charge 2+ de l'ion cuivre compense la charge 2− de l'ion sulfate."],
["La formule ionique de la solution de chlorure de fer III est :",["(Fe³⁺ + 3 Cl⁻)","(Fe³⁺ + Cl⁻)","(Fe²⁺ + 2 Cl⁻)","(3 Fe³⁺ + Cl⁻)"],"Il faut trois ions Cl⁻ pour un ion Fe³⁺."],
["La formule ionique de la solution de nitrate d'argent est :",["(Ag⁺ + NO₃⁻)","(Ag⁺ + Cl⁻)","(Na⁺ + NO₃⁻)","(Ag²⁺ + 2 NO₃⁻)"],"Elle sert à reconnaître les ions chlorure."],
["La formule ionique de la solution de sulfate de fer II est :",["(Fe²⁺ + SO₄²⁻)","(Fe³⁺ + SO₄²⁻)","(Fe²⁺ + 2 Cl⁻)","(Fe²⁺ + 2 SO₄²⁻)"],"Un ion Fe²⁺ pour un ion SO₄²⁻."],
["Un précipité est :",["un solide qui se forme dans une solution","un gaz qui se dégage","un liquide coloré","un papier indicateur"],"Il apparaît quand certains ions se rencontrent."],
["Pour reconnaître les ions chlorure Cl⁻, on utilise :",["la solution de nitrate d'argent","la solution de soude","l'eau de chaux","le sulfate de cuivre anhydre"],"C'est la solution détectrice des ions chlorure."],
["Avec le nitrate d'argent, les ions chlorure donnent un précipité :",["blanc qui noircit à la lumière","bleu","vert foncé","rouille"],"Ce précipité est le chlorure d'argent."],
["Le précipité obtenu lors du test des ions chlorure s'appelle :",["le chlorure d'argent","le nitrate d'argent","le chlorure de sodium","l'hydroxyde d'argent"],"Sa formule est AgCl."],
["La formule du chlorure d'argent est :",["AgCl","AgNO₃","NaCl","Ag₂O"],"Un ion Ag⁺ s'associe à un ion Cl⁻."],
["L'équation de précipitation du chlorure d'argent est :",["Ag⁺ + Cl⁻ → AgCl","Ag + Cl → AgCl₂","Ag⁺ + NO₃⁻ → AgNO₃","Na⁺ + Cl⁻ → NaCl"],"Les ions Na⁺ et NO₃⁻ ne participent pas à la réaction."],
["Exposé à la lumière, le précipité de chlorure d'argent :",["noircit","devient bleu","disparaît","devient vert"],"C'est ce qui le distingue des autres précipités blancs."],
["Pour reconnaître les ions métalliques Cu²⁺, Fe²⁺, Fe³⁺, Zn²⁺ et Al³⁺, on utilise :",["la solution de soude","la solution de nitrate d'argent","l'eau de chaux","le papier pH"],"La couleur du précipité obtenu indique l'ion présent."],
["Les ions de la soude qui réagissent avec les ions métalliques sont :",["les ions hydroxyde HO⁻","les ions sodium Na⁺","les ions chlorure Cl⁻","les ions hydrogène H⁺"],"Ils forment des hydroxydes métalliques insolubles."],
["Avec la soude, les ions cuivre II Cu²⁺ donnent un précipité :",["bleu","vert foncé","rouille","blanc"],"C'est l'hydroxyde de cuivre II."],
["Avec la soude, les ions fer II Fe²⁺ donnent un précipité :",["vert foncé","bleu","rouille","blanc"],"C'est l'hydroxyde de fer II."],
["Avec la soude, les ions fer III Fe³⁺ donnent un précipité :",["rouille","vert foncé","bleu","blanc"],"C'est l'hydroxyde de fer III."],
["Avec la soude, les ions zinc Zn²⁺ donnent un précipité :",["blanc","bleu","vert foncé","rouille"],"C'est l'hydroxyde de zinc."],
["Avec la soude, les ions aluminium Al³⁺ donnent un précipité :",["blanc","bleu","rouille","vert foncé"],"C'est l'hydroxyde d'aluminium."],
["La formule de l'hydroxyde de cuivre II est :",["Cu(OH)₂","CuOH","Cu(OH)₃","Cu₂OH"],"Un ion Cu²⁺ s'associe à deux ions HO⁻."],
["La formule de l'hydroxyde de fer III est :",["Fe(OH)₃","Fe(OH)₂","FeOH","Fe₃OH"],"Un ion Fe³⁺ s'associe à trois ions HO⁻."],
["La formule de l'hydroxyde de fer II est :",["Fe(OH)₂","Fe(OH)₃","Fe₂OH","FeO"],"Un ion Fe²⁺ s'associe à deux ions HO⁻."],
["La formule de l'hydroxyde d'aluminium est :",["Al(OH)₃","Al(OH)₂","AlOH","Al₃OH"],"Un ion Al³⁺ s'associe à trois ions HO⁻."],
["L'équation de précipitation de l'hydroxyde de cuivre II est :",["Cu²⁺ + 2 HO⁻ → Cu(OH)₂","Cu²⁺ + HO⁻ → CuOH","Cu²⁺ + 3 HO⁻ → Cu(OH)₃","Cu + 2 HO → Cu(OH)₂"],"Deux charges − compensent les deux charges + de l'ion cuivre."],
["L'équation de précipitation de l'hydroxyde de fer III est :",["Fe³⁺ + 3 HO⁻ → Fe(OH)₃","Fe³⁺ + 2 HO⁻ → Fe(OH)₂","Fe²⁺ + 2 HO⁻ → Fe(OH)₂","Fe³⁺ + HO⁻ → FeOH"],"Il faut trois ions HO⁻ pour un ion Fe³⁺."],
["L'équation de précipitation de l'hydroxyde de zinc est :",["Zn²⁺ + 2 HO⁻ → Zn(OH)₂","Zn²⁺ + HO⁻ → ZnOH","Zn³⁺ + 3 HO⁻ → Zn(OH)₃","Zn + 2 HO⁻ → ZnO"],"Le précipité obtenu est blanc."],

["Une solution donne un précipité vert foncé avec la soude. Elle contient des ions :",["Fe²⁺","Fe³⁺","Cu²⁺","Al³⁺"],"Vert foncé : fer II."],
["Une solution donne un précipité rouille avec la soude. Elle contient des ions :",["Fe³⁺","Fe²⁺","Cu²⁺","Zn²⁺"],"Rouille : fer III."],
["Une solution donne un précipité blanc avec la soude. Elle peut contenir des ions :",["Zn²⁺ ou Al³⁺","Cu²⁺","Fe²⁺","Fe³⁺"],"Ces deux ions donnent un précipité blanc."],
["Une solution donne un précipité bleu avec la soude et un précipité blanc qui noircit à la lumière avec le nitrate d'argent. C'est une solution de :",["chlorure de cuivre II","chlorure de fer II","sulfate de cuivre","chlorure de zinc"],"Précipité bleu : ions Cu²⁺ ; précipité blanc qui noircit : ions Cl⁻."],
["Une solution donne un précipité rouille avec la soude et un précipité blanc qui noircit à la lumière avec le nitrate d'argent. C'est une solution de :",["chlorure de fer III","chlorure de fer II","sulfate de fer III","chlorure de cuivre II"],"Rouille : ions Fe³⁺ ; précipité blanc qui noircit : ions Cl⁻."],
["Après l'attaque du fer par l'acide chlorhydrique, on ajoute de la soude à la solution obtenue. Le précipité est :",["vert foncé","bleu","rouille","blanc"],"La solution contient des ions fer II Fe²⁺."],
["Après l'attaque du zinc par l'acide chlorhydrique, on ajoute de la soude à la solution obtenue. Le précipité est :",["blanc","bleu","vert foncé","rouille"],"La solution contient des ions zinc Zn²⁺."],
["On ajoute du nitrate d'argent à de l'acide chlorhydrique. On observe :",["un précipité blanc qui noircit à la lumière","un précipité bleu","un dégagement de dihydrogène","aucun changement"],"L'acide chlorhydrique contient des ions chlorure Cl⁻."],
["Dans la solution de chlorure de fer III (Fe³⁺ + 3 Cl⁻), on trouve :",["trois ions Cl⁻ pour un ion Fe³⁺","un ion Cl⁻ pour trois ions Fe³⁺","autant d'ions Cl⁻ que d'ions Fe³⁺","seulement des ions Fe³⁺"],"Ainsi la solution reste électriquement neutre."],
["Une solution de sulfate de zinc (Zn²⁺ + SO₄²⁻) donne, avec la soude, un précipité :",["blanc d'hydroxyde de zinc","bleu d'hydroxyde de cuivre","rouille d'hydroxyde de fer III","blanc de chlorure d'argent"],"Elle contient des ions Zn²⁺."]]},
{sem:0,name:"Dangers de quelques matériaux usuels",qs:[

["Le pictogramme représentant un point d'exclamation signifie que le produit est :",["nocif ou irritant","explosif","comburant","sans danger"],"Il peut irriter la peau, les yeux ou les voies respiratoires."],
