<title>QCM 3AC</title>
<meta name="description" content="QCM de physique-chimie pour la 3ème année collège (3AC) : 17 leçons, entraînement et quiz notés.">

<style>
/* Layout: une colonne type téléphone ; accueil = tableau noir + onglets de niveau + liste des leçons ; quiz = énoncé au tableau, réponses A–D empilées */
:root{
  --bg:#edf2f0; --surface:#ffffff; --ink:#1b2a26; --muted:#5a6d67; --line:#d2dcd8;
  --board:#22463d; --boardink:#f2f6f3; --chalk:#f5df72; --good:#2e8b57; --bad:#c2453b;
  --c1:#e3a93b; --c2:#4f9cc4; --c3:#d26f55;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121e1b; --surface:#1b2b27; --ink:#e8f0ed; --muted:#9db1aa; --line:#2e443e;
  --board:#295449; --good:#5cc286; --bad:#ec7a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121e1b; --surface:#1b2b27; --ink:#e8f0ed; --muted:#9db1aa; --line:#2e443e;
  --board:#295449; --good:#5cc286; --bad:#ec7a6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:16px;padding-block:16px 32px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit}
.board{background:var(--board);color:var(--boardink);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.board h1{font-size:2rem;color:var(--chalk)}
.board p{margin:6px 0 0;opacity:.92;max-width:40ch}
.board .formula{position:absolute;right:-6px;bottom:-18px;font-family:var(--display);font-size:3.6rem;color:#fff;opacity:.08;white-space:nowrap;pointer-events:none}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.13);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tabs:has(> .tab:only-child){display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.25rem;line-height:1.1}
.tab small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{background:var(--lc);border-color:var(--lc);color:#1b2a26}
.tab[aria-selected="true"] small{color:#1b2a26}
.tab:focus-visible,.lesson:focus-visible,.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;transition:border-color .15s,transform .15s}
.lesson:hover{border-color:var(--lc);transform:translateX(2px)}
.lesson .num{width:40px;height:40px;border-radius:12px;background:var(--lc);color:#1b2a26;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem}
.lesson .txt{min-width:0}
.lesson h3{font-size:1.08rem}
.lesson small{color:var(--muted);font-size:.85rem}
.lesson.mix{background:var(--board);border-color:var(--board);color:var(--boardink)}
.lesson.mix small{color:var(--boardink);opacity:.8}
.lesson.mix .num{background:var(--chalk)}
.stars{color:var(--c1);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.lesson.mix .stars .off{color:rgba(255,255,255,.25)}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.back{all:unset;cursor:pointer;font-weight:800;color:var(--muted);padding:6px 2px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.question{background:var(--board);color:var(--boardink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.question .tag{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:800}
.question .q{font-family:var(--display);font-size:clamp(1.25rem,5.2vw,1.6rem);color:var(--chalk);line-height:1.25;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .letter{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--lc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.ok .letter{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.ko .letter{background:var(--bad);color:#fff}
.explain{border-radius:14px;padding:12px 14px;border:2px solid;font-size:.95rem}
.explain.ok{border-color:var(--good)} .explain.ko{border-color:var(--bad)}
.explain b{display:block;font-family:var(--display);font-size:1.1rem}
.explain.ok b{color:var(--good)} .explain.ko b{color:var(--bad)}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;font-family:var(--display);font-size:1.15rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .big{font-family:var(--display);font-size:4rem;line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
.result .stars{font-size:2rem}
.actions{display:grid;gap:10px}
.review{display:flex;flex-direction:column;gap:8px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:.92rem}
.miss .good{color:var(--good);font-weight:800}
.tip{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
.pop{animation:pop .2s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.3rem}
.form label{font-weight:800;font-size:.9rem;margin-bottom:-6px}
.form input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.form input:focus,textarea:focus{outline:none;border-color:var(--c2)}
.err{color:var(--bad);font-weight:700;margin:0}
.ok-text{color:var(--good);font-weight:700;margin:0}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.link{all:unset;cursor:pointer;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:center;padding:6px}
.link:focus-visible{outline:3px solid var(--c2)}
.opt.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 18%,var(--surface))}
.opt.sel .letter{background:var(--lc);color:#1b2a26}
.btn:disabled{opacity:.45;cursor:default}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.check:has(input:checked){border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,var(--surface))}
.check input{width:20px;height:20px;accent-color:var(--board)}
.check small{color:var(--muted);white-space:nowrap}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--board);color:var(--boardink);border-radius:14px;padding:14px 16px}
.codebox .code{font-family:var(--display);font-size:2rem;color:var(--chalk);letter-spacing:.04em;line-height:1}
.small-btn{all:unset;cursor:pointer;font-weight:800;font-size:.9rem;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);text-align:center}
.codebox .small-btn{background:var(--chalk);color:#1b2a26}
.small-btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.small-btn.danger{background:var(--bad);color:#fff}
.small-btn:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;overflow-wrap:anywhere;user-select:all}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.ko{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.summary span{font-size:.75rem;color:var(--muted);font-weight:700}
.corr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:10px 12px;font-size:.92rem}
.corr.wrong{border-left-color:var(--bad)}
.corr .you{color:var(--bad);font-weight:800}
.corr .good{color:var(--good);font-weight:800}
a.btn{text-decoration:none}
.addr{font-weight:800;overflow-wrap:anywhere;user-select:all}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input{flex:1 1 200px}
.form select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.form select:focus{outline:none;border-color:var(--c2)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.settings .field{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .settings label{margin:0}
.timer{align-self:center;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;padding:4px 16px;border-radius:99px;background:var(--surface);border:2px solid var(--line)}
.ctx p{margin:0;font-size:.95rem;line-height:1.5}
.ctx .label{color:var(--lc)}
.timer.low{border-color:var(--bad);color:var(--bad)}
</style>

<div class="app" id="app"></div>

<script>
/* Banque de questions : [énoncé, [bonne réponse, distracteur, distracteur, distracteur], explication] */
const BANK={
"3AC":{color:"var(--c3)",sub:"3ème année",sems:["Chimie : la matière","Mécanique et électricité","Exercices de synthèse"],chapters:[
{sem:0,name:"Quelques matériaux utilisés au quotidien",qs:[["Vrai ou faux : Le cuivre est attiré par un aimant.", ["Faux", "Vrai"], "Parmi les métaux usuels, seul le fer est attiré par un aimant."], ["Vrai ou faux : Un objet en verre est fabriqué avec un matériau organique.", ["Faux", "Vrai"], "Le verre appartient à la famille des céramiques."], ["Vrai ou faux : On peut utiliser le même matériau pour fabriquer des objets différents.", ["Vrai", "Faux"], "Exemple : le plastique sert à fabriquer des bouteilles, des seaux, des poignées…"], ["Vrai ou faux : L'aluminium est le plus léger des métaux usuels (fer, cuivre, zinc, aluminium).", ["Vrai", "Faux"], "ρ(Al) = 2,7 g/cm³, bien plus faible que celles du fer, du zinc et du cuivre."], ["Vrai ou faux : Le polystyrène (PS) flotte sur l'eau douce.", ["Faux", "Vrai"], "Le PS coule dans l'eau douce et flotte dans l'eau salée."], ["Vrai ou faux : Le PVC brûle avec une flamme verte.", ["Vrai", "Faux"], "La flamme verte est le test de reconnaissance du PVC."], ["Vrai ou faux : Un alliage est un mélange d'un métal avec d'autres éléments, le plus souvent d'autres métaux.", ["Vrai", "Faux"], "Exemples : laiton (Cu + Zn), bronze (Cu + Sn), acier (Fe + C)."], ["Vrai ou faux : Le PET se déforme dans l'eau bouillante.", ["Vrai", "Faux"], "C'est le test de reconnaissance du PET."], ["Vrai ou faux : Le zinc est un métal gris attiré par un aimant.", ["Faux", "Vrai"], "Le zinc est gris mais il n'est pas attiré par un aimant."], ["Vrai ou faux : Le polyéthylène (PE) flotte sur l'eau douce et sur l'eau salée.", ["Vrai", "Faux"], "Sa masse volumique (≈ 0,95 g/cm³) est inférieure à celle de l'eau douce."], ["Compléter : Les trois familles des matériaux sont les métaux, les matériaux organiques et les ……", ["céramiques", "plastiques", "alliages", "verres"], "Métaux, matériaux organiques et céramiques."], ["Compléter : Le verre, la porcelaine et la brique appartiennent à la famille des ……", ["céramiques", "métaux", "matériaux organiques", "plastiques"], "Ce sont des matériaux minéraux obtenus à haute température : les céramiques."], ["Compléter : Le …… est un type de plastique qui brûle avec une flamme verte.", ["PVC", "PE", "PS", "PET"], "Flamme verte → PVC."], ["Compléter : …… est un métal gris, léger, qui n'est pas attiré par un aimant.", ["L'aluminium", "Le fer", "Le cuivre", "L'or"], "L'aluminium : gris, léger (2,7 g/cm³), non attiré par l'aimant."], ["Compléter : Le cuivre est un métal de couleur ……", ["rouge brique", "grise", "jaune", "blanche"], "Le cuivre se reconnaît à sa couleur rouge brique."], ["Compléter : Le laiton est un alliage de cuivre et de ……", ["zinc", "fer", "étain", "aluminium"], "Laiton = cuivre + zinc."], ["Compléter : Le bronze est un alliage de cuivre et d'……", ["étain", "zinc", "aluminium", "argent"], "Bronze = cuivre + étain."], ["Compléter : L'acier est un alliage de fer et de ……", ["carbone", "cuivre", "zinc", "étain"], "Acier = fer + un peu de carbone."], ["Cocher la bonne réponse : Le métal attiré par un aimant est :", ["le fer", "le zinc", "l'aluminium", "le cuivre"], "Le fer est le seul métal usuel attiré par un aimant."], ["Un tournevis testeur a une lame en acier et une poignée en plastique. La lame appartient à la famille des :", ["métaux", "matériaux organiques", "céramiques", "plastiques"], "L'acier est un alliage de fer : c'est un métal."], ["Pourquoi la poignée du tournevis testeur est-elle en plastique ?", ["Le plastique est un isolant électrique", "Le plastique conduit bien le courant", "Le plastique est attiré par un aimant", "Le plastique est plus dense que l'acier"], "La poignée isolante protège l'utilisateur du courant électrique."], ["On brûle le plastique de la poignée d'un tournevis : la flamme est verte. Ce plastique est :", ["le PVC", "le PE", "le PS", "le PET"], "Flamme verte → PVC."], ["Classer : Parmi les mots suivants, lequel est un objet et non un matériau ?", ["Porte", "La laine", "L'or", "Le marbre"], "La porte est un objet ; la laine, l'or et le marbre sont des matériaux."], ["Classer : La laine est un matériau :", ["organique", "métallique", "céramique", "alliage"], "La laine est d'origine animale : matériau organique."], ["Classer : Le polystyrène est un matériau :", ["organique", "métallique", "céramique", "minéral"], "Les plastiques sont des matériaux organiques."], ["Un plastique A flotte sur l'eau douce et sur l'eau salée et brûle avec une flamme jaune. A est :", ["le PE", "le PS", "le PVC", "le PET"], "Il flotte dans les deux eaux : c'est le PE."], ["Un plastique B coule dans l'eau douce, flotte dans l'eau salée et brûle avec une flamme jaune. B est :", ["le PS", "le PE", "le PVC", "le PET"], "Coule dans l'eau douce, flotte dans l'eau salée → PS."], ["Le plastique B coule dans l'eau douce (ρ = 1 g/cm³) et flotte dans l'eau salée (ρ = 1,2 g/cm³). Sa masse volumique peut être :", ["1,05 g/mL", "0,95 g/mL", "1,21 g/mL", "1,40 g/mL"], "Il faut 1 g/mL < ρ < 1,2 g/mL : seule 1,05 g/mL convient."], ["Yassine trouve une statuette de masse m = 840 g. Plongée dans l'eau, le niveau passe de 250 mL à 350 mL. La masse volumique de la statuette est :", ["8,4 g/cm³", "2,4 g/cm³", "3,36 g/cm³", "84 g/cm³"], "V = 350 − 250 = 100 cm³ ; ρ = m/V = 840/100 = 8,4 g/cm³."], ["La statuette a une masse volumique de 8,4 g/cm³. Données : ρ(Cu) = 8,9 g/cm³ ; ρ(Zn) = 7,2 g/cm³. On peut conclure que la statuette :", ["n'est ni en cuivre pur ni en zinc pur", "est en cuivre pur", "est en zinc pur", "est en fer pur"], "8,4 g/cm³ est différente de 8,9 et de 7,2 : c'est un alliage (laiton)."], ["La statuette (m = 840 g) contient V(Cu) = 70 cm³ de cuivre (ρ(Cu) = 8,9 g/cm³). Le pourcentage massique du cuivre est environ :", ["74 %", "85 %", "26 %", "70 %"], "m(Cu) = 8,9 × 70 = 623 g ; 623/840 × 100 ≈ 74 % : le vendeur (85 %) se trompe."], ["Un métal gris est attiré par un aimant. Ce métal est :", ["le fer", "le zinc", "l'aluminium", "le cuivre"], "Seul le fer est attiré par un aimant."], ["Un métal gris, non attiré par un aimant, a une masse de 142 g. Plongé dans une éprouvette, l'eau passe de 50 mL à 70 mL. Ce métal est : (ρ(Al) = 2,7 ; ρ(Zn) = 7,1 ; ρ(Fe) = 7,8 ; ρ(Cu) = 8,9 g/cm³)", ["le zinc", "l'aluminium", "le fer", "le cuivre"], "V = 20 cm³ ; ρ = 142/20 = 7,1 g/cm³ → zinc."], ["Un métal gris, non attiré par un aimant, a une masse de 81 g. L'eau passe de 50 mL à 80 mL. Ce métal est : (ρ(Al) = 2,7 ; ρ(Zn) = 7,1 g/cm³)", ["l'aluminium", "le zinc", "le fer", "le cuivre"], "V = 30 cm³ ; ρ = 81/30 = 2,7 g/cm³ → aluminium."], ["Un lingot de bronze en forme de pavé (10 cm × 5 cm × 2 cm) a une masse de 880 g. Sa masse volumique est :", ["8,8 g/cm³", "88 g/cm³", "0,88 g/cm³", "4,4 g/cm³"], "V = 10 × 5 × 2 = 100 cm³ ; ρ = 880/100 = 8,8 g/cm³."], ["Le lingot de bronze (m = 880 g) contient 774,4 g de cuivre. Le pourcentage massique du cuivre est :", ["88 %", "12 %", "77,4 %", "8,8 %"], "774,4/880 × 100 = 88 % ; l'étain représente 12 %."], ["La masse de 200 cm³ de cuivre (ρ(Cu) = 8,96 g/cm³) est :", ["1792 g", "179,2 g", "22,3 g", "208,96 g"], "m = ρ × V = 8,96 × 200 = 1792 g."], ["Compléter : 1 g/cm³ = ……", ["1000 kg/m³", "1 kg/m³", "100 kg/m³", "0,001 kg/m³"], "1 g/cm³ = 1000 kg/m³."], ["Une boule de masse 395 g a un volume de 50 cm³. Elle est fabriquée en : (acier 7 850 kg/m³ ; cuivre 8 900 kg/m³ ; argent 10 500 kg/m³ ; plomb 11 300 kg/m³)", ["acier", "cuivre", "argent", "plomb"], "ρ = 395/50 = 7,9 g/cm³ ≈ 7 900 kg/m³ → acier."], ["Un or « 18 carats » contient au moins …… d'or en masse.", ["75 %", "18 %", "50 %", "100 %"], "18 carats sur 24 : 18/24 = 75 %."]]},
{sem:0,name:"Les atomes et les ions",qs:[["Vrai ou faux : Un atome et son ion monoatomique ont le même noyau.", ["Vrai", "Faux"], "Un ion se forme par gain ou perte d'électrons : le noyau (Z) ne change pas."], ["Vrai ou faux : L'ion Fe³⁺ est formé quand l'atome de fer gagne 3 électrons.", ["Faux", "Vrai"], "Fe³⁺ est un cation : l'atome de fer perd 3 électrons."], ["Vrai ou faux : Dans le modèle actuel de l'atome, les électrons ont des trajectoires circulaires bien définies.", ["Faux", "Vrai"], "Les électrons forment un nuage électronique autour du noyau, sans trajectoire définie."], ["Vrai ou faux : La charge du noyau d'un atome de chlore (Z = 17) est Q(n) = +2,72 × 10⁻¹⁸ C.", ["Vrai", "Faux"], "Q(n) = Z × e = 17 × 1,6 × 10⁻¹⁹ = 2,72 × 10⁻¹⁸ C."], ["Vrai ou faux : Un anion est un atome ou un groupe d'atomes qui a perdu un ou plusieurs électrons.", ["Faux", "Vrai"], "Un anion a gagné des électrons ; c'est le cation qui en a perdu."], ["Vrai ou faux : Tous les électrons sont identiques, quel que soit l'atome.", ["Vrai", "Faux"], "Tous les électrons ont la même charge −e et la même masse."], ["Vrai ou faux : Un ion polyatomique est constitué d'un seul atome.", ["Faux", "Vrai"], "Un ion polyatomique est formé de plusieurs atomes (ex. NO₃⁻)."], ["Vrai ou faux : La charge électrique élémentaire est notée e⁻.", ["Faux", "Vrai"], "La charge élémentaire est notée e ; l'électron porte la charge −e."], ["Vrai ou faux : La charge du noyau de l'atome de calcium est Q(n) = 32 × 10⁻¹⁹ C, donc son numéro atomique est Z = 20.", ["Vrai", "Faux"], "Z = Q(n)/e = 32 × 10⁻¹⁹ / 1,6 × 10⁻¹⁹ = 20."], ["Vrai ou faux : Dans un atome, le nombre d'électrons est égal au numéro atomique Z.", ["Vrai", "Faux"], "L'atome est neutre : il a autant d'électrons que de charges positives dans le noyau."], ["Compléter : La masse de l'atome est pratiquement concentrée dans son ……", ["noyau", "nuage électronique", "électrons", "ion"], "Les électrons ont une masse négligeable : la masse est dans le noyau."], ["Compléter : Le nombre de charges positives du noyau s'appelle le ……, noté Z.", ["numéro atomique", "nombre d'électrons", "nombre de masse", "charge élémentaire"], "Z est le numéro atomique."], ["Compléter : Un ion est un atome ou un groupe d'atomes qui a …… un ou plusieurs électrons.", ["gagné ou perdu", "seulement perdu", "seulement gagné", "partagé"], "Un ion vient d'un gain (anion) ou d'une perte (cation) d'électrons."], ["Compléter : Un anion est un ion qui porte une charge électrique ……", ["négative", "positive", "nulle", "variable"], "Anion : charge négative ; cation : charge positive."], ["Compléter : L'atome est électriquement neutre car la charge de son noyau est égale à …… de la charge de ses électrons.", ["l'opposé", "le double", "la moitié", "le triple"], "Q(n) + Q(e) = 0 : les deux charges sont opposées."], ["Compléter : La charge électrique d'un électron est égale à ……", ["−1,6 × 10⁻¹⁹ C", "+1,6 × 10⁻¹⁹ C", "−1,6 × 10¹⁹ C", "0 C"], "Charge de l'électron : −e = −1,6 × 10⁻¹⁹ C."], ["L'atome de soufre (S) gagne 2 électrons pour donner l'ion sulfure de formule :", ["S²⁻", "S²⁺", "S₂⁻", "S₂⁺"], "Gain de 2 électrons → charge −2e → S²⁻."], ["Relier : L'ion Mg²⁺ porte la charge :", ["+3,2 × 10⁻¹⁹ C", "−3,2 × 10⁻¹⁹ C", "+1,6 × 10⁻¹⁹ C", "+4,8 × 10⁻¹⁹ C"], "Q(ion) = +2e = +2 × 1,6 × 10⁻¹⁹ = +3,2 × 10⁻¹⁹ C."], ["Relier : L'ion PO₄³⁻ porte la charge :", ["−4,8 × 10⁻¹⁹ C", "+4,8 × 10⁻¹⁹ C", "−3,2 × 10⁻¹⁹ C", "−1,6 × 10⁻¹⁹ C"], "Q(ion) = −3e = −4,8 × 10⁻¹⁹ C."], ["Relier : L'ion Al³⁺ porte la charge :", ["+4,8 × 10⁻¹⁹ C", "−4,8 × 10⁻¹⁹ C", "+3 × 10⁻¹⁹ C", "+1,6 × 10⁻¹⁹ C"], "Q(ion) = +3e = +4,8 × 10⁻¹⁹ C."], ["Classer : Parmi ces ions, lequel est un anion polyatomique ?", ["NO₃⁻", "Br⁻", "NH₄⁺", "Co²⁺"], "NO₃⁻ : charge négative et plusieurs atomes."], ["Classer : Parmi ces ions, lequel est un cation polyatomique ?", ["NH₄⁺", "Au³⁺", "MnO₄⁻", "Br⁻"], "NH₄⁺ : charge positive et plusieurs atomes."], ["Classer : L'ion Co²⁺ est :", ["un cation monoatomique", "un anion monoatomique", "un cation polyatomique", "un anion polyatomique"], "Un seul atome, charge positive."], ["Le numéro atomique de l'étain est Z(Sn) = 50. La charge du noyau de l'atome d'étain est :", ["Q(n) = +8 × 10⁻¹⁸ C", "Q(n) = −8 × 10⁻¹⁸ C", "Q(n) = +5 × 10⁻¹⁸ C", "Q(n) = +8 × 10⁻²⁰ C"], "Q(n) = 50 × 1,6 × 10⁻¹⁹ = 80 × 10⁻¹⁹ = 8 × 10⁻¹⁸ C."], ["La charge des électrons de l'atome d'étain (Z = 50) est :", ["Q(e) = −8 × 10⁻¹⁸ C", "Q(e) = +8 × 10⁻¹⁸ C", "Q(e) = −50 C", "Q(e) = 0 C"], "50 électrons : Q(e) = −50e = −8 × 10⁻¹⁸ C."], ["La charge totale de l'atome d'étain est Q(A) = Q(n) + Q(e) = ……", ["0 C : l'atome est neutre", "+8 × 10⁻¹⁸ C", "−8 × 10⁻¹⁸ C", "+16 × 10⁻¹⁸ C"], "Q(n) et Q(e) sont opposées : leur somme est nulle."], ["L'atome d'étain (Z = 50) perd 2 électrons. L'ion obtenu est :", ["Sn²⁺, un cation", "Sn²⁻, un anion", "Sn²⁺, un anion", "Sn₂⁺, un cation"], "Perte de 2 électrons → charge +2e → cation Sn²⁺."], ["La charge des électrons de l'ion Sn²⁺ (Z = 50) est :", ["−7,68 × 10⁻¹⁸ C", "−8 × 10⁻¹⁸ C", "−8,32 × 10⁻¹⁸ C", "+3,2 × 10⁻¹⁹ C"], "48 électrons : Q(e) = −48 × 1,6 × 10⁻¹⁹ = −7,68 × 10⁻¹⁸ C."], ["La charge de l'ion Sn²⁺ est :", ["+3,2 × 10⁻¹⁹ C", "−3,2 × 10⁻¹⁹ C", "+1,6 × 10⁻¹⁹ C", "+8 × 10⁻¹⁸ C"], "Q(ion) = Q(n) + Q(e) = 8 × 10⁻¹⁸ − 7,68 × 10⁻¹⁸ = +3,2 × 10⁻¹⁹ C."], ["L'atome de brome (Z = 35) gagne un électron. La charge des électrons de l'ion bromure Br⁻ est :", ["−5,76 × 10⁻¹⁸ C", "−5,6 × 10⁻¹⁸ C", "−5,44 × 10⁻¹⁸ C", "+5,76 × 10⁻¹⁸ C"], "36 électrons : Q(e) = −36 × 1,6 × 10⁻¹⁹ = −5,76 × 10⁻¹⁸ C."], ["L'ion méthyl-ammonium contient 1 atome C, 6 atomes H et 1 atome N ; sa charge est +e. Données : Z(C) = 6 ; Z(H) = 1 ; Z(N) = 7. Le nombre total d'électrons de cet ion est :", ["18", "19", "20", "17"], "Atomes : 6 + 6 + 7 = 19 électrons ; l'ion a perdu 1 électron → 18."], ["L'ion hydrogénosulfite HSO₃⁻ contient 1 H, 1 S et 3 O ; sa charge est −e. Données : Z(H) = 1 ; Z(S) = 16 ; Z(O) = 8. Le nombre total d'électrons est :", ["42", "41", "40", "43"], "1 + 16 + 3 × 8 = 41 ; l'ion a gagné 1 électron → 42."], ["L'ion XO₄²⁻ contient 50 électrons. Données : Z(O) = 8 ; Z(Si) = 14 ; Z(P) = 15 ; Z(S) = 16 ; Z(Cl) = 17. L'atome X est :", ["S (soufre)", "Si (silicium)", "P (phosphore)", "Cl (chlore)"], "Z(X) + 4 × 8 + 2 = 50 → Z(X) = 16 : c'est le soufre (SO₄²⁻)."], ["L'ion permanganate MnO₄⁻ contient 58 électrons. Avec Z(O) = 8, le numéro atomique du manganèse est :", ["25", "26", "24", "58"], "Z(Mn) + 4 × 8 + 1 = 58 → Z(Mn) = 25."], ["Un ion du titane a un noyau de charge Q(n) = +3,52 × 10⁻¹⁸ C et des électrons de charge Q(e) = −3,2 × 10⁻¹⁸ C. Sa formule est :", ["Ti²⁺", "Ti²⁻", "Ti³⁺", "Ti⁴⁺"], "Z = 3,52 × 10⁻¹⁸/1,6 × 10⁻¹⁹ = 22 ; électrons = 20 → perte de 2 électrons → Ti²⁺."], ["Un ion du soufre porte la charge Q(ion) = −3,2 × 10⁻¹⁹ C et son noyau Q(n) = +2,56 × 10⁻¹⁸ C. Le nombre d'électrons de cet ion est :", ["18", "16", "14", "2"], "Z = 2,56 × 10⁻¹⁸/1,6 × 10⁻¹⁹ = 16 ; charge −2e → 16 + 2 = 18 électrons."], ["L'ion Al³⁺ contient 10 électrons. Le nombre d'électrons de l'atome d'aluminium est :", ["13", "10", "7", "3"], "L'atome a perdu 3 électrons pour donner Al³⁺ : 10 + 3 = 13."], ["Les électrons d'un atome de cuivre ont une masse totale de 2,639 × 10⁻²⁹ kg. La masse d'un électron est 9,1 × 10⁻³¹ kg. Le numéro atomique du cuivre est :", ["29", "290", "2,9", "24"], "Z = 2,639 × 10⁻²⁹ / 9,1 × 10⁻³¹ = 29."], ["Le numéro atomique du phosphore est Z = 15. L'atome de phosphore gagne 3 électrons. La formule de l'ion obtenu est :", ["P³⁻", "P³⁺", "P₃⁻", "P¹⁸⁻"], "Gain de 3 électrons → anion P³⁻ (18 électrons)."]]},
{sem:0,name:"L'oxydation des métaux dans l'air",qs:[["Vrai ou faux : La rouille est une couche protectrice qui empêche le fer de continuer à s'oxyder.", ["Faux", "Vrai"], "La rouille est poreuse et perméable : l'oxydation du fer continue en profondeur."], ["Vrai ou faux : La rouille est composée principalement d'oxyde de fer III de formule Fe₂O₃.", ["Vrai", "Faux"], "La rouille est essentiellement de l'oxyde de fer III, Fe₂O₃."], ["Vrai ou faux : L'oxydation de l'aluminium produit une couche d'alumine qui le protège.", ["Vrai", "Faux"], "L'alumine Al₂O₃ forme une couche fine, étanche et protectrice."], ["Vrai ou faux : Le fer rouille plus vite dans l'air sec que dans l'air humide.", ["Faux", "Vrai"], "L'eau (humidité) est nécessaire : le fer rouille surtout dans l'air humide."], ["Vrai ou faux : Le sel accélère la formation de la rouille.", ["Vrai", "Faux"], "C'est pourquoi les objets en fer rouillent vite au bord de la mer."], ["Vrai ou faux : La rouille est un alliage de fer.", ["Faux", "Vrai"], "La rouille est un oxyde de fer (Fe₂O₃), produit d'une réaction chimique, pas un alliage."], ["Vrai ou faux : Le cuivre se couvre de vert-de-gris dans l'air humide.", ["Vrai", "Faux"], "Le vert-de-gris est une couche verte qui protège le cuivre."], ["Vrai ou faux : La galvanisation consiste à recouvrir le fer d'une couche de zinc.", ["Vrai", "Faux"], "Le zinc protège le fer de la corrosion."], ["Vrai ou faux : Lors de la formation de la rouille, le fer réagit avec le dioxygène de l'air.", ["Vrai", "Faux"], "4Fe + 3O₂ → 2Fe₂O₃ en présence d'humidité."], ["Compléter : …… du fer dans l'air humide produit la rouille de formule Fe₂O₃.", ["L'oxydation", "La combustion", "La dilution", "La fusion"], "C'est une oxydation lente du fer."], ["Compléter : L'oxydation de l'aluminium produit …… qui est une couche étanche.", ["l'alumine Al₂O₃", "la rouille Fe₂O₃", "le vert-de-gris", "l'oxyde de zinc ZnO"], "L'alumine Al₂O₃ protège l'aluminium."], ["Compléter : La rouille se forme en présence de dioxygène et d'……", ["eau", "azote", "dioxyde de carbone", "hydrogène"], "Il faut du dioxygène et de l'eau (humidité)."], ["Compléter : La couche rougeâtre qui se forme sur le fer s'appelle ……", ["la rouille", "l'alumine", "le vert-de-gris", "la calamine"], "La rouille est rougeâtre (brun-rouge)."], ["Cocher la bonne réponse : La rouille est :", ["composée d'oxyde de fer III", "une couche protectrice", "un alliage de fer", "un métal pur"], "Rouille = oxyde de fer III Fe₂O₃, poreuse et non protectrice."], ["Cocher la bonne réponse : L'équation de l'oxydation du fer est :", ["4Fe + 3O₂ → 2Fe₂O₃", "2Fe + O₂ → Fe₂O₃", "Fe + O₂ → FeO₂", "4Al + 3O₂ → 2Al₂O₃"], "Équation équilibrée : 4Fe + 3O₂ → 2Fe₂O₃."], ["Cocher la bonne réponse : L'équation de l'oxydation de l'aluminium est :", ["4Al + 3O₂ → 2Al₂O₃", "2Al + O₂ → Al₂O", "Al + O₂ → AlO₂", "4Fe + 3O₂ → 2Fe₂O₃"], "4Al + 3O₂ → 2Al₂O₃ (alumine)."], ["Dans l'équation 4Fe + 3O₂ → 2Fe₂O₃, les réactifs sont :", ["le fer et le dioxygène", "la rouille seulement", "le fer et l'eau", "l'oxyde de fer et le dioxygène"], "Réactifs : Fe et O₂ ; produit : Fe₂O₃."], ["Dans l'équation 4Fe + 3O₂ → 2Fe₂O₃, le produit est :", ["l'oxyde de fer III", "le dioxygène", "le fer", "l'eau"], "Le produit est Fe₂O₃ (la rouille)."], ["Proposer une méthode pour protéger le fer de la rouille dans les régions humides :", ["Le peindre", "Le laver avec de l'eau salée", "Le laisser à l'air libre", "Le gratter régulièrement"], "La peinture isole le fer de l'air humide."], ["Lequel de ces moyens ne protège pas le fer contre la corrosion ?", ["Le mouiller régulièrement", "Le graisser", "Le recouvrir de zinc (galvanisation)", "Le recouvrir de plastique (Rilsan)"], "L'eau favorise la rouille ; les autres isolent le fer."], ["Un gréement en fer est recouvert de Rilsan. Le rôle de cette couche est :", ["isoler le fer de l'air humide", "accélérer l'oxydation", "colorer le fer en rouge", "rendre le fer magnétique"], "Le revêtement plastique empêche l'air humide d'atteindre le fer."], ["La couche de Rilsan s'écaille et le fer commence à se corroder. La réaction qui se produit s'appelle :", ["l'oxydation du fer (corrosion)", "la combustion du fer", "la fusion du fer", "la dissolution du fer"], "C'est la corrosion : oxydation lente du fer."], ["Pourquoi les objets en aluminium ne se détruisent-ils pas à l'air ?", ["L'alumine forme une couche protectrice étanche", "L'aluminium ne réagit pas avec le dioxygène", "L'aluminium est attiré par un aimant", "L'aluminium est un alliage"], "L'aluminium s'oxyde en surface, mais l'alumine protège le métal."], ["Le métal qui se couvre de vert-de-gris est :", ["le cuivre", "le fer", "l'aluminium", "l'or"], "Le vert-de-gris se forme sur le cuivre dans l'air humide."], ["L'acier inoxydable ne rouille pas car :", ["c'est un alliage de fer avec du chrome et du nickel", "c'est du fer pur", "il contient du sel", "il est recouvert de rouille"], "Le chrome et le nickel protègent l'alliage de la corrosion."], ["Dans quelle situation un clou en fer rouille-t-il le plus vite ?", ["Dans l'eau salée aérée", "Dans l'air sec", "Dans l'huile", "Dans un tube vide d'air"], "Eau + dioxygène + sel : conditions les plus favorables."], ["Dans l'équation 4Fe + 3O₂ → 2Fe₂O₃, combien d'atomes d'oxygène y a-t-il de chaque côté ?", ["6", "3", "2", "4"], "À gauche : 3 × 2 = 6 ; à droite : 2 × 3 = 6."], ["On oxyde 4 atomes de fer. Le nombre de molécules de dioxygène nécessaires est :", ["3", "4", "2", "6"], "D'après 4Fe + 3O₂ → 2Fe₂O₃ : 4 Fe réagissent avec 3 O₂."], ["Compléter l'équation : 4Al + …O₂ → 2Al₂O₃", ["3", "2", "4", "6"], "6 atomes O à droite → 3 molécules O₂ à gauche."], ["La formule de l'alumine est :", ["Al₂O₃", "AlO", "Al₃O₂", "Fe₂O₃"], "Alumine = oxyde d'aluminium Al₂O₃."], ["La formule de l'oxyde de zinc est :", ["ZnO", "Zn₂O₃", "ZnO₂", "Zn₂O"], "Le zinc s'oxyde en ZnO, qui le protège."], ["La corrosion du fer est un problème car :", ["la rouille détruit progressivement le métal", "la rouille rend le fer plus solide", "la rouille protège le fer", "la rouille est un bon isolant"], "La rouille, poreuse, laisse la corrosion avancer jusqu'à détruire l'objet."], ["La rouille est une transformation :", ["chimique", "physique", "nucléaire", "réversible"], "De nouvelles substances (oxyde de fer) apparaissent : transformation chimique."]]},
{sem:0,name:"La combustion des matériaux organiques",qs:[["Vrai ou faux : La combustion complète d'un matériau organique produit du dioxyde de carbone et de l'eau.", ["Vrai", "Faux"], "Matériau organique + dioxygène → dioxyde de carbone + eau."], ["Vrai ou faux : Le dioxyde de carbone produit une détonation au contact d'une flamme.", ["Faux", "Vrai"], "C'est le dihydrogène qui produit une détonation ; le CO₂ trouble l'eau de chaux."], ["Vrai ou faux : Les matériaux organiques contiennent toujours les éléments carbone et hydrogène.", ["Vrai", "Faux"], "C'est pourquoi leur combustion produit CO₂ et H₂O."], ["Vrai ou faux : La combustion incomplète produit de la fumée noire (carbone) et du monoxyde de carbone.", ["Vrai", "Faux"], "Le manque de dioxygène donne C (fumée noire) et CO (gaz toxique)."], ["Vrai ou faux : Le monoxyde de carbone CO est un gaz sans danger.", ["Faux", "Vrai"], "CO est un gaz incolore, inodore et mortel."], ["Vrai ou faux : La combustion du PVC produit du chlorure d'hydrogène, un gaz toxique et acide.", ["Vrai", "Faux"], "Le PVC contient du chlore : sa combustion libère HCl."], ["Vrai ou faux : L'eau de chaux se trouble en présence de dioxyde de carbone.", ["Vrai", "Faux"], "C'est le test d'identification du CO₂."], ["Vrai ou faux : Le sulfate de cuivre anhydre devient bleu en présence d'eau.", ["Vrai", "Faux"], "C'est le test d'identification de l'eau."], ["Vrai ou faux : Le verre est un matériau organique combustible.", ["Faux", "Vrai"], "Le verre est une céramique : il ne brûle pas."], ["Compléter : La combustion des matériaux organiques produit du dioxyde de carbone et ……", ["de l'eau", "du dihydrogène", "du dioxygène", "de l'azote"], "Produits de la combustion complète : CO₂ + H₂O."], ["Compléter : Le gaz indispensable à toute combustion (le comburant) est le ……", ["dioxygène", "dioxyde de carbone", "diazote", "dihydrogène"], "Le comburant est le dioxygène O₂."], ["Compléter : On met en évidence le dioxyde de carbone avec ……", ["l'eau de chaux qui se trouble", "le sulfate de cuivre anhydre", "une flamme qui détone", "le papier pH"], "Le CO₂ trouble l'eau de chaux."], ["Compléter : On met en évidence l'eau avec ……", ["le sulfate de cuivre anhydre qui devient bleu", "l'eau de chaux", "une allumette", "la soude"], "Le sulfate de cuivre anhydre blanc devient bleu au contact de l'eau."], ["Le bilan de la combustion complète d'un matériau organique s'écrit :", ["matériau organique + dioxygène → dioxyde de carbone + eau", "matériau organique + eau → dioxygène", "dioxyde de carbone + eau → matériau organique", "matériau organique → carbone + dihydrogène"], "Réactifs : matériau + O₂ ; produits : CO₂ + H₂O."], ["On brûle une corde en Rilsan (C₁₁H₂₁NO)n : il se forme de la vapeur d'eau et du CO₂. Le Rilsan est :", ["un matériau organique", "un métal", "une céramique", "un verre"], "Il contient C et H et sa combustion donne CO₂ et H₂O."], ["La combustion du Rilsan produit aussi HCN, un gaz très toxique, car le Rilsan contient l'élément :", ["azote (N)", "chlore (Cl)", "fer (Fe)", "soufre (S)"], "La formule du Rilsan contient N : il se forme du cyanure d'hydrogène."], ["Lors d'une combustion, l'apparition d'une fumée noire indique :", ["une combustion incomplète", "une combustion complète", "la présence de PVC", "la formation de dihydrogène"], "La fumée noire est du carbone : il manque du dioxygène."], ["Cocher le danger de la combustion des matériaux organiques :", ["dégagement de gaz toxiques (CO, HCl, HCN)", "production de dioxygène", "refroidissement de l'air", "formation de rouille"], "Les fumées peuvent être toxiques, voire mortelles."], ["Le danger principal d'un chauffe-eau à gaz dans une salle de bain mal aérée est :", ["l'intoxication au monoxyde de carbone", "la formation de rouille", "le manque de dihydrogène", "l'excès de dioxygène"], "Sans aération, la combustion est incomplète et produit du CO."], ["La combustion complète du méthane s'écrit : CH₄ + 2O₂ → CO₂ + 2H₂O. Le nombre d'atomes d'hydrogène à droite est :", ["4", "2", "1", "8"], "2H₂O contient 2 × 2 = 4 atomes H, comme CH₄."], ["Compléter l'équation : CH₄ + …O₂ → CO₂ + 2H₂O", ["2", "1", "3", "4"], "À droite : 2 + 2 = 4 atomes O → 2 molécules O₂."], ["Compléter l'équation de combustion du carbone : C + O₂ → ……", ["CO₂", "CO", "H₂O", "C₂O"], "La combustion complète du carbone donne du dioxyde de carbone."], ["On brûle un plastique et on présente un papier pH humide aux fumées : il devient rouge. Ce plastique est :", ["le PVC", "le PE", "le PS", "le PET"], "Le PVC libère HCl, un gaz acide."], ["Pour éteindre un feu de matériaux organiques, on peut :", ["supprimer le contact avec le dioxygène (couverture, sable)", "ajouter du dioxygène", "ajouter du bois sec", "chauffer davantage"], "Sans comburant, la combustion s'arrête."], ["Les trois éléments du triangle du feu sont :", ["combustible, comburant, chaleur", "eau, sable, sel", "fer, dioxygène, eau", "carbone, eau, azote"], "Une combustion nécessite un combustible, un comburant et une source de chaleur."], ["Lequel de ces matériaux est un combustible ?", ["le bois", "le verre", "la porcelaine", "le sable"], "Le bois est un matériau organique : il brûle."], ["Quel gaz, produit par la combustion, contribue à l'effet de serre ?", ["le dioxyde de carbone", "le dioxygène", "le diazote", "le dihydrogène"], "Le CO₂ est le principal gaz à effet de serre lié aux combustions."], ["Le gaz formé lors de la combustion incomplète, qui se fixe sur le sang à la place du dioxygène, est :", ["le monoxyde de carbone CO", "le dioxyde de carbone CO₂", "la vapeur d'eau", "le diazote N₂"], "CO empêche le transport du dioxygène dans le sang."], ["Lors de la combustion du butane, la flamme bleue indique :", ["une combustion complète", "une combustion incomplète", "la présence de PVC", "un manque de dioxygène"], "Flamme bleue = combustion complète ; flamme jaune et fumée noire = incomplète."], ["On recouvre une bougie allumée d'un verre retourné. Elle s'éteint car :", ["le dioxygène est consommé", "le dioxyde de carbone manque", "la cire fond", "l'eau s'évapore"], "Sans dioxygène, la combustion s'arrête."], ["Les matériaux organiques sont d'origine :", ["animale, végétale ou synthétique (pétrole)", "uniquement minérale", "uniquement métallique", "uniquement céramique"], "Laine (animale), bois (végétale), plastiques (pétrole)."], ["Quel test permet de montrer qu'un matériau contient du carbone ?", ["Sa combustion produit un gaz qui trouble l'eau de chaux", "Il est attiré par un aimant", "Il flotte sur l'eau", "Il conduit le courant"], "Le CO₂ formé prouve la présence de carbone."]]},
{sem:0,name:"Les solutions acides et basiques (pH)",qs:[["Vrai ou faux : Lorsqu'on dilue une solution acide, le pH diminue mais reste inférieur à 7.", ["Faux", "Vrai"], "En diluant un acide, le pH augmente et se rapproche de 7."], ["Vrai ou faux : La solution de chlorure de potassium (K⁺ + Cl⁻) est une solution acide.", ["Faux", "Vrai"], "Elle est neutre (pH = 7) : elle ne contient pas plus d'ions H⁺ que d'ions HO⁻."], ["Vrai ou faux : Une solution acide contient plus d'ions H⁺ que d'ions HO⁻.", ["Vrai", "Faux"], "L'ion H⁺ est responsable du caractère acide."], ["Vrai ou faux : Une solution de pH = 9 est basique.", ["Vrai", "Faux"], "pH > 7 : solution basique."], ["Vrai ou faux : Le pH-mètre donne une valeur plus précise que le papier pH.", ["Vrai", "Faux"], "Le pH-mètre donne des valeurs décimales (ex. 2,5) ; le papier pH donne une valeur approchée."], ["Vrai ou faux : Plus le pH est petit, plus la solution est acide.", ["Vrai", "Faux"], "L'acidité augmente quand le pH diminue."], ["Vrai ou faux : L'eau pure a un pH égal à 7.", ["Vrai", "Faux"], "L'eau pure est neutre."], ["Vrai ou faux : Pour diluer un acide, on verse l'eau dans l'acide.", ["Faux", "Vrai"], "On verse toujours l'acide dans l'eau, lentement, pour éviter les projections."], ["Vrai ou faux : En diluant une solution basique, son pH diminue vers 7.", ["Vrai", "Faux"], "La dilution rapproche toujours le pH de 7."], ["Compléter : L'ion responsable du caractère acide est l'ion hydrogène ……", ["H⁺", "HO⁻", "Cl⁻", "Na⁺"], "Caractère acide : ion H⁺ ; caractère basique : ion HO⁻."], ["Compléter : L'ion responsable du caractère basique est l'ion hydroxyde ……", ["HO⁻", "H⁺", "O²⁻", "H₂O"], "Les solutions basiques contiennent plus d'ions HO⁻ que d'ions H⁺."], ["Compléter : Une solution neutre a un pH ……", ["égal à 7", "inférieur à 7", "supérieur à 7", "égal à 0"], "pH = 7 : solution neutre."], ["Compléter : Une solution acide a un pH ……", ["inférieur à 7", "égal à 7", "supérieur à 7", "égal à 14"], "pH < 7 : solution acide."], ["Cocher la bonne réponse : La solution la plus basique est :", ["la solution d'ammoniaque (pH = 12)", "l'eau de javel (pH = 10)", "l'eau de chaux (pH = 11)", "l'eau pure (pH = 7)"], "Le pH le plus grand correspond à la solution la plus basique."], ["Lors de la dilution d'une solution de pH = 2,5, le pH de la solution obtenue peut être :", ["4,5", "2,5", "7,0", "8,5"], "Le pH augmente mais reste inférieur à 7 : 4,5."], ["On mesure le pH de solutions d'acide chlorhydrique : A (2,5), B (5,5), C (3,5), D (1,5), E (4,5). La solution la plus acide est :", ["D", "A", "B", "E"], "La plus acide a le plus petit pH : D (1,5)."], ["Parmi A (2,5), B (5,5), C (3,5), D (1,5), E (4,5), la solution la moins acide est :", ["B", "D", "A", "C"], "Le plus grand pH (5,5) correspond à la moins acide."], ["Classement par acidité croissante de A (2,5), B (5,5), C (3,5), D (1,5), E (4,5) :", ["B < E < C < A < D", "D < A < C < E < B", "A < B < C < D < E", "B < C < E < A < D"], "L'acidité augmente quand le pH diminue : B, E, C, A puis D."], ["Les solutions A, B, C, D, E sont obtenues par dilution d'une solution commerciale. La solution commerciale (avant dilution) est :", ["D (pH = 1,5)", "B (pH = 5,5)", "A (pH = 2,5)", "E (pH = 4,5)"], "La dilution augmente le pH : la solution commerciale a le plus petit pH."], ["Les valeurs de pH 2,5 ; 5,5 ; 3,5 ont été mesurées avec :", ["un pH-mètre", "un papier pH", "un thermomètre", "un ampèremètre"], "Des valeurs décimales précises → pH-mètre."], ["Le jus de citron a un pH = 2,5. Il est :", ["acide", "neutre", "basique", "salé"], "pH < 7 : acide."], ["L'eau de javel a un pH = 11,5. Elle est :", ["basique", "acide", "neutre", "corrosive pour les métaux seulement"], "pH > 7 : basique."], ["La formule de la solution d'acide chlorhydrique est :", ["(H⁺ + Cl⁻)", "(Na⁺ + HO⁻)", "(Na⁺ + Cl⁻)", "(H⁺ + HO⁻)"], "Acide chlorhydrique : ions H⁺ et Cl⁻."], ["La formule de la solution d'hydroxyde de sodium (soude) est :", ["(Na⁺ + HO⁻)", "(H⁺ + Cl⁻)", "(Na⁺ + Cl⁻)", "(K⁺ + HO⁻)"], "Soude : ions Na⁺ et HO⁻."], ["Une solution contient autant d'ions H⁺ que d'ions HO⁻. Elle est :", ["neutre", "acide", "basique", "concentrée"], "Égalité des ions H⁺ et HO⁻ : solution neutre, pH = 7."], ["On ajoute beaucoup d'eau à une solution de soude de pH = 12. Le pH devient :", ["plus proche de 7, par exemple 10", "plus grand que 12", "égal à 2", "inférieur à 7"], "La dilution d'une base fait diminuer le pH vers 7, sans passer en dessous."], ["Pour mesurer le pH avec le papier pH, on :", ["dépose une goutte de solution sur le papier et on compare la couleur à l'échelle", "plonge le papier dans la soude pure", "chauffe le papier", "pèse le papier"], "La couleur du papier est comparée à l'échelle de teintes."], ["Le pictogramme présent sur l'acide chlorhydrique concentré signifie :", ["corrosif", "comburant", "explosif", "inflammable"], "Les acides et bases concentrés sont corrosifs."], ["Lors de la manipulation des acides et des bases, il faut porter :", ["des lunettes et des gants", "un casque audio", "des chaussures de sport", "rien de particulier"], "Ces solutions peuvent brûler la peau et les yeux."], ["Parmi ces solutions, laquelle est neutre ?", ["L'eau salée (Na⁺ + Cl⁻)", "Le vinaigre", "La soude", "L'acide chlorhydrique"], "L'eau salée a un pH = 7."], ["Le vinaigre a un pH = 3, le jus de citron un pH = 2. La solution la plus acide est :", ["le jus de citron", "le vinaigre", "les deux sont également acides", "aucune"], "Le plus petit pH (2) correspond à la plus acide."], ["Le pH est un nombre compris entre :", ["0 et 14", "0 et 7", "7 et 14", "−7 et 7"], "L'échelle de pH va de 0 à 14."]]},
{sem:0,name:"Action des solutions acides et basiques sur les métaux",qs:[["Vrai ou faux : La réaction de la soude avec le fer produit du dihydrogène.", ["Faux", "Vrai"], "Le fer ne réagit pas avec la soude ; seuls l'aluminium et le zinc réagissent."], ["Vrai ou faux : Le fer réagit avec une solution de soude concentrée.", ["Faux", "Vrai"], "Le fer ne réagit pas avec la soude."], ["Vrai ou faux : Le cuivre ne réagit ni avec la soude ni avec l'acide chlorhydrique.", ["Vrai", "Faux"], "Le cuivre résiste aux deux solutions."], ["Vrai ou faux : L'acide chlorhydrique réagit avec le zinc en produisant du dihydrogène.", ["Vrai", "Faux"], "Zn + 2H⁺ → Zn²⁺ + H₂."], ["Vrai ou faux : Le dihydrogène produit une détonation au contact d'une flamme.", ["Vrai", "Faux"], "C'est le test du dihydrogène."], ["Vrai ou faux : Au cours de la réaction de l'acide chlorhydrique avec le fer, le pH de la solution augmente.", ["Vrai", "Faux"], "Les ions H⁺ sont consommés : la solution devient moins acide."], ["Vrai ou faux : L'aluminium réagit avec l'acide chlorhydrique et avec la soude.", ["Vrai", "Faux"], "L'aluminium (et le zinc) réagissent avec les deux."], ["Vrai ou faux : Les ions chlorure Cl⁻ participent à la réaction de l'acide chlorhydrique avec le fer.", ["Faux", "Vrai"], "Les ions Cl⁻ sont spectateurs : ils ne réagissent pas."], ["Compléter : Le …… ne réagit ni avec la soude ni avec l'acide chlorhydrique.", ["cuivre", "zinc", "fer", "aluminium"], "Le cuivre ne réagit avec aucune des deux."], ["Compléter : L'acide chlorhydrique réagit avec l'aluminium pour produire du …… et une solution de chlorure d'aluminium.", ["dihydrogène", "dioxygène", "dioxyde de carbone", "chlore"], "Le gaz dégagé est le dihydrogène H₂."], ["Cocher la bonne réponse : Le métal qui réagit avec les solutions acides et les solutions basiques est :", ["l'aluminium", "le fer", "le cuivre", "l'or"], "L'aluminium (et aussi le zinc) réagit avec les acides et les bases."], ["On introduit 5 g de poudre d'aluminium dans de l'acide chlorhydrique : des bulles se forment et l'aluminium disparaît. S'agit-il d'une réaction chimique ?", ["Oui, de nouvelles substances apparaissent", "Non, c'est une dissolution", "Non, c'est une fusion", "Non, c'est une évaporation"], "Formation d'un gaz et disparition du métal : réaction chimique."], ["Le gaz produit par la réaction de l'aluminium avec l'acide chlorhydrique est :", ["le dihydrogène H₂", "le dioxygène O₂", "le dioxyde de carbone CO₂", "le chlore Cl₂"], "Les métaux qui réagissent avec les acides dégagent H₂."], ["Comment détecte-t-on le dihydrogène ?", ["Il produit une détonation au contact d'une flamme", "Il trouble l'eau de chaux", "Il rallume une bûchette incandescente", "Il colore le papier pH en bleu"], "Le dihydrogène « aboie » au contact d'une flamme."], ["L'équation simplifiée de la réaction du zinc avec l'acide chlorhydrique est :", ["Zn + 2H⁺ → Zn²⁺ + H₂", "Zn + H⁺ → Zn⁺ + H", "Zn + 2Cl⁻ → ZnCl₂", "Zn + O₂ → ZnO"], "Les ions Cl⁻ sont spectateurs."], ["L'équation simplifiée de la réaction du fer avec l'acide chlorhydrique est :", ["Fe + 2H⁺ → Fe²⁺ + H₂", "Fe + 3H⁺ → Fe³⁺ + H₂", "2Fe + 3O₂ → Fe₂O₃", "Fe + 2HO⁻ → Fe(OH)₂"], "Le fer donne des ions Fe²⁺ et du dihydrogène."], ["L'équation simplifiée de la réaction de l'aluminium avec l'acide chlorhydrique est :", ["2Al + 6H⁺ → 2Al³⁺ + 3H₂", "Al + H⁺ → Al⁺ + H₂", "2Al + 3H⁺ → 2Al³⁺ + H₂", "4Al + 3O₂ → 2Al₂O₃"], "Équation équilibrée : 2Al + 6H⁺ → 2Al³⁺ + 3H₂."], ["La solution obtenue après la réaction du fer avec l'acide chlorhydrique est :", ["le chlorure de fer II (Fe²⁺ + 2Cl⁻)", "le chlorure de fer III (Fe³⁺ + 3Cl⁻)", "l'oxyde de fer Fe₂O₃", "la soude (Na⁺ + HO⁻)"], "Il se forme des ions Fe²⁺ ; avec les ions Cl⁻ : chlorure de fer II."], ["Relier : Le chlorure de zinc a pour formule :", ["(Zn²⁺ + 2Cl⁻)", "(Zn⁺ + Cl⁻)", "(Zn²⁺ + Cl⁻)", "(2Zn²⁺ + Cl⁻)"], "Une charge +2 est compensée par deux ions Cl⁻."], ["Relier : Le chlorure d'aluminium a pour formule :", ["(Al³⁺ + 3Cl⁻)", "(Al³⁺ + Cl⁻)", "(3Al³⁺ + Cl⁻)", "(Al²⁺ + 2Cl⁻)"], "Une charge +3 est compensée par trois ions Cl⁻."], ["Relier : Le chlorure de fer II a pour formule :", ["(Fe²⁺ + 2Cl⁻)", "(Fe³⁺ + 3Cl⁻)", "(Fe²⁺ + Cl⁻)", "(2Fe²⁺ + 3Cl⁻)"], "Fer II : ion Fe²⁺, avec deux ions Cl⁻."], ["On introduit un morceau de fer dans la soude. On observe :", ["aucune réaction", "un dégagement de dihydrogène", "la disparition du fer", "une flamme verte"], "Le fer ne réagit pas avec la soude."], ["On introduit du zinc dans la soude concentrée. On observe :", ["un dégagement gazeux de dihydrogène", "aucune réaction", "un précipité bleu", "un dépôt de rouille"], "Le zinc réagit avec la soude en dégageant du dihydrogène."], ["Pourquoi ne doit-on pas conserver une solution acide dans une boîte en aluminium ?", ["L'acide réagit avec l'aluminium", "L'aluminium est trop lourd", "L'acide devient basique", "L'aluminium est attiré par l'acide"], "L'acide attaque l'aluminium et produit du dihydrogène."], ["Pour nettoyer une casserole en aluminium, il faut éviter :", ["les produits très basiques comme la soude", "l'eau du robinet", "le liquide vaisselle doux", "l'éponge"], "La soude attaque l'aluminium."], ["Au cours de la réaction du zinc avec l'acide chlorhydrique, la masse de zinc :", ["diminue", "augmente", "reste constante", "double"], "Le zinc est un réactif : il est consommé."], ["Au cours de la réaction du fer avec l'acide chlorhydrique, le pH de la solution :", ["augmente", "diminue", "reste égal à 7", "devient 14"], "Les ions H⁺ sont consommés : la solution devient moins acide."], ["Dans la réaction Zn + 2H⁺ → Zn²⁺ + H₂, les ions spectateurs sont :", ["les ions Cl⁻", "les ions H⁺", "les ions Zn²⁺", "les molécules H₂"], "Les ions chlorure ne participent pas à la réaction."], ["Parmi ces métaux, lequel réagit avec l'acide chlorhydrique mais pas avec la soude ?", ["le fer", "le zinc", "l'aluminium", "le cuivre"], "Le fer réagit avec l'acide, pas avec la soude."], ["Un métal gris, non attiré par un aimant, réagit avec la soude. Il peut être :", ["l'aluminium ou le zinc", "le fer", "le cuivre", "l'or"], "Seuls l'aluminium et le zinc réagissent avec la soude."], ["On ajoute de la soude à la solution obtenue après la réaction du zinc avec l'acide. Il se forme un précipité blanc. Cet ion est :", ["Zn²⁺", "Cu²⁺", "Fe³⁺", "H⁺"], "Les ions Zn²⁺ donnent un précipité blanc Zn(OH)₂ avec la soude."]]},
{sem:0,name:"Tests de reconnaissance de quelques ions",qs:[["Vrai ou faux : L'ion HO⁻ (soude) permet d'identifier l'ion Fe²⁺.", ["Vrai", "Faux"], "La soude donne avec Fe²⁺ un précipité vert d'hydroxyde de fer II."], ["Vrai ou faux : Les ions Cu²⁺ donnent avec la soude un précipité bleu.", ["Vrai", "Faux"], "Précipité bleu d'hydroxyde de cuivre Cu(OH)₂."], ["Vrai ou faux : Les ions Fe³⁺ donnent avec la soude un précipité vert.", ["Faux", "Vrai"], "Fe³⁺ donne un précipité rouille (rouge-brun) ; c'est Fe²⁺ qui donne un précipité vert."], ["Vrai ou faux : Le nitrate d'argent permet d'identifier les ions chlorure Cl⁻.", ["Vrai", "Faux"], "Il se forme un précipité blanc de chlorure d'argent qui noircit à la lumière."], ["Vrai ou faux : Le précipité de chlorure d'argent AgCl noircit à la lumière.", ["Vrai", "Faux"], "C'est une caractéristique du test des ions Cl⁻."], ["Vrai ou faux : Les ions Zn²⁺ et Al³⁺ donnent avec la soude un précipité blanc.", ["Vrai", "Faux"], "Zn(OH)₂ et Al(OH)₃ sont tous deux blancs."], ["Vrai ou faux : Une solution de sulfate de cuivre est bleue à cause des ions sulfate SO₄²⁻.", ["Faux", "Vrai"], "La couleur bleue est due aux ions cuivre Cu²⁺."], ["Vrai ou faux : Le papier pH permet de mettre en évidence les ions H⁺.", ["Vrai", "Faux"], "Une teinte de pH < 7 indique la présence d'ions H⁺ en excès."], ["Cocher la bonne réponse : L'ion HO⁻ permet d'identifier :", ["Fe²⁺", "H⁺", "Cl⁻", "SO₄²⁻"], "La soude (ions HO⁻) identifie les ions métalliques comme Fe²⁺."], ["Compléter : Les ions Cu²⁺ donnent avec la soude un précipité de couleur ……", ["bleue", "verte", "rouille", "blanche"], "Cu(OH)₂ est bleu."], ["Compléter : Les ions Fe²⁺ donnent avec la soude un précipité de couleur ……", ["verte", "bleue", "rouille", "blanche"], "Fe(OH)₂ est vert."], ["Compléter : Les ions Fe³⁺ donnent avec la soude un précipité de couleur ……", ["rouille (rouge-brun)", "verte", "bleue", "blanche"], "Fe(OH)₃ est rouille."], ["Compléter : Les ions Cl⁻ donnent avec le nitrate d'argent un précipité …… qui noircit à la lumière.", ["blanc", "bleu", "vert", "rouille"], "Le chlorure d'argent AgCl est blanc."], ["On ajoute quelques gouttes de soude à une solution : il se forme un précipité bleu. L'ion présent est :", ["Cu²⁺", "Fe²⁺", "Fe³⁺", "Zn²⁺"], "Précipité bleu → ion cuivre Cu²⁺."], ["Le nom et la formule du précipité bleu sont :", ["hydroxyde de cuivre Cu(OH)₂", "hydroxyde de fer II Fe(OH)₂", "chlorure d'argent AgCl", "sulfate de cuivre CuSO₄"], "Cu²⁺ + 2HO⁻ → Cu(OH)₂."], ["L'équation de précipitation des ions Cu²⁺ par la soude est :", ["Cu²⁺ + 2HO⁻ → Cu(OH)₂", "Cu²⁺ + HO⁻ → CuOH", "Cu + 2HO⁻ → Cu(OH)₂", "Cu²⁺ + 2Cl⁻ → CuCl₂"], "Deux ions HO⁻ pour un ion Cu²⁺."], ["L'équation de précipitation des ions Fe³⁺ par la soude est :", ["Fe³⁺ + 3HO⁻ → Fe(OH)₃", "Fe³⁺ + 2HO⁻ → Fe(OH)₂", "Fe²⁺ + 3HO⁻ → Fe(OH)₃", "2Fe + 3O₂ → Fe₂O₃"], "Trois ions HO⁻ pour un ion Fe³⁺."], ["L'équation de précipitation des ions Fe²⁺ par la soude est :", ["Fe²⁺ + 2HO⁻ → Fe(OH)₂", "Fe³⁺ + 3HO⁻ → Fe(OH)₃", "Fe²⁺ + HO⁻ → FeOH", "Fe + 2H⁺ → Fe²⁺ + H₂"], "Deux ions HO⁻ pour un ion Fe²⁺."], ["Un produit agricole contient des ions sulfate SO₄²⁻. Sa solution a pH = 7 et donne un précipité bleu avec la soude. Cette solution est :", ["le sulfate de cuivre (Cu²⁺ + SO₄²⁻)", "le sulfate de fer II (Fe²⁺ + SO₄²⁻)", "l'acide sulfurique (2H⁺ + SO₄²⁻)", "le chlorure de cuivre (Cu²⁺ + 2Cl⁻)"], "Précipité bleu → Cu²⁺ ; avec SO₄²⁻ : sulfate de cuivre."], ["La solution de sulfate de cuivre a pH = 7. Elle est :", ["neutre", "acide", "basique", "concentrée en H⁺"], "pH = 7 : solution neutre."], ["On ajoute du nitrate d'argent à l'eau du robinet : un léger précipité blanc apparaît. L'eau contient des ions :", ["chlorure Cl⁻", "cuivre Cu²⁺", "fer III Fe³⁺", "hydroxyde HO⁻"], "Précipité blanc avec le nitrate d'argent → ions Cl⁻."], ["Relier : Le sulfate d'aluminium a pour formule :", ["(2Al³⁺ + 3SO₄²⁻)", "(Al³⁺ + SO₄²⁻)", "(3Al³⁺ + 2SO₄²⁻)", "(Al²⁺ + SO₄²⁻)"], "2 × (+3) = +6 compense 3 × (−2) = −6."], ["Relier : Le chlorure de fer III a pour formule :", ["(Fe³⁺ + 3Cl⁻)", "(Fe²⁺ + 2Cl⁻)", "(Fe³⁺ + Cl⁻)", "(3Fe³⁺ + Cl⁻)"], "Une charge +3 compensée par trois ions Cl⁻."], ["Relier : La soude (hydroxyde de sodium) a pour formule :", ["(Na⁺ + HO⁻)", "(Na⁺ + Cl⁻)", "(H⁺ + Cl⁻)", "(Na²⁺ + 2HO⁻)"], "Soude : ions sodium Na⁺ et hydroxyde HO⁻."], ["Une solution donne un précipité vert avec la soude et un précipité blanc avec le nitrate d'argent. C'est :", ["le chlorure de fer II (Fe²⁺ + 2Cl⁻)", "le chlorure de fer III (Fe³⁺ + 3Cl⁻)", "le sulfate de cuivre (Cu²⁺ + SO₄²⁻)", "le chlorure de zinc (Zn²⁺ + 2Cl⁻)"], "Vert → Fe²⁺ ; blanc avec nitrate d'argent → Cl⁻."], ["Une solution donne un précipité rouille avec la soude. Elle contient des ions :", ["Fe³⁺", "Fe²⁺", "Cu²⁺", "Al³⁺"], "Précipité rouille → Fe³⁺."], ["Après la réaction du zinc avec l'acide chlorhydrique, on ajoute de la soude : il se forme un précipité. Quel ion est mis en évidence ?", ["Zn²⁺", "Cu²⁺", "Fe²⁺", "Cl⁻"], "La solution contient des ions Zn²⁺, qui donnent un précipité blanc."], ["La couleur et le nom de ce précipité (zinc + soude) sont :", ["blanc, hydroxyde de zinc Zn(OH)₂", "bleu, hydroxyde de cuivre", "vert, hydroxyde de fer II", "rouille, hydroxyde de fer III"], "Zn²⁺ + 2HO⁻ → Zn(OH)₂, précipité blanc."], ["Le réactif utilisé pour identifier les ions métalliques (Cu²⁺, Fe²⁺, Fe³⁺, Zn²⁺, Al³⁺) est :", ["la soude", "le nitrate d'argent", "l'eau de chaux", "le sulfate de cuivre anhydre"], "La soude donne des précipités de couleurs différentes."], ["Le réactif utilisé pour identifier les ions chlorure est :", ["le nitrate d'argent", "la soude", "l'eau de chaux", "le papier pH"], "Les ions Ag⁺ forment avec Cl⁻ un précipité blanc."], ["La solution de chlorure de cuivre (Cu²⁺ + 2Cl⁻) donne :", ["un précipité bleu avec la soude et un précipité blanc avec le nitrate d'argent", "un précipité vert avec la soude", "aucun précipité", "un précipité rouille avec le nitrate d'argent"], "Cu²⁺ → bleu (soude) ; Cl⁻ → blanc (nitrate d'argent)."], ["Dans la solution de sulfate de fer III (2Fe³⁺ + 3SO₄²⁻), il y a :", ["2 ions Fe³⁺ pour 3 ions SO₄²⁻", "3 ions Fe³⁺ pour 2 ions SO₄²⁻", "autant d'ions Fe³⁺ que d'ions SO₄²⁻", "seulement des ions Fe³⁺"], "Électroneutralité : 2 × (+3) + 3 × (−2) = 0."]]},
{sem:0,name:"Dangers de quelques matériaux usuels",qs:[["Vrai ou faux : Le pictogramme « tête de mort sur deux tibias » signifie que le produit est toxique.", ["Vrai", "Faux"], "Ce pictogramme indique un produit toxique, mortel à faible dose."], ["Vrai ou faux : Le pictogramme représentant une main et une surface rongées par un liquide signifie « inflammable ».", ["Faux", "Vrai"], "Il signifie « corrosif » ; « inflammable » est représenté par une flamme."], ["Vrai ou faux : Brûler les déchets plastiques à l'air libre est sans danger.", ["Faux", "Vrai"], "Leur combustion libère des gaz toxiques (CO, HCl…) et des fumées polluantes."], ["Vrai ou faux : Le tri sélectif permet de recycler une partie des matériaux.", ["Vrai", "Faux"], "Le verre, les métaux, le papier et certains plastiques sont recyclables."], ["Vrai ou faux : Les plastiques se dégradent très lentement dans la nature.", ["Vrai", "Faux"], "Ils peuvent mettre des centaines d'années à se dégrader."], ["Vrai ou faux : Le verre peut être recyclé plusieurs fois.", ["Vrai", "Faux"], "Le verre se refond et se recycle sans perte de qualité."], ["Vrai ou faux : Le monoxyde de carbone est un gaz que l'on peut sentir facilement.", ["Faux", "Vrai"], "Le CO est inodore et incolore : c'est ce qui le rend dangereux."], ["Cocher la bonne réponse : Le pictogramme représentant une flamme au-dessus d'un cercle signifie :", ["comburant", "inflammable", "explosif", "toxique"], "Flamme sur un cercle : produit comburant, qui active les combustions."], ["Cocher la bonne réponse : Le pictogramme représentant une flamme seule signifie :", ["inflammable", "comburant", "corrosif", "nocif"], "Une flamme : produit inflammable."], ["Cocher la bonne réponse : Le pictogramme représentant une main rongée par un liquide signifie :", ["corrosif", "toxique", "comburant", "nocif"], "Ce pictogramme signale un produit corrosif."], ["Cocher la bonne réponse : Le pictogramme « point d'exclamation » signifie :", ["nocif ou irritant", "explosif", "corrosif", "radioactif"], "Le point d'exclamation signale un produit nocif ou irritant."], ["Le pictogramme représentant un arbre et un poisson morts signifie :", ["dangereux pour l'environnement", "toxique pour l'homme seulement", "inflammable", "comburant"], "Ce produit pollue les milieux aquatiques et la nature."], ["Le pictogramme représentant une bombe qui explose signifie :", ["explosif", "inflammable", "comburant", "corrosif"], "Produit explosif."], ["Le pictogramme représentant une silhouette avec une étoile sur la poitrine signifie :", ["dangereux pour la santé (effets graves à long terme)", "explosif", "inflammable", "sans danger"], "Il signale un danger grave pour la santé (cancérogène…)."], ["L'eau de javel concentrée porte le pictogramme :", ["corrosif", "explosif", "comburant", "radioactif"], "L'eau de javel concentrée est corrosive."], ["Le butane (gaz de cuisine) porte le pictogramme :", ["inflammable", "corrosif", "toxique", "comburant"], "Le butane est un gaz très inflammable."], ["Quel est le danger de la combustion du PVC ?", ["Elle libère du chlorure d'hydrogène, un gaz toxique et corrosif", "Elle produit du dioxygène", "Elle ne produit aucun gaz", "Elle produit du dihydrogène"], "Le PVC contient du chlore : sa combustion libère HCl."], ["Quel est le danger de la combustion incomplète du bois ou du gaz dans une pièce fermée ?", ["Le dégagement de monoxyde de carbone, mortel", "La formation de rouille", "Le dégagement de dihydrogène", "La production d'eau"], "Le CO est un gaz mortel, incolore et inodore."], ["Pour réduire la pollution par les plastiques, il faut :", ["trier et recycler les déchets", "les brûler dans la rue", "les jeter dans la mer", "les enterrer dans le jardin"], "Le tri et le recyclage limitent la pollution."], ["Lequel de ces gestes est dangereux ?", ["Mélanger l'eau de javel avec un produit acide", "Porter des gants pour manipuler la soude", "Ranger les produits hors de portée des enfants", "Lire l'étiquette avant utilisation"], "Ce mélange dégage du dichlore, un gaz toxique."], ["Les produits ménagers dangereux doivent être rangés :", ["hors de portée des enfants, dans leur emballage d'origine", "dans des bouteilles d'eau", "près des aliments", "à côté du feu"], "Pour éviter les confusions et les accidents."], ["Un métal comme le plomb est dangereux car :", ["il est toxique pour la santé", "il est attiré par un aimant", "il brûle facilement", "il est très léger"], "Le plomb s'accumule dans l'organisme : il est toxique."], ["Le symbole formé de trois flèches en triangle sur un emballage indique :", ["que le matériau est recyclable", "que le produit est toxique", "que le produit est inflammable", "que le produit est périmé"], "C'est le symbole du recyclage."], ["Pourquoi les sacs en plastique sont-ils dangereux pour les animaux marins ?", ["Ils les avalent et s'étouffent", "Ils les rendent magnétiques", "Ils réchauffent l'eau", "Ils produisent du dioxygène"], "Les animaux confondent les sacs avec de la nourriture."], ["Les gaz de combustion des matériaux organiques contribuent :", ["à la pollution de l'air et à l'effet de serre", "à la purification de l'air", "à la protection du fer", "à la formation de l'alumine"], "CO₂, CO et fumées polluent l'air."], ["Avant d'utiliser un produit chimique, il faut d'abord :", ["lire l'étiquette et les pictogrammes", "le sentir de près", "le goûter", "le chauffer"], "L'étiquette indique les dangers et les précautions."], ["Quelle précaution prendre avec un produit portant le pictogramme « inflammable » ?", ["Le tenir loin des flammes et des sources de chaleur", "Le chauffer avant usage", "Le mélanger avec de l'eau de javel", "Le ranger près de la cuisinière"], "Il peut prendre feu au contact d'une flamme."], ["Les piles usagées doivent être :", ["déposées dans un point de collecte", "jetées avec les ordures ménagères", "brûlées", "jetées dans la nature"], "Elles contiennent des métaux toxiques."], ["Lequel de ces matériaux est biodégradable ?", ["le papier", "le verre", "le PVC", "l'aluminium"], "Le papier se dégrade naturellement en quelques mois."], ["Les fumées noires d'un pneu qui brûle contiennent :", ["des particules de carbone et des gaz toxiques", "uniquement de la vapeur d'eau", "du dioxygène pur", "du dihydrogène"], "Combustion incomplète : suie (carbone) et gaz toxiques."], ["Que signifie le pictogramme représentant une bouteille de gaz ?", ["gaz sous pression", "produit corrosif", "produit toxique", "produit recyclable"], "Il indique un gaz sous pression qui peut exploser s'il est chauffé."]]},
{sem:1,name:"Le mouvement et le repos",qs:[["Vrai ou faux : Le mouvement d'un ascenseur est un mouvement de translation rectiligne.", ["Vrai", "Faux"], "La cabine se déplace en ligne droite sans tourner : translation rectiligne."], ["Vrai ou faux : La trajectoire d'un point d'une pale d'éolienne par rapport au sol est circulaire.", ["Vrai", "Faux"], "Ce point tourne autour de l'axe de l'éolienne."], ["Vrai ou faux : Un objet peut être en mouvement par rapport à un référentiel et au repos par rapport à un autre.", ["Vrai", "Faux"], "Le mouvement et le repos sont relatifs au référentiel choisi."], ["Vrai ou faux : Un passager assis dans un train en marche est au repos par rapport au quai.", ["Faux", "Vrai"], "Il est en mouvement par rapport au quai, mais au repos par rapport au train."], ["Vrai ou faux : Dans un mouvement uniforme, la vitesse reste constante.", ["Vrai", "Faux"], "Uniforme = vitesse constante."], ["Vrai ou faux : Dans un mouvement accéléré, les distances parcourues pendant des durées égales augmentent.", ["Vrai", "Faux"], "La vitesse augmente : l'objet parcourt de plus en plus de distance."], ["Vrai ou faux : La porte qui tourne autour de ses gonds est en mouvement de translation.", ["Faux", "Vrai"], "La porte tourne autour d'un axe fixe : mouvement de rotation."], ["Vrai ou faux : Le mouvement d'un tiroir qu'on ouvre est une translation rectiligne.", ["Vrai", "Faux"], "Le tiroir se déplace en ligne droite sans tourner."], ["Compléter : …… d'un point d'un mobile est l'ensemble des positions qu'il occupe durant son mouvement.", ["La trajectoire", "La vitesse", "La distance", "La durée"], "La trajectoire est la ligne formée par les positions successives."], ["Compléter : On distingue trois types de trajectoires : rectiligne, …… et curviligne.", ["circulaire", "uniforme", "accélérée", "ralentie"], "Rectiligne, circulaire et curviligne."], ["Compléter : Le mouvement est dit …… lorsque sa vitesse augmente au cours du temps.", ["accéléré", "uniforme", "ralenti", "circulaire"], "Vitesse qui augmente → mouvement accéléré."], ["Compléter : Le mouvement est dit …… lorsque sa vitesse diminue au cours du temps.", ["ralenti", "accéléré", "uniforme", "rectiligne"], "Vitesse qui diminue → mouvement ralenti (retardé)."], ["Compléter : L'objet par rapport auquel on étudie le mouvement s'appelle le ……", ["référentiel", "mobile", "receveur", "trajectoire"], "Le référentiel est l'objet de référence."], ["Un objet est en mouvement par rapport à un référentiel si :", ["sa position change par rapport à ce référentiel", "sa masse change", "sa forme change", "sa couleur change"], "Mouvement = changement de position au cours du temps."], ["Un élève assis dans un bus qui roule est au repos par rapport :", ["au bus", "à la route", "aux arbres", "à un piéton sur le trottoir"], "Sa position ne change pas par rapport au bus."], ["La trajectoire d'un point de la roue d'une voiture, par rapport à l'axe de la roue, est :", ["circulaire", "rectiligne", "curviligne quelconque", "un point fixe"], "Par rapport à l'axe, chaque point de la roue décrit un cercle."], ["La nature du mouvement d'une roue de vélo autour de son axe est :", ["un mouvement de rotation", "une translation rectiligne", "une translation circulaire", "un repos"], "La roue tourne autour de son axe : rotation."], ["Un sac de sable tombe verticalement vers le sol. Sa trajectoire est :", ["rectiligne", "circulaire", "curviligne", "elliptique"], "La chute verticale suit une ligne droite."], ["Un objet tombe en chute libre. La nature de son mouvement pendant la chute est :", ["rectiligne accéléré", "rectiligne uniforme", "rectiligne ralenti", "circulaire uniforme"], "Sa vitesse augmente pendant la chute."], ["Sur un enregistrement, les positions d'un mobile sont séparées par des distances égales pendant des durées égales. Le mouvement est :", ["uniforme", "accéléré", "ralenti", "circulaire"], "Distances égales en durées égales : vitesse constante."], ["Sur un enregistrement, les distances entre positions successives sont 1,5 cm ; 2,5 cm ; 4 cm ; 7,5 cm ; 13 cm. Le mouvement est :", ["accéléré", "uniforme", "ralenti", "au repos"], "Les distances augmentent : la vitesse augmente."], ["Sur un enregistrement, les distances entre positions successives sont 5 cm ; 4 cm ; 3 cm ; 2 cm. Le mouvement est :", ["ralenti", "accéléré", "uniforme", "circulaire"], "Les distances diminuent : la vitesse diminue."], ["Un colis descend verticalement. Ses positions sont d'abord de plus en plus espacées, puis régulièrement espacées. Le mouvement est :", ["accéléré puis uniforme", "uniforme puis accéléré", "ralenti puis uniforme", "uniforme pendant toute la descente"], "Espacements croissants (accéléré) puis constants (uniforme)."], ["La nacelle d'une grande roue garde toujours la même orientation. Son mouvement est :", ["une translation circulaire", "une rotation", "une translation rectiligne", "un repos"], "Elle décrit un cercle sans tourner sur elle-même."], ["Le satellite M6A tourne autour de la Terre. Par rapport à la Terre, sa trajectoire est pratiquement :", ["circulaire", "rectiligne", "un point fixe", "verticale"], "Il décrit une orbite autour de la Terre."], ["Le mouvement d'un point de l'aiguille d'une montre est :", ["circulaire", "rectiligne", "curviligne quelconque", "au repos"], "Il tourne autour du centre du cadran."], ["Pour décrire un mouvement, il faut toujours préciser :", ["le référentiel", "la masse du mobile", "la couleur du mobile", "la température"], "Le mouvement dépend du référentiel choisi."], ["Une voiture roule sur une route rectiligne à vitesse constante. Son mouvement est :", ["rectiligne uniforme", "rectiligne accéléré", "circulaire uniforme", "curviligne ralenti"], "Trajectoire droite et vitesse constante."], ["Une voiture freine pour s'arrêter devant un feu rouge. Pendant le freinage, son mouvement est :", ["ralenti", "accéléré", "uniforme", "au repos"], "Sa vitesse diminue jusqu'à l'arrêt."], ["La trajectoire d'un ballon lancé vers un panier de basket est :", ["curviligne", "rectiligne", "circulaire", "un point"], "Le ballon décrit une courbe (une parabole)."]]},
{sem:1,name:"La vitesse et la vitesse moyenne",qs:[["Vrai ou faux : La vitesse moyenne se calcule par la relation v = d / Δt.", ["Vrai", "Faux"], "Vitesse moyenne = distance parcourue / durée du parcours."], ["Vrai ou faux : La vitesse moyenne est mesurée par un radar.", ["Faux", "Vrai"], "Le radar mesure la vitesse instantanée ; la vitesse moyenne se calcule."], ["Vrai ou faux : La distance de freinage augmente si la vitesse du véhicule augmente.", ["Vrai", "Faux"], "Plus on roule vite, plus il faut de distance pour s'arrêter."], ["Vrai ou faux : La distance de freinage dépend de l'état du conducteur.", ["Faux", "Vrai"], "C'est la distance de réaction qui dépend du conducteur ; le freinage dépend de la vitesse, de la route, des pneus et des freins."], ["Vrai ou faux : Plus la vitesse augmente, plus la distance de freinage diminue.", ["Faux", "Vrai"], "La distance de freinage augmente avec la vitesse."], ["Vrai ou faux : La distance d'arrêt se calcule par la relation DA = v × tR.", ["Faux", "Vrai"], "v × tR donne la distance de réaction ; DA = DR + DF."], ["Vrai ou faux : 1 m/s = 3,6 km/h.", ["Vrai", "Faux"], "1 m/s = 3600 m/h = 3,6 km/h."], ["Compléter : La distance d'arrêt est la somme de la distance de …… et de la distance de freinage.", ["réaction", "sécurité", "parcours", "vitesse"], "DA = DR + DF."], ["Compléter : La distance de réaction se calcule par DR = ……", ["v × tR", "v / tR", "tR / v", "v + tR"], "Pendant le temps de réaction, la voiture roule à vitesse constante."], ["Cocher la bonne réponse : La distance de réaction dépend de :", ["le temps de réaction du conducteur", "l'état de la route", "l'état des pneus", "l'état des freins"], "La distance de réaction dépend de la vitesse et du temps de réaction."], ["Cocher la bonne réponse : L'unité internationale de la vitesse est :", ["m/s", "km/h", "m", "s"], "Unité internationale : le mètre par seconde."], ["Un mobile parcourt 250 m en 20 s. Sa vitesse moyenne est :", ["12,5 m/s", "12,5 km/h", "45 m/s", "5000 m/s"], "v = 250/20 = 12,5 m/s (soit 45 km/h)."], ["Convertir 12,5 m/s en km/h :", ["45 km/h", "3,47 km/h", "12,5 km/h", "125 km/h"], "12,5 × 3,6 = 45 km/h."], ["Convertir 72 km/h en m/s :", ["20 m/s", "259,2 m/s", "72 m/s", "2 m/s"], "72 / 3,6 = 20 m/s."], ["Un oiseau vole à v = 45 km/h. Il parcourt la distance d = 450 m en :", ["36 s", "10 h", "6 min", "36 min"], "45 km/h = 12,5 m/s ; Δt = 450/12,5 = 36 s."], ["Un cycliste roule à v = 18 km/h. La distance parcourue en 2 minutes est :", ["600 m", "36 m", "1,8 km", "900 m"], "18 km/h = 5 m/s ; d = 5 × 120 = 600 m."], ["Un sac tombe d'une hauteur d = 30 m en Δt = 2,5 s. Sa vitesse moyenne est :", ["43,2 km/h", "12 km/h", "75 km/h", "3,33 km/h"], "v = 30/2,5 = 12 m/s = 12 × 3,6 = 43,2 km/h."], ["Le satellite M6A se déplace à v = 7,6 km/s. En m/s, cette vitesse vaut :", ["7600 m/s", "760 m/s", "27,36 m/s", "2,11 m/s"], "7,6 km/s = 7,6 × 1000 = 7600 m/s."], ["Le satellite M6A fait un tour en 97,5 min à 7600 m/s. La distance parcourue en un tour est environ :", ["44 460 km", "741 km", "4 446 km", "444 600 km"], "Δt = 97,5 × 60 = 5850 s ; d = 7600 × 5850 = 44 460 000 m = 44 460 km."], ["Le satellite M6A fait un tour en 97,5 min. Le nombre de tours complets en une journée est :", ["14", "24", "15", "97"], "24 × 60 = 1440 min ; 1440/97,5 ≈ 14,8 → 14 tours complets."], ["Mme Amina parcourt D = 10 km en trottinette à 25 km/h. La durée du trajet est :", ["24 min", "2,5 h", "40 min", "4 min"], "Δt = 10/25 = 0,4 h = 24 min."], ["Un drone vole à 24 km/h sur un trajet de 3,6 km. La durée d'un trajet est :", ["9 min", "6,7 min", "15 min", "86,4 min"], "Δt = 3,6/24 = 0,15 h = 9 min."], ["Une voiture roule 30 min à 90 km/h. La distance parcourue est :", ["45 km", "180 km", "2 700 km", "3 km"], "d = 90 × 0,5 = 45 km."], ["Une voiture parcourt 110 km en 1 h 15 min. Sa vitesse moyenne est :", ["88 km/h", "110 km/h", "146,7 km/h", "73 km/h"], "1 h 15 min = 1,25 h ; v = 110/1,25 = 88 km/h."], ["Un mobile roule à 15 m/s. La durée pour parcourir 800 m est environ :", ["53 s", "12 000 s", "8 s", "15 s"], "Δt = 800/15 ≈ 53,3 s."], ["Une voiture roule à 72 km/h ; le temps de réaction du conducteur est tR = 1 s. La distance de réaction est :", ["20 m", "72 m", "7,2 m", "200 m"], "v = 20 m/s ; DR = 20 × 1 = 20 m."], ["La distance de réaction est DR = 20 m et la distance de freinage DF = 40 m. La distance d'arrêt est :", ["60 m", "20 m", "40 m", "800 m"], "DA = DR + DF = 20 + 40 = 60 m."], ["Un conducteur voit un enfant à 130 m et s'arrête 5 m avant lui. La distance d'arrêt est :", ["125 m", "135 m", "130 m", "5 m"], "DA = 130 − 5 = 125 m."], ["Un obstacle est à 96 m ; tR = 1 s et DF = 0,0625 × v² (v en m/s). La vitesse maximale pour éviter la collision est :", ["32 m/s", "96 m/s", "16 m/s", "48 m/s"], "v × 1 + 0,0625 v² = 96 ; pour v = 32 : 32 + 64 = 96 m."], ["Lequel de ces facteurs augmente la distance de freinage ?", ["une route mouillée", "des pneus neufs", "une vitesse faible", "des freins en bon état"], "Une route mouillée réduit l'adhérence."], ["Lequel de ces facteurs augmente la distance de réaction ?", ["la fatigue ou l'usage du téléphone", "une route sèche", "des pneus neufs", "une voiture légère"], "Le temps de réaction augmente quand le conducteur est distrait ou fatigué."], ["Deux voitures roulent l'une vers l'autre, séparées de 15 km, à 90 km/h et 72 km/h. Elles se croisent après :", ["environ 5,6 min", "10 min", "1 min", "20,8 min"], "Δt = 15/(90 + 72) ≈ 0,0926 h ≈ 5,6 min."]]},
{sem:1,name:"Les actions mécaniques et les forces",qs:[["Vrai ou faux : La force exercée par un aimant sur un clou en fer est une force localisée.", ["Faux", "Vrai"], "C'est une action à distance, répartie sur tout le clou."], ["Vrai ou faux : Une action mécanique peut mettre un corps en mouvement.", ["Vrai", "Faux"], "C'est un effet dynamique."], ["Vrai ou faux : Une action mécanique peut déformer un corps.", ["Vrai", "Faux"], "C'est un effet statique."], ["Vrai ou faux : L'action de la Terre sur un objet est une action de contact.", ["Faux", "Vrai"], "C'est une action à distance, répartie sur tout l'objet."], ["Vrai ou faux : L'action du vent sur la voile d'un bateau est une action de contact répartie.", ["Vrai", "Faux"], "Le vent agit sur toute la surface de la voile."], ["Vrai ou faux : Dans une action mécanique, l'acteur est le corps qui subit l'action.", ["Faux", "Vrai"], "L'acteur exerce l'action ; le receveur la subit."], ["Compléter : Les effets d'une action mécanique peuvent être …… ou dynamiques.", ["statiques", "chimiques", "électriques", "thermiques"], "Effet statique (déformation) ou dynamique (mouvement)."], ["Compléter : Les deux types d'actions mécaniques sont les actions de …… et les actions à distance.", ["contact", "rotation", "translation", "frottement"], "Actions de contact et actions à distance."], ["Compléter : Une action de contact peut être …… ou répartie.", ["localisée", "à distance", "dynamique", "statique"], "Localisée (en un point) ou répartie (sur une surface)."], ["Compléter : L'action mécanique responsable de la chute de tout objet est exercée par ……", ["la Terre", "l'air", "le Soleil", "la Lune"], "C'est l'attraction de la Terre (le poids)."], ["Cocher la bonne réponse : L'action d'un aimant sur un clou est :", ["une action à distance", "une action de contact localisée", "une action de contact répartie", "aucune action"], "L'aimant attire le clou sans le toucher."], ["Cocher la bonne réponse : L'action d'une main qui tire une corde
