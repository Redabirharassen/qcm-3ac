["Les déchets liquides toxiques jetés sur le sol peuvent :",["s'infiltrer et polluer les eaux souterraines","purifier les nappes d'eau","nourrir les plantes","s'évaporer sans laisser de trace"],"Ils atteignent les nappes phréatiques."],
["Brûler les déchets à l'air libre :",["dégrade la qualité de l'air","améliore la qualité de l'air","ne produit aucun gaz","protège la couche d'ozone"],"La combustion des déchets libère des fumées et des gaz toxiques."],
["Les déchets abandonnés près des habitations favorisent :",["les maladies de la peau et des voies respiratoires","une meilleure santé","la propreté des rues","la baisse de la pollution"],"Ils augmentent aussi le risque de cancers."],
["Recycler un matériau, c'est :",["le récupérer pour fabriquer de nouveaux objets","le brûler à l'air libre","l'enterrer dans le sol","le jeter à la mer"],"Le recyclage réduit la quantité de déchets envoyés à la décharge."],
["Parmi ces matériaux, lesquels sont recyclables ?",["les métaux, le verre et le plastique","aucun matériau","seulement le papier","seulement le bois"],"On les trie pour pouvoir les recycler."],
["Le traitement biologique des déchets organiques permet de produire :",["des engrais organiques","du verre","du plastique","des métaux"],"C'est le compostage."],
["La décomposition de la matière organique à l'abri de l'air produit un gaz utilisé comme source d'énergie :",["le méthane","le dioxygène","le diazote","l'hélium"],"On l'utilise pour l'éclairage et le chauffage."],
["L'incinération des déchets permet de :",["produire de l'énergie thermique","fabriquer du verre","produire de l'eau potable","fabriquer des engrais"],"Cette énergie peut être convertie en d'autres formes d'énergie."],
["Dans une décharge contrôlée, le fond de la fosse est recouvert d'une couche étanche pour :",["empêcher les liquides de s'infiltrer dans le sous-sol","chauffer les déchets","décorer la décharge","faire pousser des plantes"],"On protège ainsi les eaux souterraines."],
["Le tri des déchets consiste à :",["les séparer selon leur type dans des conteneurs adaptés","les mélanger tous ensemble","les brûler","les jeter dans la rue"],"Le tri facilite le recyclage."],
["La meilleure façon de limiter les déchets est d'abord de :",["réduire leur production","les brûler","les enterrer","les jeter dans la rivière"],"La prévention passe avant le recyclage et l'élimination."],
["Il faut éviter de chauffer les aliments dans des récipients en :",["plastique","verre","porcelaine","terre cuite"],"À la chaleur, certains plastiques libèrent des substances nocives dans les aliments."],
["Il faut éviter de réutiliser une petite bouteille d'eau en plastique si elle a été :",["exposée au soleil ou à la chaleur","lavée à l'eau froide","conservée à l'ombre","fermée avec son bouchon"],"La chaleur dégrade le plastique."],
["Jeter les ordures ménagères dans la rue est un comportement :",["à éviter, car il nuit à la santé et à l'environnement","recommandé","sans conséquence","qui protège l'environnement"],"Les déchets doivent être mis dans les conteneurs adaptés."],
["Les piles usagées doivent être :",["déposées dans un point de collecte","jetées dans la nature","brûlées","jetées dans l'eau"],"Elles contiennent des métaux toxiques."],
["Avant d'utiliser un produit d'entretien, il faut :",["lire les pictogrammes et les conseils de son étiquette","le mélanger avec un autre produit","le respirer profondément","le transvaser dans une bouteille d'eau"],"Mélanger des produits ménagers peut libérer des gaz toxiques."],
["La combustion des déchets en PVC est particulièrement dangereuse car elle libère :",["du chlorure d'hydrogène, un gaz toxique","du dioxygène","de la vapeur d'eau seulement","du diazote"],"C'est pourquoi on ne doit pas brûler les plastiques."]]},
{sem:1,name:"Le mouvement et le repos",qs:[
["Pour décrire le mouvement d'un corps, il faut d'abord choisir :",["un corps de référence (référentiel)","une balance","un thermomètre","une couleur"],"Le mouvement est toujours décrit par rapport à un autre corps."],
["Le corps par rapport auquel on étudie un mouvement s'appelle :",["le référentiel","la trajectoire","le mobile","la vitesse"],"On dit aussi le corps de référence."],
["Un corps est en mouvement par rapport à un référentiel si :",["sa position change par rapport à ce référentiel","sa position ne change pas","sa masse change","sa couleur change"],"Si sa position ne change pas, il est au repos."],
["Un corps est au repos par rapport à un référentiel si :",["sa position ne change pas par rapport à ce référentiel","sa position change","il est léger","il est lourd"],"Le repos dépend du référentiel choisi."],
["On dit que le mouvement et le repos sont des notions relatives car :",["elles dépendent du référentiel choisi","elles dépendent de la masse du corps","elles sont toujours fausses","elles ne s'appliquent qu'aux voitures"],"Un même corps peut être au repos dans un référentiel et en mouvement dans un autre."],
["Mohammed est assis dans un tramway qui roule. Par rapport à son siège, il est :",["au repos","en mouvement","en rotation","en chute"],"Sa position par rapport au siège ne change pas."],
["Mohammed est assis dans un tramway qui roule. Par rapport aux gens debout au bord de la voie, il est :",["en mouvement","au repos","immobile","en rotation"],"Sa position par rapport à eux change."],
["Un arbre au bord de la route est, par rapport à une voiture qui roule :",["en mouvement","au repos","en rotation","en chute"],"La distance entre l'arbre et la voiture change."],
["Un arbre au bord de la route est, par rapport à la route :",["au repos","en mouvement","en rotation","en translation"],"Sa position par rapport à la route ne change pas."],
["Deux voitures roulent côte à côte à la même vitesse et dans le même sens. L'une par rapport à l'autre, elles sont :",["au repos","en mouvement","en rotation","en mouvement accéléré"],"La position de l'une par rapport à l'autre ne change pas."],
["Le conducteur d'un bus qui roule est en mouvement par rapport :",["à la route","à son siège","au volant","aux passagers assis"],"Par rapport à son siège, au volant et aux passagers assis, il est au repos."],
["La trajectoire d'un point mobile est :",["la ligne qui relie ses positions successives","sa vitesse","la durée de son mouvement","sa masse"],"Elle peut être rectiligne, circulaire ou curviligne."],
["Si la trajectoire est une droite, elle est dite :",["rectiligne","circulaire","curviligne","uniforme"],"Exemple : une bille qui tombe verticalement."],
["Si la trajectoire est un cercle, elle est dite :",["circulaire","rectiligne","curviligne","accélérée"],"Exemple : l'extrémité d'une aiguille de montre."],
["Si la trajectoire est une courbe quelconque, elle est dite :",["curviligne","rectiligne","circulaire","immobile"],"Exemple : une moto dans une série de virages."],
["La trajectoire de l'extrémité d'une aiguille de montre est :",["circulaire","rectiligne","curviligne","un point"],"Elle décrit un cercle autour de l'axe des aiguilles."],
["La trajectoire d'un point d'une cabine d'ascenseur est :",["rectiligne","circulaire","curviligne","un cercle"],"La cabine monte et descend en ligne droite."],
["Les deux types de mouvement d'un solide étudiés en 3AC sont :",["la translation et la rotation","la fusion et la solidification","le repos et l'équilibre","l'oxydation et la combustion"],"Translation : le solide reste parallèle à lui-même ; rotation : il tourne autour d'un axe."],
["Un solide est en mouvement de translation si tout segment reliant deux de ses points :",["garde la même direction au cours du mouvement","tourne autour d'un axe","change de longueur","reste immobile"],"Le solide reste parallèle à lui-même."],
["Un solide est en mouvement de rotation autour d'un axe fixe si ses points décrivent :",["des cercles centrés sur l'axe","des droites parallèles","des trajectoires quelconques","un seul point"],"Les points situés sur l'axe restent immobiles."],
["Dans un mouvement de rotation, les points situés sur l'axe de rotation sont :",["immobiles","les plus rapides","en translation","en mouvement rectiligne"],"Les autres points décrivent des cercles autour de l'axe."],
["Le mouvement d'un tiroir qu'on ouvre est :",["une translation","une rotation","un repos","une rotation autour d'un axe fixe"],"Tous ses points ont des trajectoires rectilignes parallèles."],
["Le mouvement d'une porte qu'on ouvre est :",["une rotation","une translation","un mouvement rectiligne","un repos"],"Elle tourne autour de l'axe de ses charnières."],
["Le mouvement d'une cabine d'ascenseur est :",["une translation","une rotation","un repos","un mouvement circulaire"],"La cabine reste parallèle à elle-même."],
["Le mouvement des aiguilles d'une montre est :",["une rotation","une translation rectiligne","une translation circulaire","un repos"],"Elles tournent autour d'un axe fixe."],
["Le mouvement de la roue d'un vélo autour de son axe est :",["une rotation","une translation","un mouvement rectiligne","un repos"],"Chaque point de la roue décrit un cercle autour de l'axe."],
["Les pales d'un ventilateur en marche sont en mouvement de :",["rotation","translation rectiligne","translation curviligne","repos"],"Elles tournent autour de l'axe du moteur."],
["La nacelle d'une grande roue reste toujours verticale pendant que la roue tourne. Son mouvement est :",["une translation circulaire","une rotation","une translation rectiligne","un repos"],"Ses points décrivent des cercles, mais la nacelle reste parallèle à elle-même."],
["Un wagon qui roule sur une voie droite est en mouvement de :",["translation rectiligne","rotation","translation circulaire","repos par rapport à la voie"],"Tous ses points décrivent des droites parallèles."],
["Dans un mouvement de translation, tous les points du solide ont :",["des trajectoires identiques","des trajectoires circulaires de rayons différents","des vitesses nulles","une position fixe"],"Les trajectoires sont superposables."],
["La Lune tourne autour de la Terre. Par rapport à la Terre, la trajectoire de son centre est pratiquement :",["circulaire","rectiligne","un point","une droite"],"La Lune décrit presque un cercle autour de la Terre."],
["Une élève assise dans la classe est, par rapport au Soleil :",["en mouvement","au repos","immobile","sans référentiel"],"La Terre tourne sur elle-même et autour du Soleil."]]},
{sem:1,name:"La vitesse et la vitesse moyenne",qs:[
["La vitesse moyenne se calcule par la relation :",["v = d / t","v = d × t","v = t / d","v = d + t"],"C'est la distance parcourue divisée par la durée du parcours."],
["Dans la relation v = d / t, la lettre d représente :",["la distance parcourue","la durée du parcours","la densité","le diamètre"],"t est la durée du parcours."],
["L'unité de la vitesse dans le système international est :",["le mètre par seconde (m/s)","le kilomètre par heure (km/h)","le mètre (m)","la seconde (s)"],"Le km/h est une unité usuelle."],
["1 m/s est égal à :",["3,6 km/h","36 km/h","0,36 km/h","1000 km/h"],"1 m/s = 3600 m par heure = 3,6 km/h."],
["Pour convertir une vitesse de m/s en km/h, on :",["multiplie par 3,6","divise par 3,6","multiplie par 60","divise par 1000"],"Par exemple 10 m/s = 36 km/h."],
["Pour convertir une vitesse de km/h en m/s, on :",["divise par 3,6","multiplie par 3,6","multiplie par 1000","divise par 60"],"Par exemple 72 km/h = 20 m/s."],
["10 m/s correspondent à :",["36 km/h","3,6 km/h","100 km/h","2,8 km/h"],"10 × 3,6 = 36 km/h."],
["72 km/h correspondent à :",["20 m/s","72 m/s","259,2 m/s","7,2 m/s"],"72 / 3,6 = 20 m/s."],
["90 km/h correspondent à :",["25 m/s","324 m/s","9 m/s","30 m/s"],"90 / 3,6 = 25 m/s."],
["30 m/s correspondent à :",["108 km/h","8,3 km/h","30 km/h","300 km/h"],"30 × 3,6 = 108 km/h."],
["Une voiture parcourt 210 km en 2 h. Sa vitesse moyenne est :",["105 km/h","420 km/h","70 km/h","212 km/h"],"v = 210 / 2 = 105 km/h."],
["Une voiture parcourt 210 km en 3 h. Sa vitesse moyenne est :",["70 km/h","105 km/h","630 km/h","213 km/h"],"v = 210 / 3 = 70 km/h."],
["Un coureur parcourt 100 m en 10 s. Sa vitesse moyenne est :",["10 m/s","1000 m/s","0,1 m/s","110 m/s"],"v = 100 / 10 = 10 m/s."],
["Un cycliste parcourt 40 km en 2 h. Sa vitesse moyenne est :",["20 km/h","80 km/h","42 km/h","38 km/h"],"v = 40 / 2 = 20 km/h."],
["Un train parcourt 40 km en 30 min. Sa vitesse moyenne est :",["80 km/h","20 km/h","70 km/h","1200 km/h"],"30 min = 0,5 h, donc v = 40 / 0,5 = 80 km/h."],
["Un élève marche à 1,5 m/s pendant 60 s. Il parcourt :",["90 m","40 m","61,5 m","900 m"],"d = v × t = 1,5 × 60 = 90 m."],
["Une voiture roule à 80 km/h pendant 3 h. Elle parcourt :",["240 km","83 km","26,7 km","160 km"],"d = v × t = 80 × 3 = 240 km."],
["Pour parcourir 150 km à la vitesse moyenne de 75 km/h, il faut :",["2 h","0,5 h","75 h","225 h"],"t = d / v = 150 / 75 = 2 h."],
["Pour calculer la durée d'un parcours, on utilise la relation :",["t = d / v","t = d × v","t = v / d","t = v + d"],"Elle se déduit de v = d / t."],
["Pour calculer la distance parcourue, on utilise la relation :",["d = v × t","d = v / t","d = t / v","d = v + t"],"Elle se déduit de v = d / t."],
["La vitesse indiquée par le compteur d'une voiture est :",["la vitesse instantanée","la vitesse moyenne du voyage","la distance parcourue","la durée du trajet"],"C'est la vitesse à un instant précis."],
["La vitesse mesurée par un radar est :",["la vitesse instantanée","la vitesse moyenne sur tout le trajet","la distance d'arrêt","la durée de réaction"],"Le radar mesure la vitesse à l'instant où le véhicule passe."],
["Dans un mouvement uniforme, la vitesse :",["reste constante","augmente","diminue","est nulle"],"Le mobile parcourt des distances égales pendant des durées égales."],
["Dans un mouvement accéléré, la vitesse :",["augmente","diminue","reste constante","est nulle"],"Les distances parcourues pendant des durées égales sont de plus en plus grandes."],
["Dans un mouvement retardé, la vitesse :",["diminue","augmente","reste constante","devient infinie"],"Les distances parcourues pendant des durées égales sont de plus en plus petites."],
["Pendant des durées égales, un mobile parcourt des distances égales. Son mouvement est :",["uniforme","accéléré","retardé","circulaire"],"Sa vitesse reste constante."],
["Pendant des durées égales, un mobile parcourt des distances de plus en plus grandes. Son mouvement est :",["accéléré","retardé","uniforme","au repos"],"Sa vitesse augmente."],
["Pendant des durées égales, un mobile parcourt des distances de plus en plus petites. Son mouvement est :",["retardé","accéléré","uniforme","au repos"],"Sa vitesse diminue."],
["Une voiture qui démarre a un mouvement :",["accéléré","retardé","uniforme","de repos"],"Sa vitesse augmente à partir de zéro."],
["Une voiture qui freine a un mouvement :",["retardé","accéléré","uniforme","de repos"],"Sa vitesse diminue jusqu'à l'arrêt."],
["La distance d'arrêt d'un véhicule est égale à :",["distance de réaction + distance de freinage","distance de réaction − distance de freinage","distance de freinage seulement","distance de réaction × distance de freinage"],"D(arrêt) = D(réaction) + D(freinage)."],
["La distance de réaction est la distance parcourue :",["entre le moment où le conducteur voit l'obstacle et le moment où il commence à freiner","pendant le freinage","après l'arrêt du véhicule","avant de voir l'obstacle"],"Pendant ce temps, le véhicule continue à la même vitesse."],
["La distance de freinage est la distance parcourue :",["entre le début du freinage et l'arrêt complet","avant de voir l'obstacle","pendant le temps de réaction","après l'arrêt"],"Elle dépend de la vitesse, des freins, des pneus et de l'état de la route."],
["La distance de réaction se calcule par la relation :",["D = v × t (t : temps de réaction)","D = v / t","D = t / v","D = v + t"],"C'est la distance parcourue à la vitesse v pendant le temps de réaction."],
["Une voiture roule à 20 m/s. Le temps de réaction du conducteur est 1 s. La distance de réaction est :",["20 m","2 m","200 m","21 m"],"D = v × t = 20 × 1 = 20 m."],
["La distance de réaction est 15 m et la distance de freinage 35 m. La distance d'arrêt est :",["50 m","20 m","35 m","525 m"],"15 + 35 = 50 m."],
["La distance de réaction augmente si le conducteur :",["est fatigué ou a pris des médicaments","a de bons pneus","roule sur une route sèche","a de bons freins"],"Son temps de réaction est alors plus long."],
["La distance de freinage augmente si :",["la route est mouillée","la route est sèche","les pneus sont neufs","la vitesse est faible"],"Elle augmente aussi quand la vitesse augmente ou quand les freins sont usés."],
["Quand la vitesse d'un véhicule augmente, sa distance d'arrêt :",["augmente","diminue","reste la même","devient nulle"],"La distance de réaction et la distance de freinage augmentent toutes les deux."],
["Pour éviter les accidents de la route, il faut :",["respecter les limitations de vitesse","téléphoner en conduisant","rouler sans ceinture","ignorer les panneaux"],"L'excès de vitesse est l'une des causes principales des accidents."]]},
{sem:1,name:"Les actions mécaniques et les forces",qs:[
["Dans une action mécanique, le corps qui exerce l'action s'appelle :",["l'acteur","le receveur","le référentiel","le mobile"],"Le corps qui subit l'action est le receveur."],
["Dans une action mécanique, le corps qui subit l'action s'appelle :",["le receveur","l'acteur","le référentiel","le dynamomètre"],"Le corps qui exerce l'action est l'acteur."],
["Le pied d'un joueur frappe un ballon. L'acteur est :",["le pied du joueur","le ballon","le terrain","le but"],"Le ballon est le receveur."],
["Un aimant attire une bille en acier. Le receveur est :",["la bille","l'aimant","la table","l'air"],"L'aimant est l'acteur."],
["Une action mécanique peut avoir un effet :",["statique ou dynamique","chimique","électrique","lumineux"],"Elle peut déformer ou maintenir en équilibre, mettre en mouvement ou modifier un mouvement."],
["Lequel de ces effets est un effet dynamique ?",["mettre un corps en mouvement","déformer un corps","maintenir un corps en équilibre","maintenir un corps immobile"],"Les effets dynamiques concernent le mouvement."],
["Lequel de ces effets est un effet statique ?",["déformer un corps","mettre un corps en mouvement","modifier la trajectoire d'un corps","modifier la vitesse d'un corps"],"Maintenir un corps en équilibre est aussi un effet statique."],
["La main qui écrase une boule de pâte a un effet :",["statique : elle déforme la pâte","dynamique : elle modifie la trajectoire","nul","électrique"],"La pâte change de forme."],
["Un fil qui retient un corps suspendu a pour effet de :",["maintenir le corps en équilibre","mettre le corps en mouvement","déformer le corps","modifier la trajectoire du corps"],"C'est un effet statique."],
["Un aimant placé près de la trajectoire d'une bille en acier qui roule a pour effet de :",["modifier la trajectoire de la bille","déformer la bille","maintenir la bille en équilibre","ne rien changer"],"C'est un effet dynamique."],
["Le pied qui frappe un ballon immobile a pour effet de :",["mettre le ballon en mouvement","maintenir le ballon en équilibre","colorer le ballon","ne rien changer"],"C'est un effet dynamique."],
["Les deux types d'actions mécaniques sont :",["les actions de contact et les actions à distance","les actions lentes et les actions rapides","les actions chaudes et les actions froides","les actions acides et les actions basiques"],"On les distingue selon qu'il y a contact ou non entre l'acteur et le receveur."],
["Une action de contact s'exerce :",["seulement entre deux corps qui se touchent","entre deux corps éloignés","seulement dans le vide","seulement entre deux aimants"],"Exemple : l'action de la main sur une porte."],
["Une action à distance s'exerce :",["sans contact entre l'acteur et le receveur","seulement si les corps se touchent","seulement avec un fil","seulement dans l'eau"],"Exemples : l'action d'un aimant, l'attraction de la Terre."],
["L'action d'un aimant sur une bille en acier est une action :",["à distance","de contact localisée","de contact répartie","impossible"],"L'aimant agit sans toucher la bille."],
["L'attraction de la Terre sur un corps est une action :",["à distance","de contact localisée","de contact répartie","nulle"],"Elle s'exerce même si le corps ne touche pas le sol."],
["L'action de la main qui pousse une porte est une action :",["de contact","à distance","magnétique","de gravitation"],"La main touche la porte."],
["Une action de contact est dite localisée si elle s'exerce :",["sur une très petite surface, assimilable à un point","sur une grande surface","dans tout le volume du corps","sans contact"],"Exemple : l'action d'une aiguille sur un tissu."],
["Une action de contact est dite répartie si elle s'exerce :",["sur une grande surface","en un seul point","sans contact","seulement à distance"],"Exemple : l'action d'un cahier posé sur une table."],
["L'action d'une aiguille à coudre sur le tissu est une action de contact :",["localisée","répartie","à distance","nulle"],"La pointe de l'aiguille touche le tissu sur une surface très petite."],
["L'action de la pointe d'un stylo sur une feuille est une action de contact :",["localisée","répartie","à distance","magnétique"],"La surface de contact est très petite."],
["L'action d'un cahier posé sur une table est une action de contact :",["répartie","localisée","à distance","nulle"],"Elle s'exerce sur toute la surface de contact."],
["L'action du vent sur la voile d'un bateau est une action de contact :",["répartie","localisée","à distance","nulle"],"Le vent agit sur toute la surface de la voile."],
["L'action d'un fil sur un corps suspendu est une action de contact :",["localisée","répartie","à distance","magnétique"],"Elle s'exerce au point d'attache."],
["Les actions mécaniques à distance sont toujours :",["réparties","localisées","de contact","nulles"],"Elles s'exercent sur tout le volume du corps."],
["Faire le bilan des actions mécaniques exercées sur un corps, c'est :",["faire la liste de toutes les actions que ce corps subit","mesurer sa masse","calculer sa vitesse","dessiner sa trajectoire"],"On cherche les actions de contact puis les actions à distance."],
["La première étape du bilan des actions mécaniques est de :",["définir précisément le système étudié","mesurer la vitesse du système","peser le système","chauffer le système"],"On cherche ensuite les actions de contact, puis les actions à distance."],
["Un livre est posé sur une table. Les actions mécaniques exercées sur le livre sont :",["l'action de la table et l'action de la Terre","l'action de la table seulement","l'action de la Terre seulement","aucune action"],"Une action de contact (la table) et une action à distance (la Terre)."],
["Une lampe est suspendue au plafond par un fil. Les actions mécaniques exercées sur la lampe sont :",["l'action du fil et l'action de la Terre","l'action du plafond et l'action du sol","l'action du fil seulement","l'action de la Terre seulement"],"Le plafond agit sur le fil, pas directement sur la lampe."],
["Une bille en acier suspendue à un fil est attirée par un aimant. Sans compter la Terre, les actions exercées sur la bille sont celles :",["du fil (contact) et de l'aimant (à distance)","du fil et de l'aimant (toutes deux de contact)","de l'aimant seulement","du fil seulement"],"Le fil touche la bille ; l'aimant agit sans la toucher."],
["Une action mécanique est modélisée par une grandeur physique appelée :",["force","masse","vitesse","énergie"],"On la représente par un vecteur."],
["L'action de l'eau sur la coque d'un bateau qui flotte est une action :",["de contact répartie","de contact localisée","à distance","nulle"],"L'eau agit sur toute la surface immergée de la coque."]]},
{sem:1,name:"Notion de force",qs:[
["Une force est caractérisée par :",["quatre caractéristiques","deux caractéristiques","une seule caractéristique","six caractéristiques"],"Point d'application, droite d'action, sens et intensité."],
["Les quatre caractéristiques d'une force sont :",["le point d'application, la droite d'action, le sens et l'intensité","la masse, le volume, la forme et la couleur","la vitesse, la durée, la distance et la trajectoire","la tension, l'intensité, la résistance et la puissance"],"Ce sont les éléments du vecteur force."],
["L'intensité d'une force se mesure avec :",["un dynamomètre","une balance","un ohmmètre","un chronomètre"],"La balance mesure la masse."],
["L'unité internationale de l'intensité d'une force est :",["le newton (N)","le kilogramme (kg)","le watt (W)","le joule (J)"],"Son symbole est N."],
["Le symbole du newton est :",["N","Ne","Nw","kg"],"On écrit par exemple F = 5 N."],
["On représente une force par :",["un vecteur","un cercle","un point","une courbe"],"On l'appelle le vecteur force."],
["L'origine du vecteur force correspond :",["au point d'application de la force","au sens de la force","à l'intensité de la force","à la masse du corps"],"Le vecteur part du point d'application."],
["La longueur du vecteur force correspond :",["à l'intensité de la force","au point d'application","à la masse du corps","à la durée de l'action"],"On utilise une échelle pour passer des newtons aux centimètres."],
["Le sens de la flèche du vecteur force correspond :",["au sens de la force","à son intensité","à son point d'application","à sa durée"],"Le sens de la force est celui de l'action modélisée."],
["La droite d'action d'une force est la droite :",["qui a la direction de la force et passe par son point d'application","qui est perpendiculaire à la force","qui est toujours horizontale","qui est toujours verticale"],"On dit aussi la direction de la force."],
["Pour une force de contact localisée, le point d'application est :",["le point de contact entre l'acteur et le receveur","le centre de gravité du receveur","le centre de la Terre","un point quelconque"],"Exemple : le point d'attache d'un fil."],
["Pour une force de contact répartie, le point d'application est :",["le centre de la surface de contact","le centre de gravité du corps","un point de l'acteur","un point quelconque du sol"],"Exemple : l'action d'une table sur un livre."],
["Pour une force à distance, le point d'application est :",["le centre de gravité du corps","le point de contact","le centre de la surface de contact","le point le plus haut du corps"],"On le note G."],
["Pour représenter une force, on choisit :",["une échelle","une couleur","une vitesse","une température"],"Par exemple 1 cm pour 2 N."],
["Avec l'échelle 1 cm pour 2 N, une force de 6 N est représentée par un vecteur de :",["3 cm","12 cm","6 cm","2 cm"],"6 / 2 = 3 cm."],
["Avec l'échelle 1 cm pour 5 N, un vecteur de 4 cm représente une force de :",["20 N","9 N","1,25 N","4 N"],"4 × 5 = 20 N."],
["Avec l'échelle 1 cm pour 1 N, une force de 5 N est représentée par un vecteur de :",["5 cm","1 cm","0,2 cm","10 cm"],"5 / 1 = 5 cm."],
["Avec l'échelle 1 cm pour 10 N, une force de 25 N est représentée par un vecteur de :",["2,5 cm","25 cm","250 cm","0,4 cm"],"25 / 10 = 2,5 cm."],
["Avec l'échelle 2 cm pour 1 N, une force de 3 N est représentée par un vecteur de :",["6 cm","1,5 cm","3 cm","5 cm"],"3 × 2 = 6 cm."],
["Une force de 8 N est représentée par un vecteur de 4 cm. L'échelle utilisée est :",["1 cm pour 2 N","1 cm pour 4 N","1 cm pour 8 N","1 cm pour 32 N"],"8 / 4 = 2 N par centimètre."],
["Un fil tire un corps vers le haut au point A. Le point d'application de la force exercée par le fil est :",["le point A","le centre de gravité du corps","le centre de la Terre","le milieu du fil"],"C'est le point de contact entre le fil et le corps."],
["Un fil vertical retient un corps suspendu. La force exercée par le fil sur le corps est dirigée :",["vers le haut","vers le bas","horizontalement","dans toutes les directions"],"Le fil tire le corps vers le haut, le long du fil."],
["La force exercée par un fil tendu sur un corps s'appelle :",["la tension du fil","le poids","la réaction","la poussée"],"On la note souvent T."],
["La force exercée par une table sur un livre posé dessus s'appelle :",["la réaction de la table","la tension","le poids","la vitesse"],"On la note souvent R."],
["La force exercée par la Terre sur un corps s'appelle :",["le poids du corps","la tension","la réaction","la masse"],"On la note P."],
["On note souvent le vecteur poids par la lettre :",["P","T","R","U"],"T désigne souvent la tension d'un fil et R la réaction d'un support."],
["Deux forces de même intensité sont représentées, à la même échelle, par des vecteurs :",["de même longueur","de même sens obligatoirement","de même origine obligatoirement","de longueurs différentes"],"La longueur du vecteur est proportionnelle à l'intensité."],
["1 kN (kilonewton) est égal à :",["1000 N","100 N","10 N","0,001 N"],"k signifie kilo, c'est-à-dire 1000."],
["Un dynamomètre fonctionne grâce :",["à l'allongement d'un ressort","à une pile","à un aimant","à un thermomètre"],"Plus la force est grande, plus le ressort s'allonge."],
["Un dynamomètre indique 3,5 N. Cette valeur est :",["l'intensité de la force","le point d'application de la force","le sens de la force","la direction de la force"],"Le dynamomètre mesure seulement l'intensité."],
["La droite d'action d'une force verticale est :",["une droite verticale","une droite horizontale","un cercle","un point"],"La droite d'action a la même direction que la force."],
["Un cheval tire une charrette vers la droite avec une corde horizontale. La force exercée par la corde sur la charrette a :",["une direction horizontale et un sens vers la droite","une direction verticale et un sens vers le haut","une direction horizontale et un sens vers la gauche","une direction verticale et un sens vers le bas"],"La corde tire la charrette dans le sens du mouvement."]]},
{sem:1,name:"Équilibre d'un solide soumis à deux forces",qs:[
["Un solide est en équilibre s'il :",["reste immobile par rapport au référentiel","accélère","tourne de plus en plus vite","tombe"],"On étudie ici l'équilibre d'un solide au repos."],
["Lorsqu'un solide est en équilibre sous l'action de deux forces, ces deux forces ont :",["la même droite d'action, des sens opposés et la même intensité","le même sens et la même intensité","des droites d'action perpendiculaires","des intensités différentes"],"Ce sont les trois conditions d'équilibre."],
["Deux forces qui maintiennent un solide en équilibre ont des sens :",["opposés","identiques","perpendiculaires","quelconques"],"Elles se compensent."],
["Deux forces qui maintiennent un solide en équilibre ont des intensités :",["égales","différentes","nulles","doubles l'une de l'autre"],"F₁ = F₂."],
["Deux forces qui maintiennent un solide en équilibre ont :",["la même droite d'action","des droites d'action parallèles et distinctes","des droites d'action perpendiculaires","des droites d'action quelconques"],"Sinon le solide se mettrait à tourner."],
["La condition d'équilibre d'un solide soumis à deux forces s'écrit, avec les vecteurs :",["F₁ + F₂ = 0 (somme vectorielle nulle)","F₁ = F₂ (vecteurs égaux)","F₁ + F₂ = 10 N","F₁ × F₂ = 0"],"Les deux vecteurs sont opposés : F₁ = −F₂."],
["Si deux forces ont la même intensité et des sens opposés, mais pas la même droite d'action, le solide :",["n'est pas en équilibre : il tourne","reste en équilibre","disparaît","devient plus lourd"],"Les deux forces doivent aussi avoir la même droite d'action."],
["Si deux forces ont la même droite d'action et le même sens, le solide :",["n'est pas en équilibre","est en équilibre","est forcément immobile","n'a pas de poids"],"Les deux forces s'ajoutent au lieu de se compenser."],
["Un solide est soumis à deux forces opposées, sur la même droite, d'intensités 3 N et 5 N. Il est :",["non en équilibre","en équilibre","immobile","sans mouvement possible"],"Les intensités ne sont pas égales."],
["Un solide léger est tiré par deux dynamomètres dans des sens opposés et reste immobile. Le premier indique 4 N. Le second indique :",["4 N","8 N","2 N","0 N"],"À l'équilibre, les deux forces ont la même intensité."],
["Un corps est suspendu à un fil et reste immobile. Il est soumis :",["à son poids et à la tension du fil","à son poids seulement","à la tension du fil seulement","à aucune force"],"Ces deux forces se compensent."],
["Un corps suspendu à un fil est en équilibre. Son poids vaut 5 N. La tension du fil vaut :",["5 N","10 N","2,5 N","0 N"],"T = P à l'équilibre."],
["Un corps suspendu à un fil est en équilibre. La tension du fil est dirigée :",["verticalement vers le haut","verticalement vers le bas","horizontalement","dans le sens du poids"],"Elle est opposée au poids, qui est dirigé vers le bas."],
["Un corps de masse 0,2 kg est suspendu à un fil (g = 10 N/kg). À l'équilibre, la tension du fil vaut :",["2 N","0,2 N","20 N","10 N"],"P = m × g = 0,2 × 10 = 2 N, et T = P."],
["Un corps de masse 500 g est suspendu à un dynamomètre (g = 10 N/kg). À l'équilibre, le dynamomètre indique :",["5 N","500 N","0,5 N","50 N"],"m = 0,5 kg ; P = 0,5 × 10 = 5 N."],
["Un livre posé sur une table horizontale est en équilibre. Il est soumis :",["à son poids et à la réaction de la table","à son poids seulement","à la réaction de la table seulement","à la tension d'un fil"],"La réaction de la table compense le poids."],
["Un livre de poids 4 N est posé sur une table horizontale. La réaction de la table est :",["verticale, vers le haut, d'intensité 4 N","verticale, vers le bas, d'intensité 4 N","horizontale, d'intensité 4 N","verticale, vers le haut, d'intensité 8 N"],"Elle est opposée au poids et de même intensité."],
["Pour un livre en équilibre sur une table, le poids et la réaction de la table ont :",["la même droite d'action verticale","des droites d'action perpendiculaires","le même sens","des intensités différentes"],"Cette droite passe par le centre de gravité du livre."],
["Un solide en équilibre sur une table est soumis à une réaction R = 12 N. Son poids vaut :",["12 N","24 N","6 N","0 N"],"P = R à l'équilibre."],
["Un solide en équilibre sur une table est soumis à une réaction R = 30 N (g = 10 N/kg). Sa masse est :",["3 kg","30 kg","300 kg","0,3 kg"],"P = R = 30 N, donc m = P / g = 30 / 10 = 3 kg."],
["Un corps suspendu à un ressort est en équilibre. Les deux forces exercées sur lui sont :",["son poids et la tension du ressort","son poids et la réaction de la table","la tension du ressort seulement","deux poids"],"La tension du ressort est dirigée vers le haut."],
["Un bateau immobile flotte sur l'eau. Il est en équilibre sous l'action :",["de son poids et de l'action de l'eau","de son poids seulement","de l'action de l'eau seulement","de l'action du vent seulement"],"L'action de l'eau est verticale, vers le haut, de même intensité que le poids."],
["À l'équilibre, les vecteurs qui représentent les deux forces ont :",["la même longueur et des sens opposés","la même longueur et le même sens","des longueurs différentes","des directions perpendiculaires"],"Ils sont portés par la même droite."],
["Avec l'échelle 1 cm pour 2 N, on représente un poids de 4 N et la tension du fil à l'équilibre. Chaque vecteur mesure :",["2 cm","4 cm","8 cm","1 cm"],"4 / 2 = 2 cm pour chacune des deux forces."],
["Un lustre de poids 20 N est suspendu au plafond par une chaîne. À l'équilibre, la chaîne exerce sur le lustre une force de :",["20 N vers le haut","20 N vers le bas","10 N vers le haut","40 N vers le haut"],"Elle compense exactement le poids."],
["On coupe le fil qui retient un corps suspendu. Le corps :",["n'est plus en équilibre : il tombe","reste en équilibre","monte","reste immobile dans l'air"],"Il n'est plus soumis qu'à son poids."],
["Un corps suspendu à un fil est en équilibre. La droite d'action commune au poids et à la tension est :",["la verticale passant par le centre de gravité","une droite horizontale","une droite inclinée","une droite quelconque"],"Le fil se place de lui-même sur cette verticale."],
["Un solide soumis à deux forces est en équilibre. Si l'on double l'intensité d'une seule des deux forces, le solide :",["n'est plus en équilibre","reste en équilibre","devient plus léger","ne subit plus aucune force"],"Les deux intensités ne sont plus égales."],
["Deux équipes tirent sur une corde en sens opposés et la corde reste immobile. Les deux équipes exercent des forces :",["de même intensité","d'intensités différentes","nulles","de même sens"],"Les deux forces se compensent."],
["Un corps est en équilibre sous l'action de deux forces F₁ et F₂. Si F₁ est dirigée vers la droite, alors F₂ est dirigée :",["vers la gauche","vers la droite","vers le haut","vers le bas"],"Elle a la même droite d'action et le sens opposé."],
["Un corps est en équilibre sous l'action de deux forces. Si F₁ = 7 N, alors F₂ vaut :",["7 N","14 N","3,5 N","0 N"],"Les deux forces ont la même intensité."],
["Pour étudier l'équilibre d'un solide, on commence par :",["faire le bilan des forces exercées sur le solide","mesurer sa vitesse","le chauffer","calculer son volume"],"On cherche les forces de contact puis les forces à distance."]]},
{sem:1,name:"Le poids et la masse",qs:[
["Le poids d'un corps est :",["la force d'attraction exercée par la Terre sur ce corps","la quantité de matière du corps","le volume du corps","la vitesse du corps"],"La quantité de matière, c'est la masse."],
["Le poids est une force :",["à distance","de contact localisée","de contact répartie","qui n'existe que sur le sol"],"La Terre attire les corps sans les toucher."],
["Le point d'application du poids est :",["le centre de gravité du corps","le point le plus haut du corps","le point de contact avec le sol","le centre de la Terre"],"On le note G."],
["La droite d'action du poids est :",["la verticale passant par le centre de gravité","une droite horizontale","une droite inclinée","une droite quelconque"],"C'est la direction indiquée par un fil à plomb."],
["Le sens du poids est :",["vers le bas, vers le centre de la Terre","vers le haut","vers la droite","vers le nord"],"Le poids fait tomber les corps."],
["L'intensité du poids se mesure avec :",["un dynamomètre","une balance","une éprouvette","un voltmètre"],"La balance mesure la masse."],
["L'unité de l'intensité du poids est :",["le newton (N)","le kilogramme (kg)","le gramme (g)","le N/kg"],"Le poids est une force."],
["La masse d'un corps se mesure avec :",["une balance","un dynamomètre","un chronomètre","un ohmmètre"],"Le dynamomètre mesure l'intensité des forces."],
["L'unité internationale de la masse est :",["le kilogramme (kg)","le newton (N)","le gramme (g)","le litre (L)"],"Son symbole est kg."],
["La masse d'un corps :",["ne dépend pas du lieu","change avec l'altitude","est nulle sur la Lune","dépend de la latitude"],"C'est une grandeur constante."],
["L'intensité du poids d'un corps :",["change selon le lieu","est la même partout","ne dépend pas de la masse","est toujours égale à la masse"],"Elle varie avec l'altitude et la latitude."],
["La relation entre l'intensité du poids et la masse est :",["P = m × g","P = m / g","P = g / m","P = m + g"],"P en newtons, m en kilogrammes, g en N/kg."],
["Dans la relation P = m × g, la lettre g représente :",["l'intensité de la pesanteur","la masse en grammes","le centre de gravité","la vitesse du corps"],"Elle s'exprime en N/kg."],
["L'intensité de la pesanteur g s'exprime en :",["N/kg","kg/N","N","kg"],"g = P / m."],
["Au niveau de la mer, l'intensité de la pesanteur vaut environ :",["9,81 N/kg","1,6 N/kg","98,1 N/kg","0,98 N/kg"],"On prend souvent g = 10 N/kg pour simplifier les calculs."],
["Un corps a une masse de 5 kg (g = 10 N/kg). Son poids vaut :",["50 N","5 N","0,5 N","15 N"],"P = 5 × 10 = 50 N."],
["Un corps a une masse de 300 g (g = 10 N/kg). Son poids vaut :",["3 N","3000 N","30 N","0,3 N"],"m = 0,3 kg, donc P = 0,3 × 10 = 3 N."],
["Un corps a un poids de 8 N (g = 10 N/kg). Sa masse est :",["0,8 kg","80 kg","8 kg","18 kg"],"m = P / g = 8 / 10 = 0,8 kg."],
["Un corps a un poids de 300 N (g = 10 N/kg). Sa masse est :",["30 kg","3000 kg","300 kg","3 kg"],"m = P / g = 300 / 10 = 30 kg."],
["Un élève a une masse de 50 kg (g = 9,8 N/kg). Son poids vaut :",["490 N","50 N","5,1 N","59,8 N"],"P = 50 × 9,8 = 490 N."],
["En un lieu, un corps de masse 2 kg a un poids de 19,6 N. L'intensité de la pesanteur en ce lieu est :",["9,8 N/kg","39,2 N/kg","17,6 N/kg","0,1 N/kg"],"g = P / m = 19,6 / 2 = 9,8 N/kg."],
["Pour calculer la masse à partir du poids, on utilise :",["m = P / g","m = P × g","m = g / P","m = P − g"],"Elle se déduit de P = m × g."],
["La courbe représentant le poids P en fonction de la masse m est :",["une droite passant par l'origine","une droite horizontale","un cercle","une courbe en cloche"],"Le poids est proportionnel à la masse."],
["En un lieu donné, le rapport P / m est :",["constant","variable d'un corps à l'autre","toujours égal à 1","nul"],"Ce rapport est l'intensité de la pesanteur g."],
["Quand l'altitude augmente, l'intensité du poids d'un corps :",["diminue","augmente","reste la même","devient infinie"],"g diminue quand on s'éloigne du centre de la Terre."],
["Quand on se déplace de l'équateur vers les pôles, l'intensité du poids d'un corps :",["augmente","diminue","reste la même","s'annule"],"g vaut 9,78 N/kg à l'équateur et 9,83 N/kg au pôle Nord."],
["L'intensité de la pesanteur est la plus grande :",["aux pôles","à l'équateur","à Casablanca","au sommet d'une montagne"],"g vaut environ 9,83 N/kg aux pôles."],
["Sur la Lune, la masse d'un astronaute est :",["la même que sur la Terre","six fois plus petite","nulle","six fois plus grande"],"La masse ne dépend pas du lieu."],
["Sur la Lune, le poids d'un astronaute est :",["plus petit que sur la Terre","le même que sur la Terre","plus grand que sur la Terre","nul"],"L'intensité de la pesanteur sur la Lune est environ six fois plus faible."],
["Sur la Lune, g vaut environ 1,6 N/kg. Le poids d'un objet de 10 kg y est :",["16 N","100 N","10 N","1,6 N"],"P = 10 × 1,6 = 16 N."],
["Un objet a une masse de 2 kg sur la Terre. Sur la Lune, sa masse est :",["2 kg","0,33 kg","12 kg","3,2 kg"],"La masse est la même partout."],
["Un dynamomètre indique 2 N pour un corps suspendu (g = 10 N/kg). La masse de ce corps est :",["200 g","2 kg","20 g","20 kg"],"m = P / g = 2 / 10 = 0,2 kg = 200 g."],
["Avec l'échelle 1 cm pour 10 N, le poids d'un corps de masse 3 kg (g = 10 N/kg) est représenté par un vecteur de :",["3 cm","30 cm","10 cm","0,3 cm"],"P = 30 N, donc 30 / 10 = 3 cm."],
["Le vecteur poids est représenté par une flèche :",["verticale, dirigée vers le bas, partant du centre de gravité","horizontale, partant du centre de gravité","verticale, dirigée vers le haut","partant du point de contact avec le sol"],"Il part du centre de gravité G."],
["Si la masse d'un corps double, au même lieu, son poids :",["double","est divisé par deux","ne change pas","est multiplié par quatre"],"Le poids est proportionnel à la masse."],
["Un sac de 1 kg a, sur la Terre, un poids d'environ :",["10 N","1 N","100 N","0,1 N"],"P = 1 × 9,81 ≈ 10 N."]]},
{sem:1,name:"La loi d'Ohm",qs:[
["Un conducteur ohmique est un dipôle qui :",["s'oppose au passage du courant électrique","produit du courant électrique","mesure la tension","stocke l'énergie électrique"],"Il est caractérisé par sa résistance R."],
["La grandeur qui caractérise un conducteur ohmique est :",["sa résistance","sa masse","sa couleur","sa longueur"],"Elle est notée R."],
["L'unité internationale de la résistance électrique est :",["l'ohm (Ω)","le volt (V)","l'ampère (A)","le watt (W)"],"Son symbole est la lettre grecque oméga."],
["1 kΩ est égal à :",["1000 Ω","100 Ω","0,001 Ω","1 000 000 Ω"],"k signifie kilo."],
["1 MΩ est égal à :",["1 000 000 Ω","1000 Ω","0,001 Ω","100 Ω"],"M signifie méga, c'est-à-dire un million."],
["4,7 kΩ correspondent à :",["4700 Ω","47 Ω","470 Ω","0,0047 Ω"],"4,7 × 1000 = 4700 Ω."],
["Pour mesurer directement une résistance, on utilise :",["un ohmmètre","un ampèremètre","un voltmètre","un dynamomètre"],"La plupart des multimètres ont une fonction ohmmètre."],
["Pour mesurer une résistance, on branche l'ohmmètre :",["aux bornes du conducteur ohmique","en série avec une pile","dans un circuit fermé alimenté","sur une seule borne"],"Le conducteur ohmique doit être hors circuit."],
["On peut aussi déterminer la valeur d'une résistance grâce :",["au code des couleurs","à sa masse","à sa température","à sa longueur"],"Les anneaux colorés indiquent la valeur de la résistance."],
["Dans le code des couleurs, le premier anneau indique :",["le premier chiffre","le nombre de zéros","la tolérance","la tension maximale"],"Le deuxième anneau donne le deuxième chiffre."],
["Dans le code des couleurs, le troisième anneau indique :",["le nombre de zéros à ajouter","le premier chiffre","la tolérance","l'intensité maximale"],"C'est le multiplicateur."],
["Dans le code des couleurs, le quatrième anneau indique :",["la tolérance (précision)","le premier chiffre","le nombre de zéros","la puissance"],"Il indique la précision de la valeur marquée."],
["Dans le code des couleurs, le noir correspond au chiffre :",["0","1","2","9"],"Noir 0, marron 1, rouge 2, orange 3, jaune 4, vert 5, bleu 6, violet 7, gris 8, blanc 9."],
["Dans le code des couleurs, le rouge correspond au chiffre :",["2","0","5","7"],"Noir 0, marron 1, rouge 2."],
["Dans le code des couleurs, le vert correspond au chiffre :",["5","3","6","8"],"Jaune 4, vert 5, bleu 6."],
["Une résistance porte les anneaux marron, noir, rouge. Sa valeur est :",["1000 Ω","102 Ω","100 Ω","12 Ω"],"Marron 1, noir 0, rouge : deux zéros, soit 1000 Ω."],
["Une résistance porte les anneaux rouge, rouge, marron. Sa valeur est :",["220 Ω","221 Ω","22 Ω","2200 Ω"],"Rouge 2, rouge 2, marron : un zéro, soit 220 Ω."],
["Une résistance porte les anneaux jaune, violet, rouge. Sa valeur est :",["4700 Ω","472 Ω","470 Ω","47 Ω"],"Jaune 4, violet 7, rouge : deux zéros, soit 4700 Ω."],
["La loi d'Ohm s'écrit :",["U = R × I","U = R / I","U = I / R","U = R + I"],"U en volts, R en ohms, I en ampères."],
["Dans la loi d'Ohm U = R × I, l'intensité I s'exprime en :",["ampères (A)","volts (V)","ohms (Ω)","watts (W)"],"Si l'intensité est donnée en mA, il faut la convertir en A."],
["D'après la loi d'Ohm, la résistance se calcule par :",["R = U / I","R = U × I","R = I / U","R = U − I"],"Elle se déduit de U = R × I."],

function copyText(text,btn){
  const done=()=>{const t=btn.textContent;btn.textContent="Copié ✓";setTimeout(()=>btn.textContent=t,1600)};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done()}catch(e){btn.textContent="Sélectionnez le texte pour le copier"}ta.remove()};

}
function toQuestions(pool,n){return shuffle(pool).slice(0,n).map(({q,ch})=>({text:q[0],answer:q[1][0],opts:shuffle(q[1]),exp:q[2],ch}))}
function poolOf(level,idx){const L=BANK[level];return idx.flatMap(i=>L.chapters[i].qs.map(q=>({q,ch:L.chapters[i].name})))}

/* ---------- Codes de quiz : "3AC-ADF" = 3AC, leçons A, D et F (A = leçon 1) ---------- */
const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const makeCode=(level,idx)=>level+"-"+idx.slice().sort((a,b)=>a-b).map(i=>ABC[i]).join("");
function parseCode(c){
  c=String(c||"").trim().toUpperCase().replace(/\s+/g,"");
  const m=c.match(/^(3AC)-?([A-Z]+)$/);if(!m)return null;
  const L=BANK[m[1]];const idx=[...new Set(m[2].split("").map(d=>ABC.indexOf(d)))].sort((a,b)=>a-b);
  if(idx.some(i=>i>=L.chapters.length))return null;
  const n=idx.reduce((t,i)=>t+L.chapters[i].qs.length,0);
  return{level:m[1],idx,code:makeCode(m[1],idx),n};
}
/* ---------- Signature des résultats (empêche de modifier la note dans le message) ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}
  let h2=h;for(const ch of s+SALT){h2^=ch.codePointAt(0);h2=Math.imul(h2,2654435761)>>>0}
  return(h.toString(36)+h2.toString(36)).toUpperCase().slice(-6)}
const sign=r=>hash([SALT,norm(r.name),norm(r.cls),r.quiz,r.score,r.total,r.date].join("|"));
const message=r=>`LaboQCM | Nom: ${r.name} | Classe: ${r.cls} | Quiz: ${r.quiz} | Note: ${r.score}/${r.total} | Date: ${r.date} | Code: ${r.sig}`;
function parseMessage(line){
  if(!/LaboQCM/i.test(line))return null;
  const g=k=>{const m=line.match(new RegExp("\\b"+k+":\\s*([^|]*)"));return m?m[1].trim():""};
  const note=g("Note").match(/(\d+)\s*\/\s*(\d+)/);if(!g("Nom")||!note)return null;
  const r={name:g("Nom"),cls:g("Classe"),quiz:g("Quiz"),score:+note[1],total:+note[2],date:g("Date"),sig:g("Code").toUpperCase()};
  r.valid=sign(r)===r.sig;return r;
}

const MAIL_RE=/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']{2,}$/;
const validMail=m=>typeof m==="string"&&m.length<=80&&MAIL_RE.test(m);
function encMail(m){try{return btoa(unescape(encodeURIComponent(m))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return""}}
function decMail(t){try{t=String(t||"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const m=decodeURIComponent(escape(atob(t))).trim().toLowerCase();return validMail(m)?m:""}catch(e){return""}}

/* ---------- Envoi automatique de la note vers la feuille Google Sheets du professeur (application web Apps Script) ---------- */
const SHEET_URL="https://script.google.com/macros/s/AKfycby6kT10v_2ImO3cWL8AR6fhEYzR0DGGDlIh3r3eJ0zCCqp1J-QGd6tb2g1WisDGLuWnZg/exec";
const canSend=()=>!!SHEET_URL&&!FRAMED;
/* Un envoi. Google répond parfois par une page d'erreur alors que la note est bien enregistrée :
   on renvoie alors la même note, le script la reconnaît (pas de doublon) et confirme. */
async function postGrade(r){
  const res=await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({name:r.name,cls:r.cls,quiz:r.quiz,score:r.score,total:r.total,date:r.date,sig:r.sig})});
  const t=await res.text();try{return JSON.parse(t)}catch(e){return null}
}
async function sendGrade(done){
  if(done.sent)return true;
  for(let k=0;k<4;k++){
    if(k)await new Promise(ok=>setTimeout(ok,k*1500));
    let j=null;try{j=await postGrade(done.rec)}catch(e){}
    if(j&&j.ok){done.sent=true;LS.set("lq-done-"+done.rec.quiz,done);return true}
    if(j&&j.error)break;
  }
  throw new Error("envoi impossible");
}
/* Au démarrage : renvoyer les notes qui n'ont pas pu partir (élève hors connexion à la fin du quiz) */
function retryPending(){
  if(!canSend())return;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf("lq-done-")===0){const d=LS.get(k,null);if(d&&d.rec&&d.auto&&!d.sent)sendGrade(d).catch(()=>{})}}}catch(e){}
}

/* ================= QUIZ NOTÉ ================= */
function examAsk(run){
  const q=run.qs[run.i],n=run.qs.length;setColor(run.level);let pick=null;
  $app.innerHTML=`
  <div class="top"><span class="count">${esc(run.name)}</span><div class="bar"><i style="width:${run.i/n*100}%"></i></div><span class="count">${run.i+1}/${n}</span></div>
  <section class="question pop"><span class="tag">Quiz ${run.quiz} · ${esc(q.ch)}</span><div class="q">${esc(q.text)}</div></section>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <button class="btn" id="next" disabled>${run.i+1<n?"Valider et continuer":"Valider et terminer"}</button>
  <p class="muted" style="text-align:center">Choisis une réponse. Tu ne pourras pas revenir en arrière.</p>`;
  const btns=[...$app.querySelectorAll(".opt")],next=document.getElementById("next");
  btns.forEach(b=>b.onclick=()=>{pick=+b.dataset.k;btns.forEach(x=>x.classList.toggle("sel",x===b));next.disabled=false});
  next.onclick=()=>{
    if(pick==null)return;
    run.picks[run.i]=q.opts[pick];run.i++;LS.set("lq-run",run);
    if(run.i<n)return examAsk(run);
    const score=run.qs.filter((x,k)=>x.answer===run.picks[k]).length;
    const rec={name:run.name,cls:run.cls,quiz:run.quiz,score,total:n,date:nowStr()};rec.sig=sign(rec);
    const done={rec,level:run.level,qs:run.qs,picks:run.picks,mail:LS.get("lq-tmail",""),auto:canSend()};
    LS.set("lq-done-"+run.quiz,done);LS.del("lq-run");examResult(done);
  };
}
function examResult(done){
  const r=done.rec,s=starsOf(r.score/r.total),msg=message(r);setColor(done.level);
  const tm=[done.mail,LS.get("lq-tmail","")].find(validMail)||"";
  const auto=canSend()&&(done.auto||done.sent);
  $app.innerHTML=`
  <section class="board result"><span class="label" style="color:var(--boardink);opacity:.85">${esc(r.name)} · ${esc(r.cls)} · Quiz ${r.quiz}</span>
    <div class="big">${r.score}/${r.total}</div><div class="stars">${starsHTML(s)}</div><p>Terminé le ${esc(r.date)}</p></section>
  <div class="card"><h2 id="sh">${auto?"Ta note pour ton professeur":"Envoie ta note à ton professeur"}</h2>
    ${auto?`<div id="sst" aria-live="polite"></div><p class="muted" id="alt" hidden>Tu peux aussi envoyer ta note toi-même :</p>`:""}
    <div id="manual" style="display:contents"${auto?" hidden":""}>
    ${tm?`<a class="btn" id="send" href="${esc(mailto(tm,r,msg))}"${FRAMED?' target="_blank" rel="noopener"':""}>Envoyer ma note par e-mail</a>
    <p class="muted">Ta messagerie s'ouvre avec le message déjà écrit : il reste à appuyer sur « Envoyer ». Si rien ne s'ouvre, copie l'adresse et le message ci-dessous, puis envoie-les toi-même.</p>
    <div class="row"><span class="label">Adresse du professeur</span></div>
    <div class="row"><span class="addr" id="tm">${esc(tm)}</span><button class="small-btn ghost" id="cpm">Copier l'adresse</button></div>`
    :`<p class="muted">Copie ce message et envoie-le à ton professeur (WhatsApp, e-mail…).</p>`}
    <div class="msg" id="msg">${esc(msg)}</div>
    <p class="muted">Ne modifie pas le message : sinon il sera refusé.</p>
    <button class="small-btn" id="cp">Copier le message</button></div></div>
  <div class="label">Correction</div>
  <div class="review">${done.qs.map((q,k)=>{const ok=q.answer===done.picks[k];return`<div class="corr ${ok?"":"wrong"}"><b>${k+1}.</b> ${esc(q.text)}<br>
    ${ok?`<span class="good">✓ ${esc(q.answer)}</span>`:`<span class="you">✗ Ta réponse : ${esc(done.picks[k])}</span><br><span class="good">✓ ${esc(q.answer)}</span>`}<br>${esc(q.exp)}</div>`}).join("")}</div>
  <button class="btn ghost" id="home">Retour à l'accueil</button>`;
  document.getElementById("cp").onclick=e=>copyText(msg,e.currentTarget);
  if(tm)document.getElementById("cpm").onclick=e=>copyText(tm,e.currentTarget);
  document.getElementById("home").onclick=home;
  if(auto){
    const sst=document.getElementById("sst"),manual=document.getElementById("manual"),alt=document.getElementById("alt");
    const show=state=>{
      if(!sst.isConnected)return;
      if(state==="ok"){sst.innerHTML=`<p class="ok-text">✓ Ta note a été envoyée à ton professeur.</p>`;manual.hidden=true;alt.hidden=true}
      else if(state==="wait"){sst.innerHTML=`<p class="muted">Envoi de ta note à ton professeur…</p>`}
      else{sst.innerHTML=`<p class="err">La note n'a pas pu être envoyée. Vérifie ta connexion Internet.</p><div class="row"><button class="small-btn" id="retry">Réessayer l'envoi</button></div>`;
        manual.hidden=false;alt.hidden=false;document.getElementById("retry").onclick=go}
    };
    const go=()=>{show("wait");sendGrade(done).then(()=>show("ok"),()=>show("ko"))};
    done.sent?show("ok"):go();
  }
}

let tLevel="3AC",tSel=[],confirmWipe=false,tMailDraft=null,tMailMsg="";
const mailKey=()=>"lq-mail-"+profUser;
/* Comptes professeurs : chaque prof crée son compte avec le code d'établissement.
   Les comptes sont enregistrés sur l'appareil (empreinte SHA-256 salée, jamais le mot de passe). */
const INVITE_HASH="bfc6fc7c67723e8dac6e5031bad3b1b8b1fe2476753e8efdbb5cecc25aacf7a1";
let profUser=null,fails=0,lockUntil=0,authMode=null;
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const accounts=()=>LS.get("lq-accounts",{});
const tokenOf=u=>(accounts()[u]||{}).hash;
const gradesKey=()=>"lq-grades-"+profUser;
(function restore(){
  let t=null;try{t=JSON.parse(sessionStorage.getItem("lq-prof")||localStorage.getItem("lq-prof")||"null")}catch(e){}
  if(t&&t.u&&t.h&&tokenOf(t.u)===t.h)profUser=t.u;
})();
function openSession(u,h,keep){
  profUser=u;fails=0;const t=JSON.stringify({u,h});
  try{sessionStorage.setItem("lq-prof",t);if(keep)localStorage.setItem("lq-prof",t)}catch(e){}
  teacher();
}
function login(){
  $app.style.setProperty("--lc","var(--c3)");

  const isNew=authMode==="new";
  $app.innerHTML=`
  <div class="top"><button class="back" id="back">← Accueil</button></div>
  <section class="board"><h1>Espace professeur</h1><p>Accès réservé aux professeurs. ${isNew?"Créez votre compte avec le code d'établissement.":"Connectez-vous pour créer des quiz et voir les notes de vos élèves."}</p></section>
  <div class="tabs" style="grid-template-columns:1fr 1fr">
    <button class="tab" id="m-in" style="--lc:var(--c2)" aria-selected="${!isNew}">Se connecter</button>
    <button class="tab" id="m-new" style="--lc:var(--c2)" aria-selected="${isNew}">Créer un compte</button></div>
  <form class="card form" id="lf" novalidate>
    <label for="lg">Identifiant</label><input id="lg" autocomplete="username" autocapitalize="none" maxlength="30" ${isNew?'placeholder="exemple : m.alaoui"':""}>
    <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="${isNew?"new-password":"current-password"}" maxlength="60">
    ${isNew?`<label for="pw2">Confirmer le mot de passe</label><input id="pw2" type="password" autocomplete="new-password" maxlength="60">
    <label for="inv">Code d'établissement</label><input id="inv" autocapitalize="characters" maxlength="20" placeholder="donné par le responsable">`:""}
    <label class="row" style="margin:0;font-weight:600" for="keep"><input type="checkbox" id="keep" style="width:18px;height:18px"> Rester connecté sur cet appareil</label>
    <p class="err" id="lerr" hidden></p>
    <button class="btn" type="submit">${isNew?"Créer mon compte":"Se connecter"}</button>
    <p class="muted">${isNew?"Le compte est enregistré sur cet appareil. Utilisez toujours le même téléphone ou ordinateur pour retrouver vos notes.":"Pas encore de compte ? Touchez « Créer un compte »."}</p>
  </form>`;
  document.getElementById("back").onclick=home;
  document.getElementById("m-in").onclick=()=>{authMode="in";login()};
  document.getElementById("m-new").onclick=()=>{authMode="new";login()};
  document.getElementById("lf").onsubmit=async e=>{
    e.preventDefault();
    const err=document.getElementById("lerr"),fail=t=>{err.textContent=t;err.hidden=false};
    const u=document.getElementById("lg").value.trim().toLowerCase(),pw=document.getElementById("pw").value;
    const keep=document.getElementById("keep").checked;
    if(Date.now()<lockUntil)return fail(`Trop d'essais. Réessayez dans ${Math.ceil((lockUntil-Date.now())/1000)} secondes.`);
    try{
      if(isNew){
        if(!/^[a-z0-9._-]{3,30}$/.test(u))return fail("Identifiant : au moins 3 caractères (lettres, chiffres, point, tiret), sans espace.");
        if(accounts()[u])return fail("Cet identifiant existe déjà sur cet appareil. Choisissez-en un autre.");
        if(pw.length<6)return fail("Le mot de passe doit avoir au moins 6 caractères.");
        if(pw!==document.getElementById("pw2").value)return fail("Les deux mots de passe ne sont pas identiques.");
        const inv=document.getElementById("inv").value.replace(/\s+/g,"").toUpperCase();
        if(await sha256("laboqcm-invite|"+inv)!==INVITE_HASH){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return fail("Code d'établissement incorrect. Demandez-le au responsable.")}
        const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
        const h=await sha256("laboqcm|"+u+"|"+salt+"|"+pw);
        const all=accounts();
        if(!Object.keys(all).length){const old=LS.get("lq-grades",null);if(old)LS.set("lq-grades-"+u,old)} /* reprise des notes de l'ancien compte par défaut */
        all[u]={salt,hash:h,created:nowStr()};LS.set("lq-accounts",all);
        authMode="in";return openSession(u,h,keep);
      }
      let h=null;
      const a=accounts()[u];if(a){const x=await sha256("laboqcm|"+u+"|"+a.salt+"|"+pw);if(x===a.hash)h=x}
      if(h)return openSession(u,h,keep);
    }catch(x){return fail("La connexion a échoué sur ce navigateur. Essayez avec Chrome.")}
    fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}
    fail("Identifiant ou mot de passe incorrect.");document.getElementById("pw").value="";
  };
}

    const lines=document.getElementById("paste").value.split(/\n+/).map(parseMessage).filter(Boolean);
    const st=document.getElementById("status");
    if(!lines.length){st.innerHTML=`<span class="err">Aucun message LaboQCM reconnu.</span>`;return}
    const all=LS.get(gradesKey(),[]);let added=0;
    lines.forEach(r=>{if(!all.some(g=>g.sig===r.sig&&norm(g.name)===norm(r.name))){all.push(r);added++}});
    LS.set(gradesKey(),all);teacher();
    document.getElementById("status").innerHTML=`<span class="ok-text">${added} note${added>1?"s":""} ajoutée${added>1?"s":""}${lines.length-added?` (${lines.length-added} déjà présente${lines.length-added>1?"s":""})`:""}.</span>`;
  };
  if(grades.length){
    document.getElementById("cptab").onclick=e=>copyText(["Nom\tClasse\tQuiz\tNote\tSur\tDate\tContrôle",...grades.map(g=>[g.name,g.cls,g.quiz,g.score,g.total,g.date,g.valid?"valide":"modifié"].join("\t"))].join("\n"),e.currentTarget);
    const w=document.getElementById("wipe");if(w)w.onclick=()=>{confirmWipe=true;teacher()};
    const w2=document.getElementById("wipe2");if(w2)w2.onclick=()=>{LS.del(gradesKey());confirmWipe=false;teacher()};
    const nw=document.getElementById("nowipe");if(nw)nw.onclick=()=>{confirmWipe=false;teacher()};
  }
}

/* ================= ENTRAÎNEMENT LIBRE ================= */
let prefs=LS.get("laboqcm2",{best:{},done:0,level:"3AC"});if(!BANK[prefs.level])prefs.level="3AC";
const savePrefs=()=>LS.set("laboqcm2",prefs);
let quiz=null;
function practiceHome(){
  const L=BANK[prefs.level];setColor(prefs.level);
  const bestMix=prefs.best[prefs.level+":mix"];
  $app.innerHTML=`
  <div class="top"><button class="back" id="back">← Accueil</button></div>
  <section class="board"><h1>Entraînement</h1><p>Révise à ton rythme. La correction s'affiche après chaque question. Ces quiz ne sont pas notés.</p></section>
  <div class="tabs">${Object.keys(BANK).map(k=>`<button class="tab" style="--lc:${BANK[k].color}" data-l="${k}" aria-selected="${k===prefs.level}">${k}<small>${BANK[k].sub}</small></button>`).join("")}</div>
  <div class="label">Leçons de ${prefs.level}</div>
  <div class="lessons">
    <button class="lesson mix" data-c="mix"><span class="num">∑</span><span class="txt"><h3>Toutes les leçons</h3><small>${QN} questions mélangées</small></span><span class="stars">${starsHTML(bestMix!=null?starsOf(bestMix):0)}</span></button>
    ${L.chapters.map((c,i)=>{const b=prefs.best[prefs.level+":"+i];return`${i===0||L.chapters[i-1].sem!==c.sem?`<div class="label" style="margin-top:8px">Semestre ${c.sem+1} · ${esc(L.sems[c.sem])}</div>`:""}
    <button class="lesson" data-c="${i}"><span class="num">${i+1}</span><span class="txt"><h3>${esc(c.name)}</h3><small>${c.qs.length} questions${b!=null?` · meilleur : ${Math.round(b*100)} %`:""}</small></span><span class="stars">${starsHTML(b!=null?starsOf(b):0)}</span></button>`}).join("")}
  </div>`;
  document.getElementById("back").onclick=home;
  $app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{prefs.level=b.dataset.l;savePrefs();practiceHome()});
  $app.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>pStart(b.dataset.c));
}
function pStart(c){
  const L=BANK[prefs.level];
  const idx=c==="mix"?L.chapters.map((_,i)=>i):[+c];
  quiz={key:prefs.level+":"+c,title:c==="mix"?"Toutes les leçons":L.chapters[+c].name,qs:toQuestions(poolOf(prefs.level,idx),QN),i:0,score:0,miss:[]};pAsk();
}
function pAsk(){
  const {qs,i}=quiz,q=qs[i],n=qs.length;
  $app.innerHTML=`
  <div class="top"><button class="back" id="back">← Leçons</button><div class="bar"><i style="width:${i/n*100}%"></i></div><span class="count">${i+1}/${n}</span></div>
  <section class="question pop"><span class="tag">${prefs.level} · ${esc(q.ch)}</span><div class="q">${esc(q.text)}</div></section>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <div id="fb" aria-live="polite"></div>
  <button class="btn" id="next" hidden>${i+1<n?"Question suivante":"Voir mon score"}</button>`;
  document.getElementById("back").onclick=practiceHome;
  const btns=[...$app.querySelectorAll(".opt")],fb=document.getElementById("fb"),next=document.getElementById("next");
  btns.forEach(b=>b.onclick=()=>{
    const good=q.opts[+b.dataset.k]===q.answer;
    if(good)quiz.score++;else quiz.miss.push(q);
    btns.forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k]===q.answer)x.classList.add("ok")});
    if(!good)b.classList.add("ko");
    fb.innerHTML=`<div class="explain ${good?"ok":"ko"} pop"><b>${good?"Bonne réponse !":"Pas tout à fait…"}</b>${esc(q.exp)}</div>`;
    next.hidden=false;next.focus();
  });
  next.onclick=()=>{quiz.i++;quiz.i<n?pAsk():pResult()};
}
function pResult(){
  const {key,title,score,qs,miss}=quiz,n=qs.length,p=score/n,prev=prefs.best[key];
  const record=prev==null||p>prev;if(record)prefs.best[key]=p;prefs.done++;savePrefs();
  const s=starsOf(p);
  const msg=s===3?"Excellent ! Tu maîtrises cette leçon.":s===2?"Très bien ! Encore un effort pour 3 étoiles.":s===1?"C'est un début. Relis ta leçon et rejoue.":"Révise la leçon puis réessaie, tu vas progresser.";
  $app.innerHTML=`
  <section class="board result"><span class="label" style="color:var(--boardink);opacity:.8">${prefs.level} · ${esc(title)}</span>
    <div class="big">${score}/${n}</div><div class="stars">${starsHTML(s)}</div>
    <p>${msg}${record&&prev!=null?" Nouveau record !":""}</p></section>
  <div class="actions"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="menu">Choisir une autre leçon</button></div>
  ${miss.length?`<div class="label">À revoir (${miss.length})</div><div class="review">${miss.map(q=>`<div class="miss">${esc(q.text)}<br><span class="good">✓ ${esc(q.answer)}</span><br>${esc(q.exp)}</div>`).join("")}</div>`:""}`;
  document.getElementById("again").onclick=()=>pStart(key.split(":")[1]);
  document.getElementById("menu").onclick=practiceHome;
}

/* Reprise automatique d'un quiz noté interrompu (rechargement de la page) */
readHash();retryPending();
const pending=LS.get("lq-run",null);
if(pending&&pending.qs&&pending.i<pending.qs.length)examAsk(pending);else home();
</script>
